<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Refinery AI Agent Demo</title>

<style>
*, *::before, *::after { box-sizing: border-box; }

:root {
  --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
          "Apple SD Gothic Neo", "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --ease-spring: cubic-bezier(.3, 1.12, .35, 1);
  --spot-r: 12px;
}

.stage {
  --brand: #76A6D7;
  --brand-600: #5A8FC5;
  --brand-700: #3F76AE;
  --brand-50: rgba(118,166,215,.13);
  --brand-100: rgba(118,166,215,.20);
  --ink-900: #EDEEF0;
  --ink-800: #C0C4CA;
  --ink-700: #959CA5;
  --ink-600: #878E97;
  --ink-500: #757C85;
  --ink-400: #424850;
  --ink-300: #32373F;
  --ink-200: #272B32;
  --ink-100: #1E2228;
  --ink-50: #17191E;
  --white: #191D22;
  --card: #1A1D23;
  --bg: #131519;
  --good: #3FB255;
  --good-50: rgba(63,178,85,.12);
  --warn: #F0A93A;
  --warn-50: rgba(240,169,58,.14);
  --bad: #E5484D;
  --bad-50: rgba(229,72,77,.12);

  --scrim: rgba(6, 8, 11, .76);
  --cap-bg: #0E1116;
  --cap-line: rgba(255,255,255,.11);
  --cap-ink: #E8EAED;
  --cap-ink-dim: #949AA3;
  --cap-eyebrow: #6E757E;
}

.stage.is-light {
  --brand: #76A6D7;
  --brand-600: #5A8FC5;
  --brand-700: #3F76AE;
  --brand-50: #EEF4FB;
  --brand-100: #DCE8F5;
  --ink-900: #16202C;
  --ink-800: #22303F;
  --ink-700: #3A4856;
  --ink-600: #5A6776;
  --ink-500: #7E8A98;
  --ink-400: #A4ADB8;
  --ink-300: #C8CED5;
  --ink-200: #E3E7EC;
  --ink-100: #EFF2F5;
  --ink-50: #F6F8FA;
  --white: #FFFFFF;
  --card: #FFFFFF;
  --bg: #FAFBFC;
  --good-50: rgba(63,178,85,.10);
  --warn-50: rgba(240,169,58,.12);
  --bad-50: rgba(229,72,77,.10);

  --scrim: rgba(22, 32, 44, .55);
  --cap-bg: #FFFFFF;
  --cap-line: rgba(22,32,44,.12);
  --cap-ink: #16202C;
  --cap-ink-dim: #5A6776;
  --cap-eyebrow: #8B95A1;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--sans);
  background: #E9ECEF;
  overflow: hidden;
}

.stagewrap { position: fixed; inset: 0; overflow: hidden; }
.stage {
  position: absolute; left: 50%; top: 50%;
  width: 1320px; height: 840px;
  transform: translate(-50%, -50%) scale(var(--k, 1));
  transform-origin: center center;
  border-radius: 14px;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink-900);
  /* 한글은 기본값이 음절 단위로 끊겨 "에/이전트" 처럼 갈라진다. 어절 단위로 끊고,
     끊을 곳이 없는 긴 토큰만 예외로 넘긴다. */
  word-break: keep-all;
  overflow-wrap: break-word;
  box-shadow: 0 40px 90px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06);
}
.stage.is-light { box-shadow: 0 30px 70px rgba(20,30,45,.18), 0 0 0 1px rgba(20,30,45,.08); }

.app {
  position: absolute; inset: 0;
  display: flex;
  background:
    radial-gradient(90% 46% at 50% 0%, rgba(118,166,215,.055) 0%, transparent 62%),
    var(--white);
}
.app::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(70% 40% at 78% 8%, rgba(118,166,215,.10) 0%, transparent 60%);
  transition: opacity .8s ease;
}
.app[data-state="running"]::before { opacity: 1; animation: ambient 5.5s ease-in-out infinite; }
.app[data-state="await"]::before {
  opacity: 1; animation: none;
  background: radial-gradient(70% 40% at 78% 8%, rgba(240,169,58,.10) 0%, transparent 60%);
}
@keyframes ambient { 0%,100% { opacity: .5; } 50% { opacity: 1; } }

.rail {
  flex: none; width: 252px; min-height: 0;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--ink-100);
  background: color-mix(in srgb, var(--white) 62%, transparent);
}
.stage:not(.is-light) .rail { border-right-color: var(--ink-200); }
.rail-top { display: flex; align-items: center; gap: 8px; padding: 12px 10px 8px; flex: none; }
.newbtn {
  flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; border-radius: 9px; border: 0; cursor: pointer;
  font-family: inherit; font-size: 12.5px; font-weight: 600; color: #FFFFFF;
  background: linear-gradient(135deg, var(--brand), var(--brand-700));
}
.newbtn svg { color: #FFF; }
.iconbtn {
  width: 28px; height: 28px; flex: none; display: inline-flex; align-items: center; justify-content: center;
  border: 0; border-radius: 7px; background: transparent; color: var(--ink-500); cursor: pointer;
}
.views { display: flex; flex-direction: column; gap: 1px; padding: 4px 8px 10px; flex: none; }
.view {
  position: relative; display: flex; align-items: center; gap: 9px;
  font-family: inherit; font-size: 12.5px; font-weight: 500; color: var(--ink-600);
  background: transparent; border: 0; border-radius: 8px; padding: 7px 10px;
  cursor: pointer; text-align: left; transition: all .14s ease;
}
.view > svg { color: var(--ink-400); flex: none; }
.view.is-active { background: var(--brand-50); color: var(--brand-700); font-weight: 600; }
.stage:not(.is-light) .view.is-active { color: var(--brand); }
.view.is-active > svg { color: currentColor; }
.view.is-active::before {
  content: ""; position: absolute; left: -8px; top: 8px; bottom: 8px; width: 2.5px;
  border-radius: 0 3px 3px 0; background: var(--brand);
}
.searchbar { padding: 0 10px 8px; flex: none; }
.search {
  display: flex; align-items: center; gap: 7px;
  border: 1px solid var(--ink-200); border-radius: 9px; padding: 6px 9px;
  color: var(--ink-400); font-size: 12px;
}
.raillabel {
  font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
  color: var(--ink-500); padding: 10px 16px 5px;
}
.sessions { padding: 0 10px; display: flex; flex-direction: column; gap: 1px; }
.session {
  display: flex; align-items: center; gap: 8px; width: 100%;
  border: 0; background: transparent; border-radius: 8px; padding: 7px 9px;
  font-family: inherit; text-align: left; cursor: pointer;
}
.session.is-active { background: var(--ink-100); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.stage.is-light .session.is-active { box-shadow: 0 1px 2px rgba(20,30,45,.06); }
.dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--ink-300); }
.dot.is-running { background: var(--brand); animation: pulse 1.4s ease-in-out infinite; }
.dot.is-await { background: var(--warn); }
.dot.is-done { background: var(--good); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.session-main { min-width: 0; flex: 1; }
.session-title {
  display: block; font-size: 12.5px; font-weight: 500; color: var(--ink-800);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.session.is-active .session-title { color: var(--ink-900); font-weight: 600; }
.session-when { display: block; font-size: 10.5px; color: var(--ink-500); margin-top: 1px; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.chatbar {
  flex: none; display: flex; align-items: center; gap: 10px;
  padding: 7px 16px; border-bottom: 1px solid var(--ink-100);
  background: color-mix(in srgb, var(--white) 70%, transparent);
}
.stage:not(.is-light) .chatbar { border-bottom-color: var(--ink-200); }
.chat-title {
  font-size: 12.5px; font-weight: 600; color: var(--ink-900);
  max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chat-status { font-size: 11.5px; color: var(--ink-500); min-height: 18px; display: flex; align-items: center; }
.chat-live { display: inline-flex; align-items: center; gap: 6px; color: var(--brand); font-weight: 600; }
.stage.is-light .chat-live { color: var(--brand-700); }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); animation: pulse 1.4s ease-in-out infinite; }
.chat-await { color: var(--warn); font-weight: 600; }
.chat-done { color: var(--good); font-weight: 600; }
.bar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.density { display: flex; gap: 2px; background: var(--ink-100); border-radius: 8px; padding: 2px; }
.stage.is-light .density { background: var(--ink-50); }
.density-btn {
  font-family: inherit; font-size: 11px; font-weight: 500; color: var(--ink-500);
  background: transparent; border: 0; border-radius: 6px; padding: 3px 9px; cursor: pointer;
}
.density-btn.is-active { color: var(--ink-900); background: var(--ink-200); font-weight: 600; }
.stage.is-light .density-btn.is-active { background: var(--white); box-shadow: 0 1px 4px rgba(20,30,45,.1); }

.canvas { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; }
.canvas::-webkit-scrollbar { width: 8px; }
.canvas::-webkit-scrollbar-thumb { background: var(--ink-300); border-radius: 4px; }
.thread { max-width: 768px; margin: 0 auto; padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 10px; }

.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 0 40px; text-align: center; }
.orb {
  width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
  color: #FFF; background: linear-gradient(135deg, var(--brand), var(--brand-700));
  box-shadow: 0 8px 28px rgba(118,166,215,.34); margin-bottom: 16px;
  animation: breathe 3.4s ease-in-out infinite;
}
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.empty-title { font-size: 21px; font-weight: 700; color: var(--ink-900); margin: 0 0 6px; letter-spacing: -.01em; }
.empty-sub { font-size: 12.5px; line-height: 1.6; color: var(--ink-500); margin: 0 0 20px; max-width: 480px; }
.empty-cards { display: flex; flex-direction: column; gap: 7px; width: 100%; max-width: 470px; }
.empty-card {
  display: flex; align-items: center; gap: 11px; text-align: left;
  font-family: inherit; font-size: 12.5px; color: var(--ink-800);
  border: 1px solid var(--ink-200); border-radius: 11px; background: transparent;
  padding: 11px 13px; cursor: pointer;
}
.empty-card-ic { color: var(--brand); display: flex; flex: none; }

.row { display: flex; }
.row--user { justify-content: flex-end; }
.user-bubble {
  max-width: 82%; font-size: 13.5px; line-height: 1.55; color: #FFFFFF;
  background: linear-gradient(135deg, var(--brand), var(--brand-700));
  border-radius: 15px 15px 4px 15px; padding: 9px 14px;
  box-shadow: 0 4px 14px rgba(29,46,82,.18);
  animation: userin .3s var(--ease-spring) both;
}
@keyframes userin { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }

.text { font-size: 13.5px; line-height: 1.65; color: var(--ink-800); max-width: 74ch; }
.text strong { color: var(--ink-900); font-weight: 650; }
.word { animation: wordin .28s var(--ease-out) both; }
@keyframes wordin { from { opacity: 0; filter: blur(4px); } to { opacity: 1; filter: none; } }

.think { border-left: 2px solid var(--ink-200); padding-left: 11px; }
.think.is-live { border-left-color: var(--brand-100); }
.fold-head {
  display: flex; align-items: center; gap: 7px; width: 100%;
  font-family: inherit; font-size: 12px; font-weight: 500; color: var(--ink-500);
  background: transparent; border: 0; padding: 3px 0; cursor: pointer;
}
.caret { transition: transform .18s var(--ease-out); color: var(--ink-400); }
.caret.is-open { transform: rotate(90deg); }
.fold { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s var(--ease-out); }
.fold.is-open { grid-template-rows: 1fr; }
.fold-clip { overflow: hidden; min-height: 0; }
.think-body { font-size: 12px; line-height: 1.6; color: var(--ink-500); padding: 4px 0 6px; }

.tools {
  border: 1px solid var(--ink-200); border-radius: 12px;
  background: color-mix(in srgb, var(--white) 55%, transparent);
  padding: 7px 12px; animation: itemin .3s var(--ease-out) both;
  transition: border-color .2s ease;
}
.tools.is-live { border-color: var(--brand-100); }
@keyframes itemin { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
.tools-ic { display: flex; color: var(--ink-400); }
.tools.is-live .tools-ic { color: var(--brand); }
.tools-label { font-size: 12px; font-weight: 500; }
.tools-count { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--ink-400); font-variant-numeric: tabular-nums; }
.tools-list { display: flex; flex-direction: column; gap: 2px; padding: 6px 0 3px; }
.tool {
  display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap;
  font-size: 11.5px; padding: 3px 0; animation: itemin .22s var(--ease-out) both;
}
.tool-ic { display: flex; align-self: center; color: var(--good); flex: none; }
.tool.is-running .tool-ic { color: var(--brand); }
.tool-name { font-weight: 600; color: var(--ink-800); flex: none; }
.tool-args { color: var(--ink-400); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46%; }
.tool-sum { color: var(--ink-600); flex-basis: 100%; padding-left: 19px; }
.verified {
  display: inline-flex; align-items: center; gap: 3px; flex: none;
  font-size: 9.5px; font-weight: 700; color: var(--good);
  background: var(--good-50); border-radius: 999px; padding: 1px 7px;
  animation: pop .3s var(--ease-spring) both;
}
@keyframes pop { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: none; } }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.plan {
  border: 1px solid var(--ink-200); border-radius: 13px;
  background: linear-gradient(180deg, var(--ink-100), transparent 75%);
  padding: 11px 14px; animation: itemin .32s var(--ease-out) both;
}
.stage.is-light .plan {
  border-color: var(--brand-100);
  background: linear-gradient(180deg, var(--brand-50), color-mix(in srgb, var(--white) 40%, transparent) 70%);
}
.plan-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.plan-ring { width: 20px; height: 20px; transform: rotate(-90deg); flex: none; }
.plan-ring-bg { fill: none; stroke: var(--ink-300); stroke-width: 2.5; }
.plan-ring-fg { fill: none; stroke: var(--brand); stroke-width: 2.5; stroke-linecap: round; transition: stroke-dashoffset .6s var(--ease-out); }
.plan-title { font-size: 12.5px; font-weight: 700; color: var(--ink-900); }
.plan-count { font-family: var(--mono); font-size: 11px; color: var(--ink-500); font-variant-numeric: tabular-nums; }
.plan-steps { display: flex; flex-direction: column; gap: 2px; }
.plan-step { display: flex; align-items: center; gap: 9px; font-size: 12.5px; padding: 3.5px 0; }
.plan-step-ic { display: flex; width: 16px; justify-content: center; color: var(--ink-300); flex: none; }
.plan-step-title { color: var(--ink-500); transition: color .25s ease; }
.plan-step.is-in_progress .plan-step-title { color: var(--ink-900); font-weight: 600; }
.plan-step.is-completed .plan-step-title { color: var(--ink-600); }
.plan-spin { color: var(--brand); }
.check { width: 15px; height: 15px; }
.check-circle { fill: var(--good-50); stroke: var(--good); stroke-width: 1.4; }
.check-mark {
  fill: none; stroke: var(--good); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 1; animation: draw .45s var(--ease-out) both;
}
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }

.artifact {
  width: 100%; border: 1px solid var(--ink-200); border-radius: 13px;
  background: var(--card); overflow: hidden;
  box-shadow: 0 3px 14px rgba(0,0,0,.14);
  animation: itemin .34s var(--ease-out) both;
}
.stage.is-light .artifact { border-color: var(--ink-100); box-shadow: 0 3px 14px rgba(20,30,45,.05); }
.artifact-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--ink-200); }
.stage.is-light .artifact-head { border-bottom-color: var(--ink-100); }
.artifact-ic {
  width: 24px; height: 24px; border-radius: 7px; flex: none; display: grid; place-items: center;
  color: var(--brand); background: var(--ink-100);
}
.stage.is-light .artifact-ic { color: var(--brand-700); background: var(--brand-50); }
.artifact-title { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; color: var(--ink-900); }
.artifact-meta { font-size: 10.5px; color: var(--ink-400); flex: none; }
.artifact-body { padding: 10px 12px; }
.chart { width: 100%; height: auto; display: block; }
.chart-line { fill: none; stroke: var(--brand); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 1; animation: draw .9s var(--ease-out) both; }
.chart-area { fill: color-mix(in srgb, var(--brand) 12%, transparent); }
.chart-dot { fill: var(--brand); }
.chart-dot.is-anomaly { fill: var(--bad); }
.chart-th { stroke: var(--warn); stroke-width: 1; stroke-dasharray: 4 4; }
.chart-thlabel { font-size: 9px; fill: var(--warn); font-family: var(--mono); }
.chart-grid { stroke: var(--ink-200); stroke-width: 1; }
.chart-ax { font-size: 9px; fill: var(--ink-500); font-family: var(--mono); }
.mtable { width: 100%; border-collapse: collapse; font-size: 12px; }
.mtable th {
  text-align: left; font-size: 10.5px; font-weight: 600; color: var(--ink-500);
  padding: 4px 8px; border-bottom: 1px solid var(--ink-200); white-space: nowrap;
}
.mtable td { padding: 5.5px 8px; color: var(--ink-800); border-bottom: 1px solid var(--ink-100); }
.mtable tr:last-child td { border-bottom: 0; }
.mtable td.is-num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
.pill.is-bad { color: var(--bad); background: var(--bad-50); }
.pill.is-warn { color: var(--warn); background: var(--warn-50); }

.approval {
  border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
  border-radius: 14px; background: var(--warn-50); overflow: hidden;
  animation: slideup .3s var(--ease-out) both;
  transition: border-color .35s ease, background .35s ease;
}
@keyframes slideup { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.approval.is-resolved { border-color: var(--ink-200); background: color-mix(in srgb, var(--white) 50%, transparent); }
.approval-head {
  display: flex; align-items: center; gap: 8px; padding: 10px 13px;
  font-size: 12.5px; font-weight: 600; color: var(--warn);
  border-bottom: 1px solid color-mix(in srgb, var(--warn) 20%, transparent);
  transition: color .35s ease, border-color .35s ease;
}
.approval.is-resolved .approval-head { color: var(--ink-500); border-bottom-color: var(--ink-200); }
.approval-tier {
  margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: .03em;
  padding: 1.5px 8px; border-radius: 999px; background: var(--warn); color: #FFFFFF;
  transition: background .35s ease; white-space: nowrap;
}
.approval.is-resolved .approval-tier { background: var(--ink-300); }
.approval-item { display: flex; align-items: flex-start; gap: 12px; padding: 11px 13px; transition: opacity .3s ease; }
.approval-item + .approval-item { border-top: 1px dashed color-mix(in srgb, var(--warn) 22%, transparent); }
.approval.is-resolved .approval-item + .approval-item { border-top-color: var(--ink-200); }
.approval-item.is-denied { opacity: .62; }
.approval-item-main { flex: 1; min-width: 0; }
.approval-item-title { font-size: 13px; font-weight: 600; color: var(--ink-900); }
.approval-params { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 5px; font-size: 12px; color: var(--ink-800); }
.approval-k { color: var(--ink-500); margin-right: 6px; }
.approval-impact { margin-top: 5px; font-size: 11.5px; color: var(--ink-500); }
.approval-actions { display: flex; gap: 6px; flex: none; align-items: center; }
.btn {
  font-family: inherit; font-size: 12px; font-weight: 600; border-radius: 8px;
  padding: 5px 13px; cursor: pointer; border: 1px solid transparent; white-space: nowrap;
  transition: transform .14s ease, filter .14s ease;
}
.btn--primary { color: #FFFFFF; background: var(--brand-700); border-color: var(--brand-700); }
.btn--ghost { color: var(--ink-600); background: var(--ink-100); border-color: var(--ink-200); }
.btn.is-press { transform: scale(.93); filter: brightness(1.15); }
.decision { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; white-space: nowrap; animation: pop .3s var(--ease-spring) both; }
.decision.is-allowed { color: var(--good); }
.decision.is-denied { color: var(--ink-500); }

.turnend { padding-top: 2px; animation: itemin .4s var(--ease-out) both; }

.omap { width: 100%; height: auto; display: block; }

.omap-edge.is-path { stroke: var(--brand); stroke-width: 2; }

/* 강조 영역 둘레를 네 판으로 덮는다. clip-path 로 구멍을 뚫으면 배경색은 잘리지만
   backdrop-filter 는 잘리지 않아 흐림이 구멍 안까지 새어 든다(무대에 transform 이
   걸린 상태에서 실측 확인). 판의 경계가 곧 흐림의 경계여야 강조 영역이 선명하게 남는다.
   네 판만으로는 모서리가 각지므로, 모서리에는 흐림 없이 색만 입힌 패치를 덧대
   테두리와 같은 반경을 낸다. 위치는 트랜지션하지 않아 제자리에서 나타나고,
   사라질 때는 아주 빠르게 뺀다. */
.scrim, .scrim-b {
  position: absolute; pointer-events: none; z-index: 39;
  opacity: 0;
  transition: opacity .3s ease;
}
/* 어둡게 까는 층. 색은 clip-path 로 잘리므로 한 장이면 되고, 모서리도 테두리와 같은 반경으로 둥글다. */
.scrim { inset: 0; background: var(--scrim); }
/* 흐리는 층. backdrop-filter 는 clip-path 로 잘리지 않아 강조 영역까지 번지므로,
   판의 경계 자체를 흐림의 경계로 삼는다. 색이 없어 판 사이 이음새가 드러나지 않는다. */
.scrim-b {
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}
.scrim.is-on, .scrim-b.is-on { opacity: 1; }
.scrim:not(.is-on), .scrim-b:not(.is-on) { transition: opacity .11s ease; }

.spot {
  position: absolute; pointer-events: none; border-radius: var(--spot-r);
  opacity: 0;
  transition: opacity .3s ease;
  z-index: 40;
}
.spot:not(.is-on) { transition: opacity .11s ease; }
.spot::after {
  content: ""; position: absolute; inset: -1px; border-radius: inherit;
  border: 1px solid rgba(118,166,215,.5);
  box-shadow: 0 0 0 1px rgba(0,0,0,.25), 0 0 22px rgba(118,166,215,.22);
}
.spot.is-on { opacity: 1; }

.cap {
  position: absolute; z-index: 50; width: 348px;
  background: var(--cap-bg); border: 1px solid var(--cap-line); border-radius: 13px;
  padding: 15px 17px 16px;
  box-shadow: 0 24px 60px rgba(0,0,0,.45);
  opacity: 0; transform: translateY(6px);
  transition: opacity .3s ease, transform .3s var(--ease-out);
  pointer-events: none;
}
.cap:not(.is-on) { transition: opacity .11s ease; }
.stage.is-light .cap { box-shadow: 0 24px 60px rgba(20,30,45,.22); }
.cap.is-on { opacity: 1; transform: none; }
.cap-eyebrow {
  display: flex; align-items: center; gap: 7px;
  font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .16em;
  text-transform: uppercase; color: var(--cap-eyebrow); margin-bottom: 8px;
}
.cap-eyebrow b { color: var(--cap-ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.cap-rule { flex: 1; height: 1px; background: var(--cap-line); }
.cap-title {

.cap-body { font-size: 13px; line-height: 1.72; color: var(--cap-ink-dim); margin: 0; max-width: 46ch; }

.endcard {
  position: absolute; left: 50%; bottom: 26px; transform: translate(-50%, 10px); z-index: 65;

}
.stage.is-light .endcard { box-shadow: 0 22px 54px rgba(20,30,45,.2); }
.endcard.is-on { opacity: 1; visibility: visible; transform: translate(-50%, 0); }

  let elapsed = 0, elapsedTimer = null;
  function setPhase(phase) {
    app.dataset.state = phase === "running" ? "running" : phase === "await" ? "await" : "idle";
    const s = $("chatStatus"), dot = $("activeDot");
    dot.className = "dot " + (phase === "running" ? "is-running" : phase === "await" ? "is-await" : phase === "done" ? "is-done" : "");
    if (phase === "running") {
      s.innerHTML = '<span class="chat-live"><span class="live-dot"></span><span>' + T.stWorking + ' · <span id="elapsed">' + elapsed + '</span>s</span></span>';
    } else if (phase === "await") {
      s.innerHTML = '<span class="chat-await">' + T.stAwait + '</span>';
    } else if (phase === "done") {
      s.innerHTML = '<span class="chat-done">' + T.stDone + '</span>';
    } else { s.innerHTML = ""; }
    $("sendBtn").classList.toggle("is-busy", phase === "running");

     세는데 턴 푸터는 47초라고 적어, 화면 안에서 두 숫자가 어긋난다. */
  function startClock() {
    stopClock();
    elapsedTimer = setInterval(() => {
      elapsed += 1;
      const e = $("elapsed"); if (e) e.textContent = elapsed;
    }, 1000 / SPEED);
  }
  function stopClock() { if (elapsedTimer) clearInterval(elapsedTimer); elapsedTimer = null; }

  function chartSVG(vals, thIdx, thVal) {
    const w = 660, h = 168, pad = 20;
    // 임계값을 축 범위에 포함시킨다. 데이터 최대보다 큰 임계선이 플롯 밖으로 밀려나던 문제.
    const lo = Math.min(...vals, thVal), hi = Math.max(...vals, thVal);
    const pad10 = (hi - lo) * 0.12 || 1;
    const min = lo - pad10, max = hi + pad10, span = (max - min) || 1;
    const pts = vals.map((v, i) => [
      pad + (i / (vals.length - 1)) * (w - pad * 2),
      h - pad - ((v - min) / span) * (h - pad * 2)
    ]);
    const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const area = line + " L" + pts[pts.length - 1][0].toFixed(1) + " " + (h - pad) + " L" + pad + " " + (h - pad) + " Z";
    const thY = h - pad - ((thVal - min) / span) * (h - pad * 2);
    const grid = [0.25, 0.5, 0.75].map((f) => {
      const y = pad + f * (h - pad * 2);
      return '<line class="chart-grid" x1="' + pad + '" y1="' + y + '" x2="' + (w - pad) + '" y2="' + y + '"/>';
    }).join("");
    const dots = pts.map((p, i) =>
      '<circle class="chart-dot' + (i >= thIdx ? " is-anomaly" : "") + '" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (i >= thIdx ? 3.6 : 2.2) + '"/>').join("");
    const labels = pts.map((p, i) =>
      '<text class="chart-ax" x="' + p[0].toFixed(1) + '" y="' + (h - 5) + '" text-anchor="middle">' + T.chartX[i] + '</text>').join("");
    return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + T.chartTitle + '">' +
      grid + '<path class="chart-area" d="' + area + '"/><path class="chart-line" d="' + line + '" pathLength="1"/>' +
      '<line class="chart-th" x1="' + pad + '" y1="' + thY.toFixed(1) + '" x2="' + (w - pad) + '" y2="' + thY.toFixed(1) + '"/>' +
      '<text class="chart-thlabel" x="' + (w - pad) + '" y="' + (thY - 5).toFixed(1) + '" text-anchor="end">' + T.chartTh + '</text>' +
      dots + labels + '</svg>';
  }

    return '<svg class="omap" viewBox="0 0 660 200" role="img" aria-label="' + T.omapTitle + '">' +

  /* ─────────────────────── 스포트라이트 ─────────────────────── */
  const PAD = 10;
  function rectOf(sel) {
    // 선택자 또는 요소. 같은 클래스의 산출물이 여럿이라 선택자로는 특정할 수 없다.
    const node = typeof sel === "string" ? document.querySelector(sel) : sel;
    if (!node) return null;
    const sr = stage.getBoundingClientRect(), r = node.getBoundingClientRect();
    return { x: (r.left - sr.left) / K, y: (r.top - sr.top) / K, w: r.width / K, h: r.height / K };
  }
  function placeCap(box) {
    const CW = 348, GAP = 22, M = 22;
    const ch = cap.offsetHeight || 168;
    let left, top;
    if (box.x + box.w + GAP + CW + M <= STAGE_W) left = box.x + box.w + GAP;
    else if (box.x - GAP - CW >= M) left = box.x - GAP - CW;
    else left = Math.min(Math.max(box.x, M), STAGE_W - CW - M);
    if (left >= box.x + box.w || left + CW <= box.x) {
      top = Math.min(Math.max(box.y + box.h / 2 - ch / 2, M), STAGE_H - ch - M);
    } else {
      top = box.y + box.h + GAP;
      if (top + ch + M > STAGE_H) top = Math.max(box.y - GAP - ch, M);
    }
    cap.style.left = left + "px";
    cap.style.top = top + "px";
  }
  function showSpot(sel, num, kicker, title, body) {
    const raw = rectOf(sel);
    if (!raw) return;
    const M = 9;
    const x1 = Math.max(raw.x - PAD, M), y1 = Math.max(raw.y - PAD, M);
    const x2 = Math.min(raw.x + raw.w + PAD, STAGE_W - M);
    const y2 = Math.min(raw.y + raw.h + PAD, STAGE_H - M);
    const box = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
    place(spot, box.x, box.y, box.w, box.h);
    const p = "path(evenodd, '" + holePath(box.x, box.y, box.w, box.h, SPOT_R) + "')";
    scrim.style.clipPath = p;
    scrim.style.webkitClipPath = p;
    place(blurT, 0, 0, STAGE_W, box.y);
    place(blurB, 0, y2, STAGE_W, STAGE_H - y2);
    place(blurL, 0, box.y, box.x, box.h);
    place(blurR, x2, box.y, STAGE_W - x2, box.h);
    spot.classList.add("is-on");
    veil.forEach((n) => n.classList.add("is-on"));
    $("capNum").textContent = String(num).padStart(2, "0");
    $("capKicker").textContent = kicker;
    $("capTitle").textContent = title;
    $("capBody").innerHTML = body;
    cap.classList.add("is-on");
    placeCap(box);
  }
  function hideSpot() {
    spot.classList.remove("is-on");
    veil.forEach((n) => n.classList.remove("is-on"));
    cap.classList.remove("is-on");
  }

  async function chapter(i, sel) {
    await wait(reduce ? 60 : 260);
    const c = T.chapters[i];
    showSpot(sel, i + 1, c[0], c[1], c[2]);
    const chars = c[2].replace(/<[^>]+>/g, "").length + c[1].length;
    await dwell(Math.min(Math.max(1100 + chars * 17, 1900), 3800));
    hideSpot();
    await wait(reduce ? 60 : 320);
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("is-on");
    setTimeout(() => toastEl.classList.remove("is-on"), 1500);
  }

  /* ─────────────────────────── 시나리오 ─────────────────────────── */
  function resetStage() {
    stopClock(); elapsed = 0; planNode = null;
    thread.innerHTML = ""; thread.style.display = "none";
    $("empty").style.display = "";
    $("chatTitle").style.display = "none";
    $("activeSessionTitle").textContent = T.s0idle;
    $("activeSessionWhen").textContent = T.s0w;
    $("chatView").style.display = "flex";
    $("inputPh").textContent = T.phIdle;
    $("endcard").classList.remove("is-on");
    document.querySelectorAll("#views .view").forEach((v, k) => v.classList.toggle("is-active", k === 0));
    setPhase("idle");
    hideSpot();
  }

  async function run() {
    resetStage();

    /* 01 통제 */
    await chapter(0, "#modes");

    $("inputPh").textContent = T.prompt;
    await wait(700);
    addUser(T.prompt);
    $("inputPh").textContent = T.phFollow;
    setPhase("running"); startClock();
    await wait(420);

    const th = addThinking();
    await think(th, T.think[0], 460);
    await think(th, T.think[1], 500);
    await think(th, T.think[2], 480);
    thinkDone(th, 4);
    await wait(240);

    setPlan(["in_progress", "pending", "pending", "pending"]);
    await wait(380);

    /* 전수 탐색 + 제약 교차검증 */
    const g1 = addTools();
    const delays = [620, 900, 820, 980];
    for (let i = 0; i < T.steps.length; i++) {
      const s = T.steps[i];
      const row = toolStart(g1, s[0], s[1]);
      await wait(delays[i]);
      toolEnd(g1, row, s[2], i === T.steps.length - 1);
      if (i < T.steps.length - 1) await wait(190);
    }
    toolsDone(g1);
    await wait(300);

    /* 02 규모 */
    await chapter(1, ".tools");

    setPlan(["completed", "in_progress", "pending", "pending"]);
    await wait(280);
    await addText(T.text1);
    await wait(240);

    addArtifact("chart", T.chartTitle, "v1", chartSVG([3180, 3260, 3210, 3420, 3640, 4010, 4180], 6, 4200));
    await wait(620);

    /* 온톨로지 맵. 관계를 읽는다는 증거 */
    const mapArt = addArtifact("map", T.omapTitle, "v1", omapSVG());
    await wait(660);

    /* 03 맥락 */
    await chapter(2, mapArt);

    setPlan(["completed", "completed", "in_progress", "pending"]);
    await wait(280);
    addArtifact("table", T.tableTitle, "v1", tableHTML(T.tableRows));
    await wait(700);

    /* 사용자 수정 요청 → 재작성 */
    addUser(T.revise);
    await wait(420);
    const g2 = addTools();
    const r2 = toolStart(g2, T.step2[0], T.step2[1]);
    await wait(860);
    toolEnd(g2, r2, T.step2[2], true);
    toolsDone(g2);
    await wait(260);
    const tableV2 = addArtifact("table", T.tableTitle2, "v2", tableHTML(T.tableRows2));
    await wait(680);

    /* 04 수정 */
    await chapter(3, tableV2);

    setPlan(["completed", "completed", "completed", "in_progress"]);
    await wait(300);
    await addText(T.text2);
    await wait(280);

    const card = addApproval();
    setPhase("await"); stopClock();
    await wait(520);

    /* 05 승인 */
    await chapter(4, ".approval");

    await decide(card, "a0", true);
    await wait(440);
    await decide(card, "a1", true);
    await wait(440);
    await decide(card, "a2", false);
    card.classList.add("is-resolved");
    await wait(380);
    toast(T.toastDecided);

    setPhase("running"); startClock();
    await wait(300);

    const g3 = addTools();
    const r3 = toolStart(g3, T.step3[0], T.step3[1]);
    await wait(840);
    toolEnd(g3, r3, T.step3[2]);
    toolsDone(g3);
    await wait(260);

    /* 절감 리포트 */
    const reportArt = addArtifact("doc", T.reportTitle, "v1", reportHTML());
    await wait(640);

    /* 06 산출물 */
    await chapter(5, reportArt);

    await addText(T.text3);
    await wait(240);
    setPlan(["completed", "completed", "completed", "completed"]);
    await wait(360);

    setPhase("done"); stopClock();
    addTurnEnd();
    await wait(520);

    /* 07 확장 */
    await chapter(6, "#sessions");

    await wait(500);
    $("endcard").classList.add("is-on");
    await dwell(3600);
    $("endcard").classList.remove("is-on");
    await wait(700);
    start(); // 무한 반복
  }

  function start() {
    epoch += 1;
    $("endcard").classList.remove("is-on");
    run().catch((e) => { if (e !== ABORT) throw e; });
  }

  applyStatic();
  setPhase("idle");

  /* 화면에 들어왔을 때 시작한다. 브라우저는 보이지 않는 요소의 프레임을 멈추므로,
     페이지 하단에 끼워 넣고 로드 시점에 재생하면 방문자가 스크롤해 내려왔을 때
     처음이 아니라 중간부터 보게 된다. */
  const io = new IntersectionObserver((entries) => {
    if (entries.some((e) => e.isIntersecting)) { io.disconnect(); start(); }
  }, { threshold: 0.35 });
  io.observe(stage);
})();
</script>
