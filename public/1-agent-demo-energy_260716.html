/* ═══════════════════════════════════════════
   Refinery Brand Tokens — Brandkit 2026
   "Refining complexity into pure insight"
   ═══════════════════════════════════════════ */

:root {
  /* Brand Core */
  --brand-onto-navy: #1D2E52;
  --brand-refined-blue: #76A6D7;
  --brand-deep-raw-black: #0B0E14;

  /* Brand Gradient (Hero · Auth · Onboarding) */
  --brand-gradient: linear-gradient(
    135deg,
    #1D2E52 0%,
    #76A6D7 40%,
    #0B0E14 100%
  );

  /* Motion */
  --motion-fast: 120ms ease-out;
  --motion-base: 160ms cubic-bezier(.2,.8,.2,1);
  --motion-slow: 240ms cubic-bezier(.2,.8,.2,1);
  --motion-hero: 400ms cubic-bezier(.16,1,.3,1);

  /* 페이지 콘텐츠 최대 폭 (조직 관리 페이지 공통 — .rfn-page-canvas).
     드리프트(max-w-5xl/1180/1200)를 단일 노브로 통일. 넓은 페이지는 이 변수만 로컬 오버라이드. */
  --rfn-content-max: 1024px;

  /* 차트 툴팁 = DS "Data · Graph Popover" (.cf-tip) — 라이트/다크 공통 "항상 다크" 오버레이.
     차트 면 위에 뜨는 고대비 오버레이라 테마와 무관하게 다크를 유지한다(레퍼런스 디자인).
     이 토큰은 테마 블록에서 오버라이드하지 않는다(아래 [data-theme] 에 재정의 없음 = 항상 다크). */
  --chart-tooltip-bg: #1F2630;
  --chart-tooltip-border: rgba(255, 255, 255, 0.08);
  --chart-tooltip-shadow: 0 8px 24px rgba(8, 12, 24, 0.45), 0 2px 6px rgba(8, 12, 24, 0.30);
  --chart-tooltip-text: #FFFFFF;
  --chart-tooltip-muted: #CFCFCF;
  --chart-tooltip-divider: rgba(255, 255, 255, 0.12);
}

/* ═══════════════════════════════════════════
   Status / Data / IoT — Semantic Color System
   산업 데이터 인텔리전스 플랫폼용 상태·차트 토큰
   ═══════════════════════════════════════════ */

/* Dark theme defaults (brighter tones for dark backgrounds) */
:root,
[data-theme="dark"] {
  /* ── Status (범용 상태) ── */
  --status-success:       #34D399;  /* emerald-400 · 정상/성공 */
  --status-success-bg:    rgba(52,211,153,0.12);
  --status-success-border: rgba(52,211,153,0.30);

  --status-warning:       #FBBF24;  /* amber-400 · 주의 */
  --status-warning-bg:    rgba(251,191,36,0.12);
  --status-warning-border: rgba(251,191,36,0.30);

  --status-danger:        #F87171;  /* red-400 · 위험/오류 */
  --status-danger-bg:     rgba(248,113,113,0.12);
  --status-danger-border: rgba(248,113,113,0.30);

  --status-critical:      #EF4444;  /* red-500 · 치명 (한 단계 강한 위험) */
  --status-critical-bg:   rgba(239,68,68,0.18);
  --status-critical-border: rgba(239,68,68,0.45);

  --status-info:          #76A6D7;  /* Refined Blue · 정보 */
  --status-info-bg:       rgba(118,166,215,0.14);
  --status-info-border:   rgba(118,166,215,0.32);

  --status-neutral:       #94A3B8;  /* slate-400 · 중립/대기 */
  --status-neutral-bg:    rgba(148,163,184,0.12);
  --status-neutral-border: rgba(148,163,184,0.28);

  /* ── IoT / Operational (산업 장비 상태) ── */
  --iot-online:           #34D399;  /* emerald-400 · 온라인 */
  --iot-offline:          #6F7897;  /* slate · 오프라인 */
  --iot-running:          #22D3EE;  /* cyan-400 · 가동중 */
  --iot-idle:             #A4ADC7;  /* 대기 */
  --iot-maintenance:      #A78BFA;  /* violet-400 · 점검중 */
  --iot-fault:            #F87171;  /* 고장 */
  --iot-unknown:          #4A5170;  /* 미확인 */

  /* ── Chart Categorical (10색) ──
     서로 충분히 구별되면서 브랜드 Navy+Blue 와 조화
     고대비 우선, 색약 대응을 고려한 순서 */
  --chart-1:  #76A6D7;  /* Refined Blue — primary series */
  --chart-2:  #22D3EE;  /* Cyan — data/flow */
  --chart-3:  #34D399;  /* Emerald — healthy trend */
  --chart-4:  #A78BFA;  /* Violet — AI/insight */
  --chart-5:  #FBBF24;  /* Amber — heat/warning */
  --chart-6:  #F87171;  /* Rose — anomaly */
  --chart-7:  #A8C9E6;  /* Refined Blue tint — secondary */
  --chart-8:  #E879F9;  /* Fuchsia — rare event */
  --chart-9:  #BEF264;  /* Lime — growth */
  --chart-10: #FB923C;  /* Orange — energy */

  /* ── Chart Sequential (단일 색조 7단계) · Refined Blue 기반 ──
     낮음 → 높음. 히트맵, 밀도, 게이지 등 단일 차원 강도 표현 */
  --seq-1: #0A1F52;
  --seq-2: #12307F;
  --seq-3: #1E4AAF;
  --seq-4: #76A6D7;  /* Refined Blue */
  --seq-5: #6A93DC;
  --seq-6: #A7C3EC;
  --seq-7: #E3ECFB;

  /* ── Chart Diverging (발산형 9단계) · 차가움 ↔ 기준 ↔ 뜨거움 ──
     편차, 이상치, 온도 variance 등 양방향 */
  --div-1: #1E4AAF;  /* cold (Refined Blue deep) */
  --div-2: #76A6D7;
  --div-3: #A8C9E6;
  --div-4: #C9D2E5;
  --div-5: #6F7897;  /* neutral midpoint */
  --div-6: #FCD9A1;
  --div-7: #FB923C;
  --div-8: #F87171;
  --div-9: #B91C1C;  /* hot (deep red) */

  /* ── Chart Grid / Axis ── */
  --chart-grid:    rgba(255,255,255,0.06);
  --chart-axis:    rgba(255,255,255,0.20);
  --chart-label:   #A4ADC7;
  /* --chart-tooltip-* 는 :root 항상-다크 단일 정의 — 테마 오버라이드 없음(DS Data·Graph Popover). */
  --chart-threshold: rgba(248,113,113,0.6);  /* 임계치 라인 */
  --chart-band:      rgba(118,166,215,0.10);  /* 정상 범위 배경 */
}

/* ═══════════════════════════════════════════
   Theme System — Semantic Tokens
   ═══════════════════════════════════════════ */

/* Dark theme (default) */
:root,
[data-theme="dark"] {
  --bg-page: #111316;                     /* Guide §Surface --surface-page (dark) */
  --bg-surface: #0F1530;                  /* Navy-tinted panel */
  --bg-sidebar: #07091A;                  /* 페이지보다 한 단계 깊게 */
  --bg-header: #0F1530;
  --bg-card: rgba(255,255,255,0.04);      /* glass */
  --bg-glass: rgba(255,255,255,0.04);     /* 모달/popover 글래스 오버레이 */
  --bg-input: rgba(255,255,255,0.06);
  --bg-muted: rgba(255,255,255,0.08);     /* 뱃지/chip 배경 */
  --bg-hover: rgba(255,255,255,0.06);
  --bg-active: rgba(118,166,215,0.14);     /* refined-blue tint */
  --bg-overlay: #0B0E14;
  --bg-popover: #0F1530;
  --shadow-popover: 0 12px 28px rgba(0,0,0,.40), 0 2px 6px rgba(0,0,0,.20);  /* popover/tooltip elevation */
  /* 테이블 헤더 — bg-page (#0B0E14) + rgba(255,255,255,0.03) 합성 SOLID
     (sticky 시 row 가 비치지 않도록 opaque) */
  --bg-table-header: #12151B;

  --border-default: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.14);
  --border-input: rgba(255,255,255,0.18);

  --text-primary: #E8ECF5;
  --text-secondary: #A4ADC7;
  --text-muted: #6F7897;
  --text-faint: #4A5170;

  --accent: #76A6D7;                      /* Refined Blue */
  --accent-hover: rgba(118,166,215,0.18);
  --accent-text: #A8C9E6;                 /* refined-blue tint */

  --logo-bg: #1D2E52;                     /* Onto Navy */

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.22); }
}

/* Light theme — Brand-centric (Refined Blue accent 유지) */
[data-theme="light"] {
  --bg-page: #F6F8FA;          /* Guide §Surface --surface-page (light) */
  --bg-surface: #ffffff;
  --bg-sidebar: #EEF2F9;       /* brand-tinted sidebar */
  --bg-header: #ffffff;
  --bg-card: #ffffff;
  --bg-glass: #ffffff;                    /* 라이트는 글래스 미적용 (솔리드 화이트) */
  --bg-input: #F0F3FA;
  --bg-muted: #E6ECF7;         /* 뱃지/chip 배경 */
  --bg-hover: rgba(29,46,82,0.04);
  --bg-active: rgba(118,166,215,0.10);
  --bg-overlay: #ffffff;
  --bg-popover: #ffffff;
  --shadow-popover: 0 12px 28px rgba(20,30,45,.12), 0 2px 6px rgba(20,30,45,.06);  /* popover/tooltip elevation */
  /* 테이블 헤더 — bg-page(#F7F9FC) + 살짝 어두운 tint 합성 SOLID */
  --bg-table-header: #F0F2F5;

  --border-default: #E1E7F2;
  --border-strong: #C9D2E5;
  --border-input: #C9D2E5;

  --text-primary: #0B0E14;     /* Deep Raw Black */
  --text-secondary: #3C4660;
  --text-muted: #6B7594;
  --text-faint: #9CA5BF;

  --accent: #76A6D7;            /* Refined Blue (유지) */
  --accent-hover: rgba(118,166,215,0.10);
  --accent-text: #1D2E52;       /* Onto Navy — 라이트에서는 딥 네이비 강조 */

  --logo-bg: #EEF2F9;
}

/* ═══════════════════════════════════════════
   Rail Tokens — UI Refinery 260514 spec
   GlobalSidebar(Rail) 전용 raw 토큰. 점진적 마이그레이션 중이므로
   기존 surface/content/accent 토큰과 병행 운용.
   ═══════════════════════════════════════════ */

/* Light (HTML 시안 :root 값) */
:root,
[data-theme="light"] {
  --rail-brand: #76A6D7;
  --rail-brand-600: #5A8FC5;
  --rail-brand-700: #3F76AE;
  --rail-brand-50: #EEF4FB;
  --rail-brand-100: #DCE8F5;

  --rail-ink-900: #16202C;
  --rail-ink-800: #22303F;
  --rail-ink-700: #3A4856;
  --rail-ink-600: #5A6776;
  --rail-ink-500: #7E8A98;
  --rail-ink-400: #A4ADB8;
  --rail-ink-300: #C8CED5;
  --rail-ink-200: #E3E7EC;
  --rail-ink-100: #EFF2F5;
  --rail-ink-50:  #F6F8FA;

  --rail-white: #FFFFFF;
  --rail-surface-side: #FFFFFF;  /* Sub Nav (.side) — Guide §3 --surface-side */
  --rail-bg:    #FAFBFC;   /* rail 자체 배경 (light) */
  --rail-topbar: #FAFBFC;  /* topbar 배경 (light = rail 과 동일) */
  --rail-seg-on-bg: #FFFFFF; /* SegmentedControl 활성 pill bg (light) */

  --rail-good:  #3FB255;
  --rail-good-50: rgba(63,178,85,.10);
  --rail-warn:  #F0A93A;
  --rail-warn-50: rgba(240,169,58,.12);
  --rail-bad:   #E5484D;
  --rail-bad-50: rgba(229,72,77,.10);

  --rail-shadow-sm: 0 1px 2px rgba(20,30,45,.05);
  --rail-shadow-card: 0 1px 2px rgba(20,30,45,.04), 0 1px 1px rgba(20,30,45,.04);
  --rail-shadow-pop: 0 12px 28px rgba(20,30,45,.12), 0 2px 6px rgba(20,30,45,.06);

  /* Avatar 모노그램 — 모드 불변 고정 (design-system §Account Fixed Tokens · dark 에서 재정의 금지) */
  --avatar-bg: #16202C;
  --avatar-fg: #FFFFFF;
}

/* Dark (HTML 시안 body.dark 값 — 뉴트럴 다크, 블루 틴트 제거) */
[data-theme="dark"] {
  --rail-brand: #76A6D7;
  --rail-brand-600: #5A8FC5;
  --rail-brand-700: #3F76AE;
  --rail-brand-50: rgba(118,166,215,.13);
  --rail-brand-100: rgba(118,166,215,.20);

  --rail-ink-900: #EDEEF0;
  --rail-ink-800: #C0C4CA;
  --rail-ink-700: #959CA5;
  --rail-ink-600: #878E97;
  --rail-ink-500: #757C85;
  --rail-ink-400: #424850;
  --rail-ink-300: #32373F;
  --rail-ink-200: #272B32;
  --rail-ink-100: #1E2228;
  --rail-ink-50:  #17191E;

  --rail-white: #191D22;   /* card surface (dark) — Guide §Surface --surface-card */
  --rail-surface-side: #191D22;  /* Sub Nav (.side) — Guide §3 --surface-side dark */
  --rail-bg:    #131519;   /* rail 자체 배경 (dark) — Guide §Surface --surface-rail */
  --rail-topbar: #131519;  /* topbar (dark = rail · Global Nav 톤 통일) — Guide §Surface */
  --rail-seg-on-bg: #32373F; /* SegmentedControl 활성 pill bg (dark = ink-300) */

  --rail-good:  #3FB255;
  --rail-good-50: rgba(63,178,85,.12);
  --rail-warn:  #F0A93A;
  --rail-warn-50: rgba(240,169,58,.14);
  --rail-bad:   #E5484D;
  --rail-bad-50: rgba(229,72,77,.12);

  --rail-shadow-sm: 0 1px 2px rgba(0,0,0,.40);
  --rail-shadow-card: 0 2px 4px rgba(0,0,0,.35), 0 1px 1px rgba(0,0,0,.25);
  --rail-shadow-pop: 0 12px 28px rgba(0,0,0,.40), 0 2px 6px rgba(0,0,0,.20);
}

/* ═══════════════════════════════════════════
   Universal Table System (.rfn-table)
   UI Refinery 260514 spec — Table Anatomy & Structure.
   Widget 안에서 사용하는 범용 데이터 테이블.
   ═══════════════════════════════════════════ */
.rfn-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-family: "Roboto", "Pretendard", sans-serif;
  font-size: 13px;       /* Guide --fs-body-sm */
}
.rfn-table th {
  text-align: left;
  padding: 8px 12px;
  background: var(--rail-ink-50);
  border-bottom: 1px solid var(--rail-ink-200);
  font-family: "Roboto", "Pretendard", sans-serif;
  font-weight: 600;
  font-size: 11.5px;     /* Guide --fs-label (eyebrow) */
  color: var(--rail-ink-500);
  letter-spacing: .06em;
  text-transform: uppercase;
  white-space: nowrap;
  user-select: none;
}
[data-theme="dark"] .rfn-table th {
  background: var(--rail-ink-100);
  color: var(--rail-ink-600);
  border-bottom-color: var(--rail-ink-200);
}
.rfn-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--rail-ink-100);
  color: var(--rail-ink-800);
  vertical-align: middle;
  line-height: 1.4;
}
[data-theme="dark"] .rfn-table td {
  border-bottom-color: var(--rail-ink-200);
}
.rfn-table tbody tr:last-child td { border-bottom: 0; }

/* Alignment helpers */
.rfn-table .text-right { text-align: right; }
.rfn-table .text-center { text-align: center; }

/* Cell types */
.rfn-table .t-id {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 12px;       /* Guide --fs-code */
  color: var(--rail-ink-500);
  letter-spacing: -.01em;
}
[data-theme="dark"] .rfn-table .t-id { color: var(--rail-ink-600); }
.rfn-table .t-name {
  font-weight: 600;
  color: var(--rail-ink-900);
  font-size: 13px;       /* Guide --fs-body-sm */
  line-height: 1.3;
}
.rfn-table .t-num {
  font-family: "Roboto", "Pretendard", sans-serif;
  font-variant-numeric: tabular-nums;
  color: var(--rail-ink-900);
  font-weight: 500;
  letter-spacing: -.01em;
}
.rfn-table .t-muted { color: var(--rail-ink-500); }

/* Row states */
.rfn-table tbody tr.is-hover td,
.rfn-table tbody tr:hover td { background: var(--rail-ink-50); }
[data-theme="dark"] .rfn-table tbody tr.is-hover td,
[data-theme="dark"] .rfn-table tbody tr:hover td { background: var(--rail-ink-100); }

.rfn-table tbody tr.is-selected td { background: var(--rail-brand-50); }
[data-theme="dark"] .rfn-table tbody tr.is-selected td { background: rgba(118,166,215,.10); }

/* D&D drop target — 드래그 오버 시 brand 색 강조 */
.rfn-table tbody tr.rfn-drop-target td {
  background: var(--rail-brand-50);
  box-shadow: inset 0 -2px 0 var(--rail-brand);
}
[data-theme="dark"] .rfn-table tbody tr.rfn-drop-target td {
  background: rgba(118, 166, 215, .12);
  box-shadow: inset 0 -2px 0 var(--rail-brand);
}

.rfn-table tbody tr.is-alarm td { background: rgba(229,72,77,.04); }
[data-theme="dark"] .rfn-table tbody tr.is-alarm td { background: rgba(229,72,77,.08); }

.rfn-table tbody tr.is-disabled td {
  color: var(--rail-ink-400);
  opacity: .65;
}
[data-theme="dark"] .rfn-table tbody tr.is-disabled td { color: var(--rail-ink-500); }

/* Sortable header */
.rfn-table th.is-sortable { cursor: pointer; transition: color .12s ease; }
.rfn-table th.is-sortable:hover { color: var(--rail-ink-700); }
.rfn-table th .sort-ic {
  display: inline-flex;
  vertical-align: middle;
  margin-left: 4px;
  color: var(--rail-ink-400);
  font-size: 10px;
}
.rfn-table th.is-sorted-asc .sort-ic,
.rfn-table th.is-sorted-desc .sort-ic { color: var(--rail-brand-700); }

/* Drill-down chevron column (always rightmost) */
.rfn-table td.t-drill {
  width: 36px;
  text-align: right;
  color: var(--rail-ink-300);
}
.rfn-table tbody tr:hover td.t-drill { color: var(--rail-ink-600); }
[data-theme="dark"] .rfn-table td.t-drill { color: var(--rail-ink-400); }
[data-theme="dark"] .rfn-table tbody tr:hover td.t-drill { color: var(--rail-ink-700); }

/* Selectable variant — leftmost checkbox column */
.rfn-table--selectable th:first-child,
.rfn-table--selectable td:first-child {
  width: 40px;
  padding-left: 14px;
  padding-right: 0;
  text-align: center;
}

/* Sticky header */
.rfn-table--sticky thead th { position: sticky; top: 0; z-index: 1; }

/* Fixed layout — colgroup 폭을 강제(헤더/본문 테이블 분리 시 컬럼 정렬에 사용). */
.rfn-table--fixed { table-layout: fixed; }

/* Density 변형 — 세로 padding 만 조정(가로 12px·타이포·테두리는 기본 그대로).
   기본(.rfn-table) = normal(TH 8 / TD 10px, DS 기준). compact/comfortable 는
   세로축만 override. 기본 규칙보다 뒤에 선언되어 동일 명시도에서 우선.
   table.entity / table.timeseries 가 density 옵션으로 이 클래스를 토글한다. */
.rfn-table--density-compact th     { padding-block: 4px; }
.rfn-table--density-compact td     { padding-block: 2px; }
.rfn-table--density-comfortable th { padding-block: 12px; }
.rfn-table--density-comfortable td { padding-block: 14px; }

/* ─── Scrollable table frame — 본문(content)만 스크롤.
   스크롤되는 .rfn-table 은 이 래퍼로 감싼다(공용). thead 는 .rfn-table--sticky 로 고정.
   overlay 스크롤바를 써서 스크롤바가 레이아웃 폭을 차지하지 않게 함 →
   sticky 헤더 우측에 스크롤바 거터(흰 여백)가 생기지 않고, 가로 스크롤은 차단. */
.rfn-table-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
}
@supports (overflow-y: overlay) {
  /* Chromium: 스크롤바가 콘텐츠 위에 떠서 폭을 점유하지 않음(헤더 우측 여백 제거). */
  .rfn-table-scroll { overflow-y: overlay; }
}

/* ─── Universal Checkbox — Guide §Table .rfn-checkbox
   data-state: 기본/checked/mixed/disabled. <button role="checkbox"> 위에 적용. */
.rfn-checkbox {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  border-radius: 4px;
  border: 1.5px solid var(--rail-ink-300);
  background: var(--rail-white);
  cursor: pointer;
  position: relative;
  margin-left: auto;
}

/* ─── Icon button (32×32 r8) — topbar/위젯 헤더 공통 ─── */
.rfn-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: transparent;
  border: 0;
  color: var(--rail-ink-600);
  cursor: pointer;
  transition: background .12s ease, color .12s ease;
  outline: none;
}
.rfn-icon-btn:hover { background: var(--rail-ink-50); color: var(--rail-ink-900); }
.rfn-icon-btn:focus-visible { box-shadow: 0 0 0 3px rgba(118, 166, 215, .30); }
.rfn-icon-btn[aria-expanded="true"],
.rfn-icon-btn.on { background: var(--rail-ink-50); color: var(--rail-ink-900); }
[data-theme="dark"] .rfn-icon-btn:hover,
[data-theme="dark"] .rfn-icon-btn[aria-expanded="true"],
[data-theme="dark"] .rfn-icon-btn.on { background: var(--rail-ink-100); }
/* size 변형 — 좁은 영역(28) / 강조(40). 기본 32. (디자인시스템 Button·Icon Button 섹션) */
.rfn-icon-btn--sm { width: 28px; height: 28px; }
.rfn-icon-btn--lg { width: 40px; height: 40px; border-radius: 10px; }
/* intent 변형 — brand(주요 액션, 예: 저장). --danger 와 동일 패턴. */
.rfn-icon-btn--brand { color: var(--rail-brand-600); }
.rfn-icon-btn--brand:hover { background: var(--rail-brand-50); color: var(--rail-brand-700); }
/* disabled — 비활성 아이콘 버튼(예: 변경분 없을 때 저장) */
.rfn-icon-btn:disabled { opacity: .4; cursor: default; }
.rfn-icon-btn:disabled:hover { background: transparent; }
/* ═══════════════════════════════════════════
   Widget (1depth card) — UI Refinery 260514 §4.2
   1depth surface card. Head/Body compound.
   ═══════════════════════════════════════════ */
.rfn-widget {
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--rail-white);
  border: 1px solid var(--rail-ink-200);
  border-radius: 10px;
  box-shadow: 0 1px 2px rgba(20, 30, 45, .04);
}
[data-theme="dark"] .rfn-widget { box-shadow: 0 1px 2px rgba(0, 0, 0, .35); }

.rfn-widget--clickable {
  cursor: pointer;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.rfn-widget--clickable:hover {
  border-color: var(--rail-ink-300);
  box-shadow: 0 2px 6px rgba(20, 30, 45, .06);
}
.rfn-widget--clickable:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(118, 166, 215, .30);
}

/* Head — small/compact 카드용(/ontology 의 recent 카드 등): padding 12/14, no border. */
.rfn-widget-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  min-width: 0;
}
/* Variant: head sitting above an embedded table — Guide §Widget(reference base):
   padding 14/16 + border-bottom ink-100. sm input(28h) 기준 head 총 높이
   = 14 + 28 + 14 + 1 = 57px (reference selectable-table 일치). */
.rfn-widget-head--list {
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--rail-ink-100);
  flex: none;
  /* sm Input(28h) 없이 텍스트만 있어도 동일한 57px head 유지 — content row min 28 보장. */
  min-height: 57px;
  box-sizing: border-box;
}
[data-theme="dark"] .rfn-widget-head--list { border-bottom-color: var(--rail-ink-200); }

.rfn-widget-title {
  font-family: "Roboto", "Pretendard", sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--rail-ink-900);
  letter-spacing: -.005em;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rfn-widget-sub {
  font-family: "Pretendard", sans-serif;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--rail-ink-500);
  line-height: 1.2;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rfn-widget-actions {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: none;
}

/* Body */
.rfn-widget-body {
  display: flex;
  flex-direction: column;
  padding: 10px 14px;
  min-width: 0;
}
.rfn-widget-body--no-pad { padding: 0; }
.rfn-widget-body--row {
  flex-direction: row;
  align-items: center;
  gap: 10px;
  font-family: "Roboto", "Pretendard", sans-serif;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--rail-ink-500);
  letter-spacing: -.005em;
}
.rfn-widget-body--row .num {
  color: var(--rail-ink-800);
  font-weight: 600;
  margin-left: 2px;
  font-variant-numeric: tabular-nums;
}
.rfn-widget-body--row .dot-sep { color: var(--rail-ink-300); }

}

/* ═══════════════════════════════════════════
   Agent Floating Panel v4 — "Living Signal / 모션은 상태의 미분값" (.rfn-agent-*)
   어디서든 호출하는 에이전트 패널 — FAB + float/fullscreen 패널.
   모티프: 브랜드 그라데이션(refined-blue→onto-navy) 단일 축.

   설계 원칙 (2026 모션 카탈로그 P1~P35 리서치 합성 — Anthropic·OpenAI·Google·
   Apple·검색/코딩 에이전트·UX 이론 병합):
   · 모든 루프 모션은 상태에 게이팅([data-agent-state]) — 무상태 장식 루프 금지
   · 동시 주인공 1개 — 스트리밍=캐럿·어절, 도구 실행=해당 카드, 대기=정지가 신호
   · 실데이터(경과 타이머·단계)가 최고의 인디케이터
   · 오류 = 모션 사망(정지+색) · 승인 대기 = 1회 등장 후 정적(무한 펄스 금지)
   · 텍스트 = 어절 blur-fade 등장(P1) · thinking = 자동 개폐 틱커(P9)

   토큰(rail · brand)만 사용, [data-theme] 자동 대응.
   모션: GPU(transform/opacity/clip-path/mask) · linear() 스프링(폴백 베지어) ·
   reduced-motion 준수(하단). z-index: FAB 9100 < 패널 9200 (토스트 9000 위).
   ═══════════════════════════════════════════ */

/* 공용 이징/지속시간 노브 — 에이전트 모션 시그니처.
   spatial(위치·크기)=스프링 허용 / effects(색·투명도)=바운스 금지(P24).
   .rfn-agent-ws 포함 필수 — 워크스페이스는 FAB/패널과 별도 DOM 서브트리라 이 변수를
   상속받아야 진입·스태거·승격 애니메이션이 유효(미포함 시 var 빈값→shorthand 무효→animation:none). */
.rfn-agent-fab, .rfn-agent-panel, .rfn-agent-ws {
  --agent-ease-spring: cubic-bezier(.3, 1.12, .35, 1); /* linear() 미지원 폴백 */
  --agent-ease-out: cubic-bezier(.22, 1, .36, 1);
  --agent-ease-standard: cubic-bezier(.4, 0, .2, 1); /* M3 standard — 컨테이너 모프용 */
  --agent-grad: linear-gradient(135deg, var(--brand-refined-blue) 0%, var(--brand-onto-navy) 100%);
}
@supports (transition-timing-function: linear(0, 1)) {
  .rfn-agent-fab, .rfn-agent-panel, .rfn-agent-ws {
    /* 저강성 스프링 — 오버슛 ~1.7% 클램프(과한 바운스는 클리셰, P24) */
    --agent-ease-spring: linear(
      0, 0.036 3.2%, 0.1361 6.9%, 0.3225 11.7%, 0.6183 18.2%, 0.7947 22.5%,
      0.9243 26.7%, 0.9995 30.8%, 1.0417 34.9%, 1.0605 39.2%, 1.0625 44.4%,
      1.0499 51.3%, 1.0113 66.4%, 1.0009 78.4%, 1
    );
  }
}

/* 공용 shimmer 텍스트(P5) — 활동 중 라벨 전용. 배경이 있는 컨테이너가 아니라
   내부 텍스트 스팬에 건다(background-clip:text 가 컨테이너 배경을 지우므로). */
.rfn-agent-shimmer-text {
  background-image: linear-gradient(
    90deg,
    currentColor 36%,
    color-mix(in srgb, var(--brand-refined-blue) 45%, #FFFFFF) 50%,
    currentColor 64%
  );
  background-size: 220% 100%;
  -webkit-background-clip: text;
          background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rfn-agent-shimmer 2.1s linear infinite;
}
@keyframes rfn-agent-shimmer {
  from { background-position: 180% 0; }
  to   { background-position: -180% 0; }
}

/* ── FAB — "살아있는 오브". 설계(2026 리서치 1·2순위 합성):
   생동감의 정체 = ① idle 에도 미세하게 계속 살아있음(비대칭 호흡 + 내부 그라데이션
   유동) ② hover 는 정지→발화의 급변이 아니라 "각성 가속"(심박·유동 가속) ③ 커서에
   물리 반응(추종 스포트라이트 + 마그네틱 소폭 당김 + 시선 패럴랙스).
   구조 분리(속성 충돌 회피) — ⓐ 버튼=리프트/프레스(transform) + mount 페이드,
   ⓑ .stage=커서 반응(tilt+마그네틱 transform) + mount 스케일팝, ⓒ .orb=생명 레이어
   (호흡=scale·유동=bg-position). 각 층이 서로 다른 요소/속성이라 트랜스폼이 안 겹친다. ── */
/* 커서 좌표 변수 등록 — <number> 로 등록해야 자식(stage/아이콘)이 상속받은 값을
   calc(var()*deg|px) 트랜스폼에서 정상 해석한다(미등록 시 상속값이 calc 에서 0 으로
   폴백하는 브라우저 이슈 회피). inherits 로 버튼→stage→아이콘 전파. */
@property --fab-mx { syntax: "<number>"; inherits: true; initial-value: 0; }
@property --fab-my { syntax: "<number>"; inherits: true; initial-value: 0; }
.rfn-agent-fab {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 9100;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #FFFFFF;
  background: var(--agent-grad); /* orb 레이어 뒤 정적 폴백 */
  box-shadow:
    0 10px 28px rgba(29, 46, 82, .34),
    0 2px 8px rgba(29, 46, 82, .22),
    inset 0 1px 0 rgba(255, 255, 255, .22);
  cursor: pointer;
  perspective: 320px; /* 자식 .stage 의 3D 틸트용(속성 — 버튼 자신은 2D) */
  /* JS(pointermove)가 --fab-mx/my(-1..1)를 채운다. lift/scale 는 hover/press 가 세팅. */
  --fab-mx: 0;
  --fab-my: 0;
  --fab-lift: 0px;
  --fab-scale: 1;
  transform: translateY(var(--fab-lift)) scale(var(--fab-scale));
  transition:
    transform .2s var(--agent-ease-spring),
    box-shadow .22s ease,
    opacity .35s ease;
  /* mount 등장 — @starting-style 로 첫 프레임만 낮은 상태에서 트랜지션(JS·fill 무관,
     backwards-fill 이 이 환경에서 from 에 고착되는 문제 회피). */
  opacity: 1;
}
@starting-style {
  .rfn-agent-fab { opacity: 0; }
}
/* 스테이지 — 커서 반응(tilt+마그네틱)만 담당(transform). orb·glare·아이콘을 함께 기울인다.
   mount 스케일팝도 @starting-style 로(애니메이션 아님 — from 고착 회피). */
.rfn-agent-fab-stage {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-style: preserve-3d;
  /* tilt+마그네틱 transform 은 JS(pointermove)가 인라인으로 직접 세팅 —
     이 렌더러는 calc(var()) 를 transform 에선 해석 못 해(background 는 됨) 직접 주입.
     여기선 트랜지션만 제공해 부드럽게 따라가고, 이탈 시 인라인 제거→identity 복귀. */
  transition: transform .25s var(--agent-ease-spring);
}
/* 내부 오브 — 브랜드 2색이 순환 유동 + 비대칭 호흡(늘 살아있음). hover 시 가속. */
.rfn-agent-fab-orb {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  z-index: 0;
  background: linear-gradient(135deg, var(--brand-refined-blue) 0%, var(--brand-onto-navy) 100%);
  background-size: 170% 170%;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), inset 0 -8px 14px rgba(29, 46, 82, .3);
  pointer-events: none;
  animation:
    rfn-agent-orb-breathe 3.6s ease-in-out infinite,
    rfn-agent-orb-flow 8.5s ease-in-out infinite;
}
.rfn-agent-fab:hover .rfn-agent-fab-orb,
.rfn-agent-fab:focus-visible .rfn-agent-fab-orb {
  animation-duration: 1.9s, 4.5s; /* 각성 — 심박·유동 가속 */
}
/* 호흡 = transform: scale (독립 scale 속성 애니메이션은 일부 환경서 고착 → transform 사용) */
@keyframes rfn-agent-orb-breathe {
  0%   { transform: scale(1); }
  60%  { transform: scale(1.02); } /* 비대칭: 들숨(팽창) 을 길게 = 기계 펄스 아닌 호흡 */
  100% { transform: scale(1); }
}
@keyframes rfn-agent-orb-flow {
  0%, 100% { background-position: 18% 20%; }
  50%      { background-position: 82% 80%; }
}
/* 커서 추종 스포트라이트 — 광택 구체가 빛에 반응(물성). hover 시 켜짐. */
.rfn-agent-fab-glare {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  z-index: 1;
  background: radial-gradient(circle 30px
    at calc(50% + var(--fab-mx) * 42%) calc(50% + var(--fab-my) * 42%),
    rgba(255, 255, 255, .42), rgba(255, 255, 255, .08) 45%, transparent 62%);
  opacity: 0;
  transition: opacity .25s ease;
  pointer-events: none;
}
.rfn-agent-fab:hover .rfn-agent-fab-glare,
.rfn-agent-fab:focus-visible .rfn-agent-fab-glare { opacity: 1; }
/* conic 궤도 링 — running 전용 게이팅(무상태 상시 회전은 벽지화·주의 소음) */
.rfn-agent-fab::before {
  content: "";
  position: absolute;
  inset: -5px;
  border-radius: 50%;
  padding: 1.5px;
  background: conic-gradient(
    from 0deg,
    transparent 0deg,
    rgba(118, 166, 215, .0) 40deg,
    rgba(118, 166, 215, .85) 130deg,
    rgba(255, 255, 255, .9) 160deg,
    rgba(118, 166, 215, .85) 190deg,
    transparent 300deg
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask-composite: exclude;
  opacity: 0;
  transition: opacity .35s ease;
  animation: rfn-agent-orbit 3.2s linear infinite;
  animation-play-state: paused;
  pointer-events: none;
}
.rfn-agent-fab[data-agent-state="running"]::before {
  opacity: 1;
  animation-play-state: running;
}
/* 앰비언트 글로우 — 정적(호흡은 orb 가 담당). hover 시 부드럽게 밝아짐(각성). */
.rfn-agent-fab::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  pointer-events: none;
  box-shadow: 0 0 18px 2px rgba(118, 166, 215, .28);
  opacity: .5;
  transition: opacity .3s ease, box-shadow .3s ease;
}
.rfn-agent-fab:hover::after,
.rfn-agent-fab:focus-visible::after {
  opacity: 1;
  box-shadow: 0 0 26px 5px rgba(118, 166, 215, .5);
}
/* 상태 도트(P31) — 패널이 닫혀 있어도 HITL/오류를 놓치지 않게 */
.rfn-agent-fab-dot {
  position: absolute;
  top: 1px;
  right: 1px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid var(--rail-white);
  opacity: 0;
  transform: scale(.4);
  transition: opacity .2s ease, transform .25s var(--agent-ease-spring), background .2s ease;
  pointer-events: none;
}
[data-theme="dark"] .rfn-agent-fab-dot { border-color: #16181D; }
.rfn-agent-fab[data-agent-state="running"] .rfn-agent-fab-dot {
  opacity: 1;
  transform: none;
  background: var(--brand-refined-blue);
  animation: rfn-agent-dot-pulse 2s ease-in-out infinite;
}
.rfn-agent-fab[data-agent-state^="awaiting"] .rfn-agent-fab-dot {
  opacity: 1;
  transform: none;
  background: var(--rail-warn);
  animation: rfn-agent-dot-pulse 1.1s ease-in-out infinite;
}
.rfn-agent-fab[data-agent-state="error"] .rfn-agent-fab-dot {
  opacity: 1;
  transform: none;
  background: var(--rail-bad); /* 오류 = 모션 사망(P32) — 펄스 없이 정적 */
}
@keyframes rfn-agent-dot-pulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: .45; }
}
/* 승인/질문 대기 진입 — 아이콘 1회 넛지(재촉 아닌 알림, 이후 정적) */
.rfn-agent-fab[data-agent-state^="awaiting"] .rfn-agent-fab-ic {
  animation: rfn-agent-nudge .7s var(--agent-ease-spring) 1;
}
@keyframes rfn-agent-nudge {
  0%   { transform: translateY(0); }
  30%  { transform: translateY(-5px) scale(1.1); }
  60%  { transform: translateY(1px); }
  100% { transform: none; }
}
/* hover = "각성" — 리프트(translate)·미세 스케일 + 그림자 심화. 나머지 생동감은
   orb 호흡 가속·스포트라이트·마그네틱(JS 변수)·아이콘 패럴랙스가 담당한다. */
.rfn-agent-fab:hover,
.rfn-agent-fab:focus-visible {
  --fab-lift: -4px;
  --fab-scale: 1.05;
  box-shadow:
    0 20px 42px rgba(118, 166, 215, .5),
    0 5px 12px rgba(29, 46, 82, .3),
    inset 0 1px 0 rgba(255, 255, 255, .3);
}
/* 궤도 링 점화 — hover/포커스 시 돌려 '반응한다'를 전달(1회 스핀업, 리서치 유지 권고) */
.rfn-agent-fab:hover::before,
.rfn-agent-fab:focus-visible::before {
  opacity: .85;
  animation-play-state: running;
  animation-duration: 2.8s;
}
/* press = 스프링 프레스: 깊게 눌리고, 놓으면 스프링 이징이 오버슛으로 복원 */
.rfn-agent-fab:active { --fab-scale: .9; --fab-lift: 0px; }
.rfn-agent-fab:focus-visible { outline: 2px solid var(--rail-brand-700); outline-offset: 4px; }
@keyframes rfn-agent-orbit { to { transform: rotate(360deg); } }
/* mount — 독립 scale/rotate 속성(버튼 base transform 과 분리). backwards fill 이라
   종료 후엔 base(마그네틱/틸트 변수)로 자연 복귀. */
@keyframes rfn-agent-fab-in {
  from { opacity: 0; scale: .3; rotate: -30deg; }
  to   { opacity: 1; scale: 1; rotate: 0deg; }
}

/* 클릭 파문(P20 발원점 방사) — 누른 지점에서 빛이 원형으로 번져 나간다.
   패널이 같은 지점에서 열리는 것과 인과적으로 연결(누른 곳에서 무언가 피어남).
   원형 클립 레이어를 따로 둬 FAB 의 링/헤일로 pseudo(버튼 밖)는 안 자른다. */
.rfn-agent-fab-fx {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}
.rfn-agent-fab-ripple {
  position: absolute;
  width: 14px;
  height: 14px;
  margin: -7px 0 0 -7px;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(255, 255, 255, .5) 0%,
    rgba(190, 220, 250, .22) 45%,
    transparent 70%);
  transform: scale(0);
  animation: rfn-agent-fab-ripple .55s var(--agent-ease-out) forwards;
}
@keyframes rfn-agent-fab-ripple {
  0%   { transform: scale(0); opacity: .8; }
  100% { transform: scale(8.5); opacity: 0; }
}
/* 아이콘 시선 패럴랙스 — 스테이지보다 더 커서 쪽으로 이동해 깊이·'쳐다본다' 인상.
   transform 은 JS 가 인라인 세팅(위 stage 와 동일 사유), 여기선 트랜지션만. */
.rfn-agent-fab-ic {
  position: relative;
  z-index: 2;
  transition: transform .28s var(--agent-ease-spring);
}
.rfn-agent-fab-fx { z-index: 1; }
.rfn-agent-fab-dot { z-index: 3; }

/* ── 패널 셸 — 유리감 + 브랜드 오로라 틴트 ── */
.rfn-agent-panel {
  position: fixed;
  z-index: 9200;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(120% 60% at 100% 0%, rgba(118, 166, 215, .055) 0%, transparent 55%),
    var(--rail-white);
  border: 1px solid var(--rail-ink-200);
  border-radius: 18px;
  overflow: hidden;
  box-shadow:
    0 32px 70px rgba(20, 30, 45, .24),
    0 8px 20px rgba(20, 30, 45, .12);
}
[data-theme="dark"] .rfn-agent-panel {
  background:
    radial-gradient(120% 60% at 100% 0%, rgba(118, 166, 215, .07) 0%, transparent 55%),
    #1A1D23;
  box-shadow:
    0 32px 70px rgba(0, 0, 0, .6),
    0 8px 20px rgba(0, 0, 0, .38),
    inset 0 1px 0 rgba(255, 255, 255, .04);
}
/* 상단 헤어라인 — 상태 라이트바. 모션 자체가 상태 문법:
   running = 비대칭 빔 주행(leading edge 선명 — 진행 방향성) ·
   awaiting = amber "정지"(작업중의 흐름과의 대비 자체가 '사용자 차례' 신호, P29) ·
   error = 적색 정적(모션 사망, P32) · completed = good 스윕 1회(P13) */
.rfn-agent-panel::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  z-index: 7;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(118, 166, 215, .5) 42%,
    rgba(118, 166, 215, .5) 58%,
    transparent 100%);
  opacity: .3;
  pointer-events: none;
  transition: opacity .3s ease;
}
.rfn-agent-panel[data-agent-state="running"]::before {
  opacity: 1;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(118, 166, 215, .07) 28%,
    rgba(118, 166, 215, .5) 60%,
    rgba(190, 220, 250, .98) 71%,
    transparent 73%);
  background-size: 200% 100%;
  animation: rfn-agent-beam 1.9s linear infinite;
}
.rfn-agent-panel.is-awaiting::before {
  opacity: 1;
  background: linear-gradient(90deg,
    transparent 0%,
    color-mix(in srgb, var(--rail-warn) 65%, transparent) 28%,
    var(--rail-warn) 50%,
    color-mix(in srgb, var(--rail-warn) 65%, transparent) 72%,
    transparent 100%);
  animation: none;
}
.rfn-agent-panel[data-agent-state="error"]::before {
  opacity: .9;
  background: linear-gradient(90deg,
    transparent 0%,
    color-mix(in srgb, var(--rail-bad) 65%, transparent) 32%,
    var(--rail-bad) 50%,
    color-mix(in srgb, var(--rail-bad) 65%, transparent) 68%,
    transparent 100%);
  animation: none;
}
.rfn-agent-panel[data-agent-state="completed"]::before {
  background: linear-gradient(90deg,
    transparent 0%,
    color-mix(in srgb, var(--rail-good) 30%, transparent) 40%,
    var(--rail-good) 70%,
    transparent 74%);
  background-size: 200% 100%;
  animation: rfn-agent-beam-done 1s ease-out both;
}
@keyframes rfn-agent-beam {
  from { background-position: 240% 0; }
  to   { background-position: -140% 0; }
}
@keyframes rfn-agent-beam-done {
  0%   { opacity: 1; background-position: 240% 0; }
  75%  { opacity: 1; }
  100% { opacity: .25; background-position: -140% 0; }
}
/* float↔fullscreen = 같은 DOM 의 연속 모프(P22) — 재등장 연출은 세션 단절감.
   두 레이아웃을 동일 속성(right/bottom/width/height)으로 선언해 보간 가능하게 한다. */
.rfn-agent-panel {
  transition:
    width .36s var(--agent-ease-out),
    height .36s var(--agent-ease-out),
    right .36s var(--agent-ease-out),
    bottom .36s var(--agent-ease-out),
    border-radius .36s var(--agent-ease-out);
}
.rfn-agent-panel--float {
  right: 24px;
  bottom: 24px;
  width: 420px;
  height: min(660px, calc(100vh - 48px));
  transform-origin: bottom right;
}
/* 등장 키프레임은 최초 열림 1회만(is-entering). */
.rfn-agent-panel--float.is-entering {
  animation: rfn-agent-panel-in .44s var(--agent-ease-standard) both;
}
/* 열림 — FAB(우하단 27px 지점)에서 오브가 카드로 "부풀어" 변형(M3 container transform).
   clip 원이 FAB 중심에서 확대 + 미세 scale 성장. 표면 cross-fade 는 morph 오버레이 담당.
   최종 반경 150% 는 패널 밖 그림자까지 덮어 사실상 무클립(clip 은 box-shadow 도 자름). */
@keyframes rfn-agent-panel-in {
  from {
    /* transform-origin: bottom right(FAB 자리) — 카드가 코너에서 뚜렷이 부풀어 오른다.
       transform 은 항상 부드럽게 보간되므로 clip-path px↔% 보간 여부와 무관하게 연속감 보장. */
    transform: translateY(10px) scale(.86);
    clip-path: circle(28px at calc(100% - 27px) calc(100% - 27px));
  }
  to {
    transform: none;
    clip-path: circle(150% at calc(100% - 27px) calc(100% - 27px));
  }
}
/* 닫힘 — 역방향: 카드가 FAB 오브로 응축(morph 오버레이가 오브 표면 복원). FAB 재등장과 겹쳐 연속성. */
.rfn-agent-panel--float.is-closing {
  animation: rfn-agent-panel-out .3s var(--agent-ease-standard) both;
  pointer-events: none;
}
@keyframes rfn-agent-panel-out {
  from {
    opacity: 1;
    transform: none;
    clip-path: circle(150% at calc(100% - 27px) calc(100% - 27px));
  }
  to {
    /* 카드가 FAB 오브 자리로 뚜렷이 응축(scale .86)하며 페이드 — FAB 재등장과 겹쳐 연속감. */
    opacity: .3;
    transform: translateY(8px) scale(.86);
    clip-path: circle(24px at calc(100% - 27px) calc(100% - 27px));
  }
}
/* 컨테이너 전환 오버레이(M3) — 열림 초기엔 오브 그라데이션이 원(clip) 전체를 덮어
   "FAB 오브"처럼 보이고, 확대 중반부터 opacity 로 걷혀 카드 표면·콘텐츠로 cross-fade.
   헤더 아이콘(동일 그라데이션)이 드러나며 "오브가 아이콘으로 응축"된 인상. */
.rfn-agent-panel-morph {
  position: absolute;
  inset: 0;
  z-index: 8; /* 헤어라인(7)·콘텐츠 위 — 오브 표면이 카드를 덮었다가 걷힌다 */
  border-radius: inherit;
  background: linear-gradient(135deg, var(--brand-refined-blue) 0%, var(--brand-onto-navy) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22);
  opacity: 0;
  pointer-events: none;
}
.rfn-agent-panel--float.is-entering .rfn-agent-panel-morph {
  /* panel-in(.38s)보다 짧게 — is-entering 제거 시점에 morph 가 끊기지 않도록 */
  animation: rfn-agent-morph-out .36s var(--agent-ease-standard) both;
}
@keyframes rfn-agent-morph-out {
  0%   { opacity: 1; } /* 오브 그라데이션이 원 전체를 덮음 = FAB */
  42%  { opacity: 1; } /* 확대 초반까지 오브 유지(형태 morph 동안) */
  100% { opacity: 0; } /* 카드 표면으로 cross-fade */
}
.rfn-agent-panel--float.is-closing .rfn-agent-panel-morph {
  animation: rfn-agent-morph-in .28s var(--agent-ease-standard) both;
}
@keyframes rfn-agent-morph-in {
  0%   { opacity: 0; } /* 카드 표면 */
  60%  { opacity: 1; } /* 오브 표면으로 복원되며 응축 */
  100% { opacity: 1; }
}
@media (max-width: 480px) {
  .rfn-agent-panel--float {
    right: 8px;
    bottom: 8px;
    width: calc(100vw - 16px);
    height: calc(100vh - 16px);
  }
}

/* ── 헤더 (절제된 글래스) ── */
.rfn-agent-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 12px 13px 15px;
  border-bottom: 1px solid var(--rail-ink-100);
  background: color-mix(in srgb, var(--rail-white) 76%, transparent);
  backdrop-filter: blur(10px);
  flex: none;
  position: relative;
  z-index: 2;
}
[data-theme="dark"] .rfn-agent-head {
  border-bottom-color: var(--rail-ink-200);
  background: color-mix(in srgb, #1A1D23 68%, transparent);
}
.rfn-agent-head-ic {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #FFFFFF;
  background: linear-gradient(135deg, var(--brand-refined-blue) 0%, var(--brand-onto-navy) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 2px 6px rgba(29, 46, 82, .25);
  flex: none;
  position: relative;
  transition: transform .2s ease, box-shadow .35s ease;
}
/* running: 별 핑퐁 모프(P18 — 브랜드 마크가 심장박동) + 소프트 글로우.
   error 는 정적(모션 사망, P32) — 별도 선언 불필요(게이팅 밖). */
.rfn-agent-panel[data-agent-state="running"] .rfn-agent-head-ic {
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 0 14px 2px rgba(118, 166, 215, .45);
}
.rfn-agent-panel[data-agent-state="running"] .rfn-agent-head-ic > svg {
  animation: rfn-agent-star 1.5s ease-in-out infinite;
}
@keyframes rfn-agent-star {
  0%, 100% { transform: scale(1) rotate(0deg); }
  50%      { transform: scale(1.16) rotate(24deg); }
}
.rfn-agent-head-title { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.rfn-agent-head-name {
  font-family: "Roboto", "Pretendard", sans-serif;
  font-weight: 700;
  font-size: 14px;
  color: var(--rail-ink-900);
  letter-spacing: -.01em;
}
.rfn-agent-status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 500;
  color: var(--rail-ink-500);
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--rail-ink-100);
  transition: color .25s ease, background .25s ease;
  /* 상태 전환 시 key=status 재마운트로 팝 재생 — 변화 인지 */
  animation: rfn-agent-status-in .3s var(--agent-ease-spring) both;
}
@keyframes rfn-agent-status-in {
  from { opacity: 0; transform: translateY(4px) scale(.9); }
  to   { opacity: 1; transform: none; }
}
.rfn-agent-status.is-running { color: var(--rail-brand-700); background: var(--rail-brand-50); }
[data-theme="dark"] .rfn-agent-status.is-running { color: var(--brand-refined-blue); }
.rfn-agent-status-label { display: inline-block; }
/* 경과 타이머(P7) — 실데이터가 최고의 인디케이터. 5s+ 작업에만 노출(JS 게이트) */
.rfn-agent-status-time {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  opacity: .78;
  animation: rfn-agent-item-in .25s ease-out both;
}
.rfn-agent-status.is-completed { color: var(--rail-good); background: var(--rail-good-50); }
.rfn-agent-status.is-error { color: var(--rail-bad); background: var(--rail-bad-50); }
.rfn-agent-status.is-awaiting_approval,
.rfn-agent-status.is-awaiting_clarification { color: var(--rail-warn); background: var(--rail-warn-50); }
.rfn-agent-pulse {
  width: 6px; height: 6px; border-radius: 50%;
  background: currentColor;
  animation: rfn-agent-pulse 1.1s ease-in-out infinite;
}
@keyframes rfn-agent-pulse {
  0%, 100% { opacity: .3; transform: scale(.8); }
  50%      { opacity: 1; transform: scale(1.15); }
}
.rfn-agent-head-actions { display: flex; align-items: center; gap: 2px; }

/* ── 본문 / 피드 ── */
.rfn-agent-body { flex: 1; min-height: 0; overflow-y: auto; position: relative; }
.rfn-agent-feed { display: flex; flex-direction: column; gap: 11px; padding: 18px 16px; }

.rfn-agent-row { display: flex; }
.rfn-agent-row--user { justify-content: flex-end; }
.rfn-agent-bubble {
  font-family: "Roboto", "Pretendard", sans-serif;
  font-size: 13px;
  line-height: 1.6;
  border-radius: 14px;
  padding: 10px 13px;
  max-width: 86%;
  word-break: break-word;
}
.rfn-agent-bubble--user {
  background: linear-gradient(135deg, var(--brand-refined-blue) 0%, var(--rail-brand-700) 130%);
  color: #FFFFFF;
  border-bottom-right-radius: 5px;
  box-shadow: 0 3px 10px rgba(29, 46, 82, .18), inset 0 1px 0 rgba(255, 255, 255, .18);
  white-space: pre-wrap; /* 유저 입력은 원문 그대로 — 에이전트 쪽은 markdown 이 블록을 만든다 */
}
.rfn-agent-bubble--agent {
  background: var(--rail-ink-50);
  border: 1px solid var(--rail-ink-100);
  color: var(--rail-ink-900);
  border-bottom-left-radius: 5px;
}
[data-theme="dark"] .rfn-agent-bubble--agent {
  background: var(--rail-ink-100);
  border-color: var(--rail-ink-200);
}

/* ── 에이전트 markdown 타이포그래피 (.rfn-agent-md — AgentMarkdown 전용) ── */
.rfn-agent-md > :first-child { margin-top: 0; }
.rfn-agent-md > :last-child { margin-bottom: 0; }
.rfn-agent-md p { margin: 0 0 8px; }
.rfn-agent-md h1, .rfn-agent-md h2, .rfn-agent-md h3,
.rfn-agent-md h4, .rfn-agent-md h5, .rfn-agent-md h6 {
  font-family: "Pretendard", "Roboto", sans-serif;
  font-weight: 700;
  color: var(--rail-ink-900);
  line-height: 1.35;
  margin: 14px 0 6px;
}
.rfn-agent-md h1 { font-size: 15.5px; }
.rfn-agent-md h2 { font-size: 14.5px; }
.rfn-agent-md h3 { font-size: 13.5px; }
.rfn-agent-md h4, .rfn-agent-md h5, .rfn-agent-md h6 { font-size: 13px; }
/* Tailwind preflight 가 list-style 을 제거하므로 명시 복원 */
.rfn-agent-md ul, .rfn-agent-md ol { margin: 0 0 8px; padding-left: 19px; }
.rfn-agent-md ul { list-style: disc; }
.rfn-agent-md ol { list-style: decimal; }
.rfn-agent-md li > ul { list-style: circle; }
.rfn-agent-md li { margin: 3px 0; }
.rfn-agent-md li > ul, .rfn-agent-md li > ol { margin-bottom: 0; }
.rfn-agent-md li::marker { color: var(--rail-brand-700); }
[data-theme="dark"] .rfn-agent-md li::marker { color: var(--brand-refined-blue); }
.rfn-agent-md strong { font-weight: 700; }
.rfn-agent-md a { color: var(--rail-brand-700); text-decoration: none; border-bottom: 1px solid var(--rail-brand-100); }
.rfn-agent-md a:hover { border-bottom-color: var(--rail-brand-700); }
[data-theme="dark"] .rfn-agent-md a { color: var(--brand-refined-blue); }
[data-theme="dark"] .rfn-agent-md a:hover { border-bottom-color: var(--brand-refined-blue); }
.rfn-agent-md code {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 11.5px;
  background: var(--rail-ink-100);
  border-radius: 4px;
  padding: 1.5px 5px;
}
[data-theme="dark"] .rfn-agent-md code { background: var(--rail-ink-200); }
.rfn-agent-md pre {
  background: var(--rail-white);
  border: 1px solid var(--rail-ink-200);
  border-radius: 8px;
  padding: 9px 11px;
  margin: 0 0 8px;
  overflow-x: auto;
}
.rfn-agent-md pre code {
  background: transparent;
  padding: 0;
  border-radius: 0;
  font-size: 11.5px;
  line-height: 1.55;
  color: var(--rail-ink-800);
  white-space: pre;
}
.rfn-agent-md blockquote {
  margin: 0 0 8px;
  padding: 2px 0 2px 11px;
  border-left: 2px solid var(--rail-brand-100);
  color: var(--rail-ink-600);
}
.rfn-agent-md hr { border: 0; border-top: 1px solid var(--rail-ink-200); margin: 10px 0; }
.rfn-agent-md table {
  border-collapse: collapse;
  margin: 0 0 8px;
  font-size: 12px;
  display: block;
  max-width: 100%;
  overflow-x: auto;
}
.rfn-agent-md th, .rfn-agent-md td {
  border: 1px solid var(--rail-ink-200);
  padding: 4px 9px;
  text-align: left;
}
.rfn-agent-md th {
  font-weight: 600;
  background: var(--rail-ink-100);
  color: var(--rail-ink-800);
}
.rfn-agent-md input[type="checkbox"] { margin-right: 5px; accent-color: var(--rail-brand); }

/* 사고 과정 — 좌측 그라데이션 레일 + 접기. 추론 진행 중(.is-live)엔 레일이 아래로 흐른다 */
.rfn-agent-think {
  position: relative;
  padding-left: 13px;
}
.rfn-agent-think::before {
  content: "";
  position: absolute;
  left: 0; top: 2px; bottom: 2px;
  width: 2px;
  border-radius: 2px;
  background: linear-gradient(180deg, var(--brand-refined-blue), rgba(118, 166, 215, .12));
}
.rfn-agent-think.is-live::before {
  background: linear-gradient(180deg,
    rgba(118, 166, 215, .12),
    var(--brand-refined-blue) 50%,
    rgba(118, 166, 215, .12));
  background-size: 100% 300%;
  animation: rfn-agent-rail-flow 1.4s linear infinite;
}
@keyframes rfn-agent-rail-flow {
  from { background-position: 0 0; }
  to   { background-position: 0 300%; }
}
.rfn-agent-think-head {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: 0; cursor: pointer;
  font-size: 11.5px; font-weight: 500; color: var(--rail-ink-500);
  padding: 2px 0;
  transition: color .15s ease;
}
.rfn-agent-think-head:hover { color: var(--rail-brand-700); }
.rfn-agent-think.is-live .rfn-agent-think-head { color: var(--rail-brand-700); }
[data-theme="dark"] .rfn-agent-think.is-live .rfn-agent-think-head { color: var(--brand-refined-blue); }
.rfn-agent-think-caret { transition: transform .18s var(--agent-ease-out, ease); }
.rfn-agent-think-caret.is-open { transform: rotate(90deg); }
/* 자동 개폐(P9) — grid-rows 0fr↔1fr 소프트 폴드(height:auto 트랜지션 우회).
   live=자동 펼침 → 종료 시 자동 접힘 + 헤더 "N초 사고" 치환(JS). */
.rfn-agent-think-fold {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .34s var(--agent-ease-out, ease);
}
.rfn-agent-think-fold.is-open { grid-template-rows: 1fr; }
.rfn-agent-think-clip { overflow: hidden; min-height: 0; }
.rfn-agent-think-body {
  margin-top: 5px; font-size: 12px; line-height: 1.55;
  color: var(--rail-ink-600); white-space: pre-wrap;
}
/* live 틱커 — 고정 높이로 최신 사고만 노출(추종은 JS), 상단 소프트 페이드 */
.rfn-agent-think-body.is-ticker {
  max-height: 76px;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 26px);
          mask-image: linear-gradient(180deg, transparent 0, #000 26px);
}

/* 도구 실행 카드 — 실행 중=이름 shimmer+스피너+보더 틴트(불확정 채움 바는
   가짜 진행률로 오독돼 제거), 완료=good 스윕 1회(P13), 오류=정지+1회 shake(P32).
   스윕/shake 는 이 DOM 수명에서 running 을 관찰한 카드만(JS 게이트 — 복원은 정적). */
.rfn-agent-tool {
  border: 1px solid var(--rail-ink-100);
  border-radius: 11px;
  overflow: hidden;
  position: relative;
  transition: border-color .25s ease;
}
.rfn-agent-tool.is-running { border-color: var(--rail-brand-100); }
.rfn-agent-tool.is-error { border-color: color-mix(in srgb, var(--rail-bad) 35%, transparent); }
.rfn-agent-tool.is-just-done::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(100deg,
    transparent 32%,
    color-mix(in srgb, var(--rail-good) 15%, transparent) 50%,
    transparent 68%);
  background-size: 250% 100%;
  animation: rfn-agent-sweep .8s ease-out both;
}
@keyframes rfn-agent-sweep {
  from { background-position: 200% 0; }
  to   { background-position: -150% 0; }
}
.rfn-agent-tool.is-just-failed { animation: rfn-agent-shake .4s ease-in-out 1; }
@keyframes rfn-agent-shake {
  0%, 100% { transform: translateX(0); }
  25%      { transform: translateX(-3px); }
  50%      { transform: translateX(3px); }
  75%      { transform: translateX(-2px); }
}
.rfn-agent-tool-head {
  display: flex; align-items: center; gap: 8px; width: 100%;
  background: var(--rail-ink-50); border: 0; cursor: pointer;
  padding: 8px 11px; text-align: left;
}
[data-theme="dark"] .rfn-agent-tool-head { background: var(--rail-ink-100); }
.rfn-agent-tool-ic { display: flex; flex: none; }
.rfn-agent-tool-ic.is-running { color: var(--rail-brand-700); }
[data-theme="dark"] .rfn-agent-tool-ic.is-running { color: var(--brand-refined-blue); }
.rfn-agent-tool-ic.is-ok { color: var(--rail-good); animation: rfn-agent-pop-ok .4s var(--agent-ease-spring, ease) both; }
.rfn-agent-tool-ic.is-error { color: var(--rail-bad); }
@keyframes rfn-agent-pop-ok {
  0% { transform: scale(.4); }
  60% { transform: scale(1.25); }
  100% { transform: scale(1); }
}
.rfn-agent-tool-wrench { color: var(--rail-ink-500); flex: none; }
.rfn-agent-tool-name {
  flex: 1; min-width: 0;
  font-family: "JetBrains Mono", monospace; font-size: 12px;
  color: var(--rail-ink-800); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* 경과 타이머(P7) — 5s+ 실행에만 등장(JS 게이트), 위조 불가한 생존 신호 */
.rfn-agent-tool-time {
  font-family: "JetBrains Mono", monospace;
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
  color: var(--rail-ink-500);
  flex: none;
  animation: rfn-agent-item-in .25s ease-out both;
}
.rfn-agent-tool-detail { padding: 9px 11px; border-top: 1px solid var(--rail-ink-100); animation: rfn-agent-item-in .18s ease-out both; }
.rfn-agent-code {
  font-family: "JetBrains Mono", monospace; font-size: 11px; line-height: 1.5;
  color: var(--rail-ink-700); background: var(--rail-ink-50);
  border-radius: 7px; padding: 8px 9px; margin: 0; overflow-x: auto;
  white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow-y: auto;
}
[data-theme="dark"] .rfn-agent-code { background: var(--rail-ink-100); }
.rfn-agent-code + .rfn-agent-code { margin-top: 6px; }
.rfn-agent-spin { animation: rfn-agent-spin .8s linear infinite; }
@keyframes rfn-agent-spin { to { transform: rotate(360deg); } }

/* 이벤트 마커(승인/되묻기/오류) */
.rfn-agent-event {
  display: flex; align-items: center; gap: 7px;
  font-size: 12px; color: var(--rail-ink-600);
  padding: 2px 0;
}
.rfn-agent-event--error { color: var(--rail-bad); }
.rfn-agent-event-ic { flex: none; color: var(--rail-ink-500); }
.rfn-agent-event--error .rfn-agent-event-ic { color: var(--rail-bad); }
.rfn-agent-event-name { flex: 1; min-width: 0; }
.rfn-agent-chip {
  font-size: 10.5px; font-weight: 600; padding: 1.5px 8px; border-radius: 999px; flex: none;
  background: var(--rail-ink-100); color: var(--rail-ink-600);
  transition: background .2s ease, color .2s ease;
}
.rfn-agent-chip--ok { background: var(--rail-good-50); color: var(--rail-good); }
.rfn-agent-chip--bad { background: var(--rail-bad-50); color: var(--rail-bad); }
/* 승인 대기 칩 — 1회 등장 후 정적(P29: 무한 펄스는 재촉으로 지각) */
.rfn-agent-chip--wait { background: var(--rail-warn-50); color: var(--rail-warn); }

/* 어절 등장(P1) — 스트리밍 리빌 중 새로 마운트되는 어절만 blur-fade 재생.
   기존 어절 스팬은 위치 재조정으로 재생 없음, 완료 시 스팬 자체가 해제(P4). */
.rfn-agent-word {
  animation: rfn-agent-word-in .3s var(--agent-ease-out, ease-out) both;
}
@keyframes rfn-agent-word-in {
  from { opacity: 0; filter: blur(3px); }
  to   { opacity: 1; filter: blur(0); }
}

/* 라이브 캐럿(P3) — 생성 중 문장 끝에서 호흡하는 원형 도트 */
.rfn-agent-bubble--agent.is-live .rfn-agent-md > :last-child:not(pre)::after {
  content: "";
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-left: 4px;
  vertical-align: -0.5px;
  border-radius: 50%;
  background: var(--agent-grad, linear-gradient(135deg, var(--brand-refined-blue), var(--brand-onto-navy)));
  box-shadow: 0 0 7px rgba(118, 166, 215, .6);
  animation: rfn-agent-caret 1.15s ease-in-out infinite;
}
@keyframes rfn-agent-caret {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: .45; transform: scale(.78); }
}

/* 타이핑 인디케이터(P35) — TTFT 전용 위상차 웨이브. 2.5s 초과 시(JS)
   shimmer 문구로 승격해 '깊은 처리 중' 을 전달 */
.rfn-agent-typing { display: flex; align-items: center; gap: 5px; padding: 5px 2px 2px; }
.rfn-agent-typing-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: linear-gradient(135deg, var(--brand-refined-blue), var(--rail-brand-700));
  box-shadow: 0 0 6px rgba(118, 166, 215, .5);
  animation: rfn-agent-typing 1.15s ease-in-out infinite;
}
.rfn-agent-typing-dot:nth-child(2) { animation-delay: .14s; }
.rfn-agent-typing-dot:nth-child(3) { animation-delay: .28s; }
@keyframes rfn-agent-typing {
  0%, 60%, 100% { transform: translateY(0) scale(.85); opacity: .35; }
  30%           { transform: translateY(-5px) scale(1.05); opacity: 1; }
}
.rfn-agent-typing-label {
  margin-left: 4px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--rail-ink-500);
  background-image: linear-gradient(90deg,
    var(--rail-ink-500) 36%,
    var(--brand-refined-blue) 50%,
    var(--rail-ink-500) 64%);
  background-size: 220% 100%;
  -webkit-background-clip: text;
          background-clip: text;
  -webkit-text-fill-color: transparent;
  animation:
    rfn-agent-item-in .3s ease-out both,
    rfn-agent-shimmer 2.2s linear .3s infinite;
}

/* ── HITL 액션바 (승인) — 1회 등장 후 정적 대기(P29). 작업중의 흐르는 모션과
   이 정지의 대비가 곧 '지금은 당신 차례' 신호. amber 정적 보더만 남긴다. ── */
.rfn-agent-actionbar {
  display: flex; align-items: center; gap: 9px;
  padding: 11px 14px;
  border-top: 1px solid color-mix(in srgb, var(--rail-warn) 40%, transparent);
  background: var(--rail-warn-50);
  flex: none;
  animation: rfn-agent-slide-up .22s var(--agent-ease-out, ease) both;
}
.rfn-agent-actionbar-ic { color: var(--rail-warn); flex: none; }
.rfn-agent-actionbar-text {
  flex: 1; min-width: 0; font-size: 12px; color: var(--rail-ink-800); line-height: 1.4;
}
.rfn-agent-actionbar-text b { font-family: "JetBrains Mono", monospace; font-weight: 600; }
.rfn-agent-btn {
  font-family: "Roboto", "Pretendard", sans-serif; font-size: 12px; font-weight: 600;
  height: 28px; padding: 0 13px; border-radius: 8px; cursor: pointer; flex: none;
  border: 1px solid transparent;
  transition: transform .15s var(--agent-ease-spring, ease), filter .12s ease, background .12s ease;
}
.rfn-agent-btn:hover { transform: translateY(-1px); }
.rfn-agent-btn:active { transform: translateY(0) scale(.96); }
.rfn-agent-btn--primary {
  background: linear-gradient(135deg, var(--brand-refined-blue) 0%, var(--rail-brand-600) 100%);
  color: #FFFFFF;
  box-shadow: 0 2px 8px rgba(118, 166, 215, .35);
}
.rfn-agent-btn--primary:hover { filter: brightness(1.06); }
.rfn-agent-btn--ghost { background: transparent; color: var(--rail-ink-600); border-color: var(--rail-ink-200); }
.rfn-agent-btn--ghost:hover { background: var(--rail-ink-100); }

/* ── 되묻기 옵션 — 스태거 등장 칩 ── */
.rfn-agent-options {
  display: flex; flex-wrap: wrap; gap: 6px;
  padding: 10px 14px 0; flex: none;
}
/* 그라데이션 헤어라인 보더(P21) = "AI 의 제안" 시그니처 — 유저 요소와 출처 구분 */
.rfn-agent-option {
  font-size: 12px; color: var(--rail-ink-800);
  background:
    linear-gradient(var(--rail-ink-50), var(--rail-ink-50)) padding-box,
    linear-gradient(135deg,
      color-mix(in srgb, var(--brand-refined-blue) 55%, var(--rail-ink-200)),
      color-mix(in srgb, var(--brand-onto-navy) 45%, var(--rail-ink-200))) border-box;
  border: 1px solid transparent;
  border-radius: 999px; padding: 5.5px 13px; cursor: pointer;
  transition: color .16s ease, transform .16s var(--agent-ease-out, ease), box-shadow .16s ease;
  animation: rfn-agent-item-in .3s var(--agent-ease-out, ease) both;
}
[data-theme="dark"] .rfn-agent-option {
  background:
    linear-gradient(var(--rail-ink-100), var(--rail-ink-100)) padding-box,
    linear-gradient(135deg,
      color-mix(in srgb, var(--brand-refined-blue) 45%, var(--rail-ink-200)),
      color-mix(in srgb, var(--brand-onto-navy) 60%, var(--rail-ink-200))) border-box;
}
.rfn-agent-option:nth-child(1) { animation-delay: .03s; }
.rfn-agent-option:nth-child(2) { animation-delay: .08s; }
.rfn-agent-option:nth-child(3) { animation-delay: .13s; }
.rfn-agent-option:nth-child(4) { animation-delay: .18s; }
.rfn-agent-option:hover {
  background:
    linear-gradient(var(--rail-brand-50), var(--rail-brand-50)) padding-box,
    linear-gradient(135deg, var(--brand-refined-blue), var(--rail-brand-700)) border-box;
  color: var(--rail-brand-700); transform: translateY(-1px);
  box-shadow: 0 3px 8px rgba(118, 166, 215, .2);
}
[data-theme="dark"] .rfn-agent-option:hover { color: var(--brand-refined-blue); }

/* ── 작성기 — 포커스 시 그라데이션 링 ── */
.rfn-agent-composer {
  border-top: 1px solid var(--rail-ink-100);
  padding: 10px 12px 12px;
  flex: none;
  background: color-mix(in srgb, var(--rail-white) 82%, transparent);
  backdrop-filter: blur(10px);
  position: relative;
  z-index: 2;
}
[data-theme="dark"] .rfn-agent-composer {
  border-top-color: var(--rail-ink-200);
  background: color-mix(in srgb, #1A1D23 74%, transparent);
}
.rfn-agent-modes { display: flex; gap: 4px; margin-bottom: 8px; }
.rfn-agent-mode {
  font-size: 11px; font-weight: 500; color: var(--rail-ink-500);
  background: transparent; border: 1px solid var(--rail-ink-200);
  border-radius: 999px; padding: 2.5px 11px; cursor: pointer;
  transition: all .16s ease;
}
.rfn-agent-mode:hover { color: var(--rail-ink-800); border-color: var(--rail-ink-500); }
.rfn-agent-mode.is-active {
  color: var(--rail-brand-700);
  background: var(--rail-brand-50);
  border-color: var(--rail-brand-100);
  box-shadow: inset 0 0 0 1px rgba(118, 166, 215, .25);
}
[data-theme="dark"] .rfn-agent-mode.is-active { color: var(--brand-refined-blue); }
.rfn-agent-input {
  display: flex; align-items: flex-end; gap: 8px;
  background: var(--rail-ink-50); border: 1px solid var(--rail-ink-200);
  border-radius: 13px; padding: 6px 6px 6px 13px;
  transition: border-color .2s ease, box-shadow .25s ease;
}
.rfn-agent-input:focus-within {
  border-color: var(--rail-brand);
  box-shadow: 0 0 0 3px rgba(118, 166, 215, .18), 0 4px 14px rgba(118, 166, 215, .12);
}
[data-theme="dark"] .rfn-agent-input { background: var(--rail-ink-100); }
/* 질문 대기 — 답변 입력처로 주의 유도(글로우 범위 = 주의 범위, Type to Siri 문법) */
.rfn-agent-panel[data-agent-state="awaiting_clarification"] .rfn-agent-input {
  border-color: var(--rail-warn);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--rail-warn) 16%, transparent);
}
.rfn-agent-textarea {
  flex: 1; min-width: 0; resize: none; border: 0; outline: none; background: transparent;
  font-family: "Roboto", "Pretendard", sans-serif; font-size: 13px; line-height: 1.5;
  color: var(--rail-ink-900); max-height: 140px; padding: 5px 0;
}
.rfn-agent-textarea::placeholder { color: var(--rail-ink-500); }
/* 전송↔중단 단일 버튼 모프(P26) — 리마운트 대신 아이콘 crossfade + 색/radius
   트윈. '같은 결정점의 상태 변화'로 읽히고, 스트림 이벤트에만 바인딩된다. */
.rfn-agent-send {
  width: 32px; height: 32px; border-radius: 10px; border: 0; flex: none; cursor: pointer;
  position: relative;
  display: flex; align-items: center; justify-content: center;
  color: #FFFFFF;
  background: linear-gradient(135deg, var(--brand-refined-blue) 0%, var(--rail-brand-600) 100%);
  box-shadow: 0 2px 8px rgba(118, 166, 215, .3);
  transition: transform .18s var(--agent-ease-spring, ease), filter .12s ease,
    opacity .15s ease, box-shadow .2s ease, border-radius .24s var(--agent-ease-out, ease);
}
/* 중단(적색) 레이어 — 전송의 파랑과 같은 135° 그라데이션 문법으로 깊이를 맞춘다(단색 지양,
   같은 톤 계열 light→dark). 배경 그라데이션은 보간 불가라 오버레이 opacity 페이드로 모프. */
.rfn-agent-send::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(135deg,
    color-mix(in srgb, var(--rail-bad) 82%, #FFFFFF) 0%,
    var(--rail-bad) 100%);
  opacity: 0;
  transition: opacity .2s ease;
}
.rfn-agent-send-ic {
  position: absolute;
  z-index: 1;
  transition: opacity .16s ease, transform .22s var(--agent-ease-spring, ease);
}
/* 스핀(rotate) 없이 스케일 크로스페이드만 — 회전은 과해 싸구려로 읽힘. 형태(radius)는 전송과
   동일 유지(원형 급변 제거) — 색·글리프 전환만으로 상태를 읽히게 하는 "같은 문법". */
.rfn-agent-send-ic--stop { opacity: 0; transform: scale(.55); }
.rfn-agent-send.is-stop { box-shadow: 0 3px 11px rgba(226, 75, 74, .3); }
.rfn-agent-send.is-stop::before { opacity: 1; }
.rfn-agent-send.is-stop .rfn-agent-send-ic--send { opacity: 0; transform: scale(.55); }
.rfn-agent-send.is-stop .rfn-agent-send-ic--stop { opacity: 1; transform: none; }
.rfn-agent-send:hover { filter: brightness(1.07); transform: translateY(-1px); box-shadow: 0 5px 14px rgba(118, 166, 215, .42); }
/* 정지 상태 hover 는 빨간 글로우로 — 전송의 파란 글로우가 적색 버튼에 남던 문법 어긋남 수정. */
.rfn-agent-send.is-stop:hover { box-shadow: 0 6px 16px rgba(226, 75, 74, .4); }
/* 랜딩페이지 임베드용: 전송 버튼 아이콘을 항상 화살표로 고정 (정지 아이콘으로 전환되지 않도록) */
.rfn-agent-send-ic--send { opacity: 1 !important; transform: none !important; }
.rfn-agent-send-ic--stop { opacity: 0 !important; transform: scale(.55) !important; }
.rfn-agent-send.is-stop { box-shadow: 0 2px 8px rgba(118, 166, 215, .3) !important; }
.rfn-agent-send.is-stop::before { opacity: 0 !important; }
.rfn-agent-send:active { transform: scale(.88); }
/* 대기+빈입력은 disabled 속성 대신 aria-disabled — 포커스를 잃지 않고(#9), 정지 클릭 직후
   red→blue 모프가 '죽은 컨트롤'처럼 회색·무그림자로 뭉개지지 않게 box-shadow 를 유지한다(#3).
   클릭은 컴포넌트 onClick 에서 no-op 로 가드한다. */
.rfn-agent-send[aria-disabled="true"] { opacity: .45; cursor: default; }
.rfn-agent-send[aria-disabled="true"]:hover { filter: none; transform: none; box-shadow: 0 2px 8px rgba(118, 166, 215, .3); }
.rfn-agent-send[aria-disabled="true"]:active { transform: none; }
/* 시각적으로 숨긴 라이브리전 유틸(스크린리더 전용) — 상태 전환 announce(#5). */
.rfn-agent-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

/* ── 빈 상태 — "방금 깨어난" 1회성 인사(스태거) + 저진폭 리플 호흡만 허용 ── */
.rfn-agent-empty {
  height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 24px; gap: 6px;
}
.rfn-agent-empty-ic {
  width: 58px; height: 58px; border-radius: 17px; margin-bottom: 10px;
  display: flex; align-items: center; justify-content: center; color: #FFFFFF;
  background: linear-gradient(135deg, var(--brand-refined-blue) 0%, var(--brand-onto-navy) 100%);
  box-shadow: 0 10px 26px rgba(118, 166, 215, .35), inset 0 1px 0 rgba(255, 255, 255, .25);
  position: relative;
}
/* 리플 2겹 위상차 — 유일하게 허용되는 유휴 모션(존재의 호흡) */
.rfn-agent-empty-ic::before,
.rfn-agent-empty-ic::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  border: 1px solid rgba(118, 166, 215, .5);
  opacity: 0;
  animation: rfn-agent-ripple 3.8s ease-out infinite;
  pointer-events: none;
}
.rfn-agent-empty-ic::after { animation-delay: 1.9s; }
@keyframes rfn-agent-ripple {
  0%   { transform: scale(1); opacity: 0; }
  18%  { opacity: .5; }
  100% { transform: scale(1.55); opacity: 0; }
}
/* 타이틀 sheen — 등장 시 1회 스윕 후 정적(상시 반복은 벽지화) */
.rfn-agent-empty-title {
  font-family: "Roboto", "Pretendard", sans-serif; font-weight: 700; font-size: 16px;
  margin: 0;
  background: linear-gradient(100deg, var(--rail-ink-900) 20%, var(--rail-brand-700) 50%, var(--rail-ink-900) 80%);
  background-size: 200% 100%;
  -webkit-background-clip: text;
          background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rfn-agent-title-sheen 1.6s ease-in-out .35s 1 both;
}
[data-theme="dark"] .rfn-agent-empty-title {
  background-image: linear-gradient(100deg, var(--rail-ink-900) 20%, var(--brand-refined-blue) 50%, var(--rail-ink-900) 80%);
}
@keyframes rfn-agent-title-sheen {
  from { background-position: 180% 0; }
  to   { background-position: 0% 0; }
}
.rfn-agent-empty-sub { font-size: 12px; color: var(--rail-ink-500); margin: 0; }
.rfn-agent-suggests { display: flex; flex-direction: column; gap: 7px; margin-top: 16px; width: 100%; max-width: 320px; }
.rfn-agent-suggest {
  font-size: 12.5px; color: var(--rail-ink-700); text-align: left;
  background: var(--rail-ink-50); border: 1px solid var(--rail-ink-200);
  border-radius: 11px; padding: 10px 13px; cursor: pointer;
  transition: all .18s var(--agent-ease-out, ease);
  animation: rfn-agent-item-in .4s var(--agent-ease-out, ease) both;
}
.rfn-agent-suggest:nth-child(1) { animation-delay: .05s; }
.rfn-agent-suggest:nth-child(2) { animation-delay: .12s; }
.rfn-agent-suggest:nth-child(3) { animation-delay: .19s; }
.rfn-agent-suggest:hover {
  background: var(--rail-brand-50); border-color: var(--rail-brand-100); color: var(--rail-ink-900);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(118, 166, 215, .18);
}

/* ── 단축키 치트시트 팝오버 ── */
.rfn-agent-help-backdrop { position: absolute; inset: 0; z-index: 5; }
.rfn-agent-help {
  position: absolute;
  top: 52px;
  right: 12px;
  z-index: 6;
  width: 268px;
  background: var(--rail-white);
  border: 1px solid var(--rail-ink-200);
  border-radius: 13px;
  box-shadow: 0 18px 40px rgba(20, 30, 45, .2), 0 4px 12px rgba(20, 30, 45, .1);
  padding: 12px;
  transform-origin: top right;
  animation: rfn-agent-pop .22s var(--agent-ease-spring, ease) both;
}
[data-theme="dark"] .rfn-agent-help {
  background: #202329;
  box-shadow: 0 18px 40px rgba(0, 0, 0, .55), 0 4px 12px rgba(0, 0, 0, .35);
}
@keyframes rfn-agent-pop {
  from { opacity: 0; transform: scale(.92) translateY(-6px); }
  to   { opacity: 1; transform: none; }
}
.rfn-agent-help-title {
  font-family: "Roboto", "Pretendard", sans-serif; font-weight: 700; font-size: 12px;
  color: var(--rail-ink-900); padding: 2px 4px 8px;
}
.rfn-agent-help-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rfn-agent-help-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 6px 4px;
}
.rfn-agent-help-row + .rfn-agent-help-row { border-top: 1px solid var(--rail-ink-100); }
[data-theme="dark"] .rfn-agent-help-row + .rfn-agent-help-row { border-top-color: var(--rail-ink-200); }
.rfn-agent-help-label { font-size: 12px; color: var(--rail-ink-700); }
.rfn-agent-help-keys { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.rfn-agent-help-chord { display: inline-flex; align-items: center; gap: 3px; }
.rfn-agent-help-sep { color: var(--rail-ink-500); font-size: 11px; margin: 0 3px; }

/* 재사용 키캡 */
.rfn-kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 5px;
  font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; line-height: 1;
  color: var(--rail-ink-700);
  background: var(--rail-ink-50);
  border: 1px solid var(--rail-ink-200);
  border-radius: 5px;
  box-shadow: 0 1px 0 var(--rail-ink-200);
}
[data-theme="dark"] .rfn-kbd { background: var(--rail-ink-100); box-shadow: 0 1px 0 rgba(0,0,0,.35); }

/* ── 세션 열람(대화 기록) ── */
.rfn-agent-sessions {
  position: absolute;
  inset: 0;
  z-index: 6;
  display: flex;
  flex-direction: column;
  background: var(--rail-white);
  animation: rfn-agent-sessions-in .26s var(--agent-ease-out, ease) both;
}
[data-theme="dark"] .rfn-agent-sessions { background: #1A1D23; }
@keyframes rfn-agent-sessions-in {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}
.rfn-agent-sessions-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 12px 13px 15px;
  border-bottom: 1px solid var(--rail-ink-100);
  flex: none;
}
[data-theme="dark"] .rfn-agent-sessions-head { border-bottom-color: var(--rail-ink-200); }
.rfn-agent-sessions-title {
  font-family: "Roboto", "Pretendard", sans-serif; font-weight: 700; font-size: 14px;
  color: var(--rail-ink-900); letter-spacing: -.01em;
}
.rfn-agent-sessions-list { list-style: none; margin: 0; padding: 8px; overflow-y: auto; flex: 1; min-height: 0; }
.rfn-agent-session {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  background: transparent; border: 0; border-radius: 11px; padding: 10px 8px 10px 11px;
  cursor: pointer;
  position: relative;
  transition: background .14s ease, transform .14s ease;
  animation: rfn-agent-item-in .3s var(--agent-ease-out, ease) both;
}
.rfn-agent-sessions-list li:nth-child(1) .rfn-agent-session { animation-delay: .02s; }
.rfn-agent-sessions-list li:nth-child(2) .rfn-agent-session { animation-delay: .06s; }
.rfn-agent-sessions-list li:nth-child(3) .rfn-agent-session { animation-delay: .10s; }
.rfn-agent-sessions-list li:nth-child(4) .rfn-agent-session { animation-delay: .14s; }
.rfn-agent-sessions-list li:nth-child(5) .rfn-agent-session { animation-delay: .18s; }
/* hover 시 좌측 브랜드 라이트 바 */
.rfn-agent-session::before {
  content: "";
  position: absolute;
  left: 0; top: 22%; bottom: 22%;
  width: 2.5px;
  border-radius: 2px;
  background: linear-gradient(180deg, var(--brand-refined-blue), var(--rail-brand-700));
  opacity: 0;
  transform: scaleY(.4);
  transition: opacity .16s ease, transform .18s var(--agent-ease-out, ease);
}
.rfn-agent-session:hover { background: var(--rail-ink-50); transform: translateX(2px); }
.rfn-agent-session:hover::before { opacity: 1; transform: scaleY(1); }
[data-theme="dark"] .rfn-agent-session:hover { background: var(--rail-ink-100); }
.rfn-agent-session-ic { color: var(--rail-brand); flex: none; }
.rfn-agent-session-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.rfn-agent-session-title {
  font-size: 12.5px; color: var(--rail-ink-900);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rfn-agent-session-meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--rail-ink-500); }
.rfn-agent-session-del {
  display: flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 7px; flex: none;
  color: var(--rail-ink-500);
  opacity: 0;
  transition: background .12s ease, color .12s ease, opacity .15s ease;
}
.rfn-agent-session:hover .rfn-agent-session-del,
.rfn-agent-session-del:focus-visible { opacity: 1; }
.rfn-agent-session-del:hover { background: var(--rail-bad-50); color: var(--rail-bad); }
.rfn-agent-sessions-empty {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; color: var(--rail-ink-500); font-size: 12.5px;
}

/* ── 공용 등장 키프레임 ── */
.rfn-agent-row, .rfn-agent-tool, .rfn-agent-event, .rfn-agent-think {
  animation: rfn-agent-item-in .32s var(--agent-ease-out, cubic-bezier(.22,1,.36,1)) both;
}
/* 유저 버블 — 아래→위 스프링 안착(P24, 미세 오버슛) = "접수됨" 즉물 피드백 */
.rfn-agent-row--user {
  animation: rfn-agent-user-in .38s var(--agent-ease-spring, cubic-bezier(.3,1.12,.35,1)) both;
}
@keyframes rfn-agent-user-in {
  from { opacity: 0; transform: translateY(12px) scale(.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes rfn-agent-item-in {
  from { opacity: 0; transform: translateY(8px); filter: blur(2px); }
  to   { opacity: 1; transform: none; filter: blur(0); }
}
@keyframes rfn-agent-slide-up {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}

/* "↓ 새 활동" 필(P27) — 추종 해제 중 새 콘텐츠 알림. sticky 로 피드 하단 부유 */
.rfn-agent-jump {
  position: sticky;
  bottom: 4px;
  align-self: center;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--rail-ink-700);
  background: color-mix(in srgb, var(--rail-white) 82%, transparent);
  backdrop-filter: blur(8px);
  border: 1px solid var(--rail-ink-200);
  border-radius: 999px;
  padding: 5px 12px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(20, 30, 45, .16);
  animation: rfn-agent-item-in .25s var(--agent-ease-out, ease) both;
  z-index: 3;
}
.rfn-agent-jump:hover { color: var(--rail-brand-700); border-color: var(--rail-brand-100); }
[data-theme="dark"] .rfn-agent-jump {
  background: color-mix(in srgb, #1A1D23 80%, transparent);
  box-shadow: 0 4px 14px rgba(0, 0, 0, .4);
}

/* ── 접근성(P33) — 모션 최소화 선호 시: 전정(어지럼) 유발 모션만 정지하고
   색·투명도·필수 피드백은 보존한다. 이전엔 트랜지션까지 통째로 죽여 "시스템이
   죽어 보이는" 상태였음(P33 위반) → 루프/이동성 애니메이션만 끄고, 트랜지션(색·
   글로우·포커스 피드백)과 상태 신호는 살린다. 패널 열림/닫힘은 이동 대신 페이드. ── */
@media (prefers-reduced-motion: reduce) {
  /* 루프·장식·이동성 애니메이션 전부 정지(트랜지션은 유지 — 아래서 예외 재지정) */
  [class*="rfn-agent"],
  [class*="rfn-agent"]::before,
  [class*="rfn-agent"]::after {
    animation: none !important;
  }
  /* 필수 신호 예외 — 로딩 스피너는 "작업 중" 핵심 신호라 유지(약간 느리게) */
  .rfn-agent-spin { animation: rfn-agent-spin 1.1s linear infinite !important; }

  /* 커서 반응(틸트·마그네틱·패럴랙스)은 JS 가드로 이미 off. hover/press 이동만
     무효화(색·글로우 피드백은 트랜지션으로 유지). */
  .rfn-agent-fab:hover, .rfn-agent-fab:active,
  .rfn-agent-send:hover, .rfn-agent-send:active, .rfn-agent-btn:hover,
  .rfn-agent-option:hover, .rfn-agent-suggest:hover, .rfn-agent-session:hover,
  .rfn-agent-jump:hover { transform: none !important; }

  /* 전송↔정지 모프는 keyframe 이 아니라 transition 기반(아이콘 scale/rotate·radius·오버레이).
     reduced-motion 에서 그대로 재생되므로 즉시 스냅한다 — 상태(정지/전송)는 그대로 읽힌다(#8). */
  .rfn-agent-send, .rfn-agent-send::before, .rfn-agent-send-ic {
    transition-duration: .01ms !important;
  }

  /* 패널 열림/닫힘 — clip 원·scale 이동 대신 단순 페이드(전정 회피). orb→카드
     표면 cross-fade(morph, opacity)는 유지해 컨테이너 전환의 정체성 힌트를 남긴다. */
  .rfn-agent-panel--float.is-entering { animation: rfn-agent-rm-fade-in .2s linear both !important; }
  .rfn-agent-panel--float.is-closing { animation: rfn-agent-rm-fade-out .16s linear both !important; }
  .rfn-agent-panel--float.is-entering .rfn-agent-panel-morph {
    animation: rfn-agent-morph-out .24s linear both !important;
  }
  .rfn-agent-panel--float.is-closing .rfn-agent-panel-morph {
    animation: rfn-agent-morph-in .18s linear both !important;
  }
  /* 뷰 전환 크기 트랜지션은 즉시(이동 회피), 그림자만 부드럽게 */
  .rfn-agent-panel { transition: box-shadow .2s ease !important; }

  /* shimmer·라벨은 정적 그라데이션으로 가독 유지(스윕만 정지) */
  .rfn-agent-shimmer-text, .rfn-agent-typing-label { background-position: 50% 0; }
}
@keyframes rfn-agent-rm-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes rfn-agent-rm-fade-out { from { opacity: 1; } to { opacity: 0; } }

/* ── Skeleton (타일 로딩 자리표시자) ─────────────────────────────
   data.status === "loading" 동안 값·차트·행 자리를 채우는 shimmer 블록.
   레이아웃(크기·라운드)은 호출측 Tailwind, 색·애니메이션은 여기(SSOT).
   base = rail-ink-100, 위로 rail-ink-200 하이라이트 밴드가 좌→우로 흐른다. */
.rfn-skeleton {
  position: relative;
  overflow: hidden;
  background: var(--rail-ink-100);
  border-radius: 6px;
}
.rfn-skeleton::after {
  content: "";
  position: absolute;
  inset: 0;
  transform: translateX(-100%);
  background: linear-gradient(
    90deg,
    transparent 0,
    color-mix(in srgb, var(--rail-ink-200) 70%, transparent) 50%,
    transparent 100%
  );
  animation: rfn-skeleton-sweep 1.4s ease-in-out infinite;
}
@keyframes rfn-skeleton-sweep {
  to { transform: translateX(100%); }
}
/* reduced-motion — 스윕 정지, 은은한 밝기 펄스만으로 로딩을 전달 */
@media (prefers-reduced-motion: reduce) {
  .rfn-skeleton::after {
    animation: rfn-skeleton-pulse 1.6s ease-in-out infinite;
    transform: none;
    background: color-mix(in srgb, var(--rail-ink-200) 45%, transparent);
  }
}
@keyframes rfn-skeleton-pulse {
  0%, 100% { opacity: 0.25; }
  50%      { opacity: 0.7; }
}

/* ═══════════════════════════════════════════
   AI Agent Workspace (.rfn-agent-ws-*) — 풀페이지 3-분할 워크스페이스 [목업]
   좌 세션레일 / 중 대화캔버스(720px 제한) / 우 아티팩트·플랜(드래그).
   Living Signal v4 계승 — 페이지 입장 3-pane 스태거, 아티팩트 슬라이드인,
   플랜 스텝 점등, 상태 라이트바. 토큰(rail·brand)만, [data-theme] 대응.
   ═══════════════════════════════════════════ */
.rfn-agent-ws {
  position: relative; /* 모바일 절대배치 오버레이(rail·drawer)의 컨테이닝 블록 */
  display: flex;
  /* AppContent(selfScroll) 의 flex 컬럼 자식으로 콘텐츠 영역을 채운다 — 100vh 로 하면 topbar
     높이만큼 넘쳐 컴포저가 화면 밖으로 밀린다. flex:1 + min-height:0 이 내부 캔버스 스크롤을 허용. */
  flex: 1;
  min-height: 0;
  background:
    radial-gradient(90% 50% at 50% 0%, rgba(118, 166, 215, .05) 0%, transparent 60%),
    var(--rail-white);
  color: var(--rail-ink-900);
  overflow: hidden;
}

/* ── 좌: 세션 레일 ── */
.rfn-agent-ws-rail {
  flex: none;
  width: 244px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--rail-ink-100);
  background: color-mix(in srgb, var(--rail-white) 60%, transparent);
  transition: width .28s var(--agent-ease-out);
  animation: rfn-agent-ws-in-left .42s var(--agent-ease-out) both;
  overflow: hidden;
}
[data-theme="dark"] .rfn-agent-ws-rail { border-right-color: var(--rail-ink-200); }
.rfn-agent-ws-rail.is-collapsed { width: 52px; }
.rfn-agent-ws-rail-head {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 10px; flex: none;
}
/* 채워진 primary — 흰 텍스트로 라이트/다크 양 모드 고대비 보장(기존 brand-50 배경은
   다크에서 밝게 렌더돼 파란 텍스트가 안 보이던 문제). */
.rfn-agent-ws-new {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; flex: 1;
  font-size: 12.5px; font-weight: 600; color: #FFFFFF;
  background: linear-gradient(135deg, var(--brand-refined-blue), var(--rail-brand-700));
  border: 0; border-radius: 9px;
  padding: 8px 11px; cursor: pointer;
  box-shadow: 0 2px 8px rgba(29, 46, 82, .2), inset 0 1px 0 rgba(255, 255, 255, .18);
  transition: filter .12s ease, transform .15s var(--agent-ease-out);
}
.rfn-agent-ws-new > svg { color: #FFFFFF; }
.rfn-agent-ws-new:hover { filter: brightness(1.06); transform: translateY(-1px); }
.rfn-agent-ws-rail-label {
  font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  color: var(--rail-ink-500); padding: 6px 16px 4px;
}
.rfn-agent-ws-rail-empty { font-size: 12px; color: var(--rail-ink-500); padding: 4px 16px 12px; }
.rfn-agent-ws-sessions { list-style: none; margin: 0; padding: 2px 8px 12px; overflow-y: auto; flex: 1; min-height: 0; }
.rfn-agent-ws-session {
  display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
  background: transparent; border: 0; border-radius: 10px; padding: 9px 9px 9px 11px;
  cursor: pointer; position: relative;
  transition: background .14s ease;
  animation: rfn-agent-item-in .3s var(--agent-ease-out) both;
}
.rfn-agent-ws-session::before {
  content: ""; position: absolute; left: 0; top: 20%; bottom: 20%; width: 2.5px; border-radius: 2px;
  background: linear-gradient(180deg, var(--brand-refined-blue), var(--rail-brand-700));
  opacity: 0; transform: scaleY(.4);
  transition: opacity .16s ease, transform .18s var(--agent-ease-out);
}
.rfn-agent-ws-session:hover { background: var(--rail-ink-50); }
[data-theme="dark"] .rfn-agent-ws-session:hover { background: var(--rail-ink-100); }
.rfn-agent-ws-session.is-active { background: var(--rail-brand-50); }
[data-theme="dark"] .rfn-agent-ws-session.is-active { background: var(--rail-ink-100); }
.rfn-agent-ws-session.is-active::before { opacity: 1; transform: scaleY(1); }
.rfn-agent-ws-session-ic { color: var(--rail-brand); flex: none; }
.rfn-agent-ws-session.is-active .rfn-agent-ws-session-ic { color: var(--rail-brand-700); }
[data-theme="dark"] .rfn-agent-ws-session.is-active .rfn-agent-ws-session-ic { color: var(--brand-refined-blue); }
.rfn-agent-ws-session-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.rfn-agent-ws-session-title {
  font-size: 12.5px; color: var(--rail-ink-900); line-height: 1.3;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rfn-agent-ws-session-meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--rail-ink-500); }
.rfn-agent-ws-session-scope {
  font-size: 10px; padding: 0 6px; border-radius: 999px;
  background: var(--rail-ink-100); color: var(--rail-ink-600);
}
.rfn-agent-ws-session-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; margin-left: auto; background: var(--rail-ink-300); }
.rfn-agent-ws-session-dot.is-running { background: var(--brand-refined-blue); animation: rfn-agent-dot-pulse 2s ease-in-out infinite; }
.rfn-agent-ws-session-dot.is-completed { background: var(--rail-good); }
.rfn-agent-ws-session-dot.is-awaiting { background: var(--rail-warn); animation: rfn-agent-dot-pulse 1.1s ease-in-out infinite; }
