.rfn-agent-ws-session-dot.is-error { background: var(--rail-bad); }

/* ── 중: 메인 컬럼 ── */
.rfn-agent-ws-main {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column;
  animation: rfn-agent-ws-in-up .46s var(--agent-ease-out) .05s both;
}
.rfn-agent-ws-topbar {
  display: flex; align-items: center; gap: 12px; flex: none;
  height: 52px; padding: 0 14px;
  border-bottom: 1px solid var(--rail-ink-100);
}
[data-theme="dark"] .rfn-agent-ws-topbar { border-bottom-color: var(--rail-ink-200); }
.rfn-agent-ws-brand { display: inline-flex; align-items: center; gap: 8px; flex: none; }
.rfn-agent-ws-brand-ic {
  width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
  color: #FFFFFF; background: linear-gradient(135deg, var(--brand-refined-blue), var(--brand-onto-navy));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 2px 6px rgba(29, 46, 82, .22);
}
.rfn-agent-ws-brand-name { font-family: "Roboto", "Pretendard", sans-serif; font-weight: 700; font-size: 14px; letter-spacing: -.01em; }
.rfn-agent-ws-topbar-title {
  flex: 1; min-width: 0; font-size: 12.5px; color: var(--rail-ink-500);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  padding-left: 6px; border-left: 1px solid var(--rail-ink-200); margin-left: 4px;
}
.rfn-agent-ws-topbar-actions { display: flex; align-items: center; gap: 4px; flex: none; }

/* 워크스페이스 툴바(패널 복귀 · 권한 요약 · 아티팩트 토글) */
.rfn-agent-ws-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: none;
  padding: 8px 16px; border-bottom: 1px solid var(--rail-ink-100);
  background: color-mix(in srgb, var(--rail-white) 70%, transparent);
  backdrop-filter: blur(8px);
}
[data-theme="dark"] .rfn-agent-ws-bar { border-bottom-color: var(--rail-ink-200); }
.rfn-agent-ws-return {
  display: inline-flex; align-items: center; gap: 7px; flex: none;
  font-size: 12px; font-weight: 500; color: var(--rail-ink-600);
  background: var(--rail-ink-50); border: 1px solid var(--rail-ink-200); border-radius: 8px;
  padding: 5px 10px 5px 9px; cursor: pointer;
  transition: color .14s ease, border-color .14s ease, background .14s ease, transform .16s var(--agent-ease-out);
}
[data-theme="dark"] .rfn-agent-ws-return { background: var(--rail-ink-100); }
/* hover 시 살짝 왼쪽으로 — "돌아가기" 방향 신호(목적 전달) */
.rfn-agent-ws-return:hover {
  color: var(--rail-brand-700); border-color: var(--rail-brand-100);
  background: var(--rail-brand-50); transform: translateX(-1px);
}
[data-theme="dark"] .rfn-agent-ws-return:hover { color: var(--brand-refined-blue); }
.rfn-agent-ws-return > svg { color: var(--rail-brand); flex: none; }
.rfn-agent-ws-return:active { transform: translateX(-1px) scale(.97); }
.rfn-agent-ws-scope-right { display: flex; align-items: center; gap: 8px; flex: none; }
.rfn-agent-ws-scope-hint {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; color: var(--rail-ink-500);
}
.rfn-agent-ws-scope-hint > svg { color: var(--rail-ink-400); flex: none; }
/* 아티팩트 토글 알림 점 — 드로어 닫힘 + 산출물 존재 시 발견성 신호(부드러운 펄스) */
.rfn-agent-ws-artifact-toggle { position: relative; }
.rfn-agent-ws-artifact-badge {
  position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%;
  background: var(--brand-refined-blue); box-shadow: 0 0 0 2px var(--rail-white);
  animation: rfn-agent-dot-pulse 2s ease-in-out infinite;
}
[data-theme="dark"] .rfn-agent-ws-artifact-badge { box-shadow: 0 0 0 2px #1A1D23; }

/* 대화 캔버스 */
.rfn-agent-ws-canvas { flex: 1; min-height: 0; overflow-y: auto; }
.rfn-agent-ws-thread { max-width: 768px; margin: 0 auto; padding: 8px 8px 24px; }
.rfn-agent-ws-composer {
  flex: none; border-top: 1px solid var(--rail-ink-100);
  padding: 10px 0 12px; background: color-mix(in srgb, var(--rail-white) 82%, transparent);
  backdrop-filter: blur(10px);
}
[data-theme="dark"] .rfn-agent-ws-composer { border-top-color: var(--rail-ink-200); }
.rfn-agent-ws-composer .rfn-agent-composer {
  border-top: 0; background: transparent; backdrop-filter: none;
  max-width: 768px; margin: 0 auto; padding-top: 0; padding-bottom: 0;
}

/* HITL Hard 카드 */
.rfn-agent-ws-hardcard {
  margin: 12px 4px 4px; border-radius: 14px;
  border: 1px solid color-mix(in srgb, var(--rail-warn) 45%, transparent);
  background: var(--rail-warn-50);
  overflow: hidden;
  animation: rfn-agent-slide-up .3s var(--agent-ease-out) both;
}
.rfn-agent-ws-hardcard-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 13px; font-size: 12.5px; font-weight: 600; color: var(--rail-warn);
  border-bottom: 1px solid color-mix(in srgb, var(--rail-warn) 22%, transparent);
}
.rfn-agent-ws-hardcard-tier {
  margin-left: auto; font-size: 10.5px; font-weight: 700; letter-spacing: .03em;
  padding: 1.5px 8px; border-radius: 999px; background: var(--rail-warn); color: #FFFFFF;
}
.rfn-agent-ws-hardcard-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px;
  padding: 12px 13px; font-size: 12.5px; color: var(--rail-ink-800);
}
.rfn-agent-ws-hardcard-grid > div:first-child { grid-column: 1 / -1; }
.rfn-agent-ws-hardcard-grid b { font-family: "JetBrains Mono", monospace; font-weight: 600; }
.rfn-agent-ws-hardcard-k { display: inline-block; min-width: 48px; color: var(--rail-ink-500); margin-right: 8px; }
.rfn-agent-ws-hardcard-note { margin: 0; padding: 0 13px 10px; font-size: 11.5px; color: var(--rail-ink-500); }
.rfn-agent-ws-hardcard-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 0 13px 12px; }
.rfn-agent-ws-hardcard-actions .rfn-agent-btn { display: inline-flex; align-items: center; gap: 5px; height: 30px; }

/* ── 우: 아티팩트/플랜 패널 ── */
.rfn-agent-ws-side-wrap {
  flex: none; min-width: 0;
  border-left: 1px solid var(--rail-ink-100);
  overflow: hidden;
  /* 드로어 개폐 = width 트랜지션(양방향). 리사이즈 중에는 .is-resizing 이 이를 꺼 즉시 추종. */
  transition: width .32s var(--agent-ease-out);
}
.rfn-agent-ws-side-wrap.is-resizing { transition: none; }
.rfn-agent-ws-side-wrap[data-open="false"] { border-left-color: transparent; pointer-events: none; }
[data-theme="dark"] .rfn-agent-ws-side-wrap { border-left-color: var(--rail-ink-200); }
[data-theme="dark"] .rfn-agent-ws-side-wrap[data-open="false"] { border-left-color: transparent; }
.rfn-agent-ws-side { position: relative; height: 100%; display: flex; flex-direction: column; }
.rfn-agent-ws-resize {
  position: absolute; left: -3px; top: 0; bottom: 0; width: 7px; z-index: 3;
  cursor: col-resize; touch-action: none;
}
.rfn-agent-ws-resize::after {
  content: ""; position: absolute; left: 3px; top: 0; bottom: 0; width: 1px; background: transparent;
  transition: background .15s ease;
}
.rfn-agent-ws-resize:hover::after { background: var(--rail-brand); }
.rfn-agent-ws-side-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none;
  padding: 8px 10px 8px 12px; border-bottom: 1px solid var(--rail-ink-100);
}
[data-theme="dark"] .rfn-agent-ws-side-head { border-bottom-color: var(--rail-ink-200); }
.rfn-agent-ws-tabs { display: flex; gap: 2px; overflow-x: auto; }
.rfn-agent-ws-tab {
  display: inline-flex; align-items: center; gap: 5px; flex: none;
  font-size: 12px; font-weight: 500; color: var(--rail-ink-500);
  background: transparent; border: 0; border-radius: 8px; padding: 5px 9px; cursor: pointer;
  transition: color .14s ease, background .14s ease;
}
.rfn-agent-ws-tab:hover { color: var(--rail-ink-800); background: var(--rail-ink-50); }
[data-theme="dark"] .rfn-agent-ws-tab:hover { background: var(--rail-ink-100); }
.rfn-agent-ws-tab.is-active { color: var(--rail-brand-700); background: var(--rail-brand-50); }
[data-theme="dark"] .rfn-agent-ws-tab.is-active { color: var(--brand-refined-blue); background: var(--rail-ink-100); }
.rfn-agent-ws-side-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; }

/* 플랜 타임라인 — 스텝 점등 */
.rfn-agent-ws-plan { display: flex; flex-direction: column; }
.rfn-agent-ws-step { display: flex; gap: 11px; animation: rfn-agent-item-in .3s var(--agent-ease-out) both; }
.rfn-agent-ws-step-rail { display: flex; flex-direction: column; align-items: center; flex: none; }
.rfn-agent-ws-step-ic { display: flex; color: var(--rail-ink-400); }
.rfn-agent-ws-step.is-done .rfn-agent-ws-step-ic { color: var(--rail-good); }
.rfn-agent-ws-step.is-failed .rfn-agent-ws-step-ic { color: var(--rail-bad); }
.rfn-agent-ws-step.is-active .rfn-agent-ws-step-ic { color: var(--rail-brand-700); position: relative; }
[data-theme="dark"] .rfn-agent-ws-step.is-active .rfn-agent-ws-step-ic { color: var(--brand-refined-blue); }
/* active 스텝 = 지금 실행 중 — 레이더 핑(목적: "이 단계가 진행 중") */
.rfn-agent-ws-step.is-active .rfn-agent-ws-step-ic::before {
  content: ""; position: absolute; inset: -3px; border-radius: 50%;
  border: 1.5px solid var(--rail-brand); pointer-events: none;
  animation: rfn-agent-ws-step-ping 1.8s var(--agent-ease-out) infinite;
}
@keyframes rfn-agent-ws-step-ping {
  0%   { transform: scale(.65); opacity: .55; }
  70%  { opacity: 0; }
  100% { transform: scale(1.5); opacity: 0; }
}
.rfn-agent-ws-step-line { flex: 1; width: 2px; min-height: 14px; margin: 2px 0; border-radius: 2px; background: var(--rail-ink-200); }
.rfn-agent-ws-step.is-done .rfn-agent-ws-step-line { background: var(--rail-good); }
.rfn-agent-ws-step.is-failed .rfn-agent-ws-step-line { background: var(--rail-bad); }
.rfn-agent-ws-step-body { padding-bottom: 16px; min-width: 0; }
.rfn-agent-ws-step-title {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 13px; color: var(--rail-ink-800); line-height: 1.4;
}
.rfn-agent-ws-step.is-pending .rfn-agent-ws-step-title { color: var(--rail-ink-500); }
.rfn-agent-ws-step.is-active .rfn-agent-ws-step-title { font-weight: 600; color: var(--rail-ink-900); }
.rfn-agent-ws-conf {
  font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 999px; flex: none;
}
.rfn-agent-ws-conf.is-auto { background: var(--rail-good-50); color: var(--rail-good); }
.rfn-agent-ws-conf.is-review { background: var(--rail-warn-50); color: var(--rail-warn); }
.rfn-agent-ws-conf.is-human { background: var(--rail-bad-50); color: var(--rail-bad); }
.rfn-agent-ws-step-detail { margin-top: 3px; font-size: 11.5px; color: var(--rail-ink-500); font-family: "JetBrains Mono", monospace; }

/* 아티팩트 — 최신 도구 결과(실데이터). 진입 페이드 */
.rfn-agent-ws-artifact {
  display: flex; flex-direction: column; gap: 10px;
  animation: rfn-agent-item-in .3s var(--agent-ease-out) both;
}
.rfn-agent-ws-artifact .rfn-agent-code { margin: 0; max-height: 360px; overflow: auto; }
.rfn-agent-ws-artifact-note { font-size: 12px; color: var(--rail-ink-600); line-height: 1.5; margin: 0; }

/* ═══════ 아티팩트 탭 — 컬렉션(격자/목록+썸네일) ↔ 상세 마스터-디테일 (제품 rfn-aws2-* 미러) ═══════ */
.rfn-aws2-artcoll { display: flex; flex-direction: column; gap: 10px; }
.rfn-aws2-artcoll-head { display: flex; align-items: center; justify-content: space-between; }
.rfn-aws2-artcoll-count { font-size: 11px; font-weight: 500; color: var(--rail-ink-500); }
.rfn-aws2-artview { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--rail-ink-50); }
[data-theme="dark"] .rfn-aws2-artview { background: var(--rail-ink-100); }
.rfn-aws2-artview-btn { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: var(--rail-ink-400); cursor: pointer; transition: all .12s ease; }
.rfn-aws2-artview-btn:hover { color: var(--rail-ink-700); }
.rfn-aws2-artview-btn.is-active { background: var(--rail-white); color: var(--rail-brand-700); box-shadow: 0 1px 3px rgba(15,23,42,.1); }
[data-theme="dark"] .rfn-aws2-artview-btn.is-active { background: var(--rail-ink-200); color: var(--brand-refined-blue); }

.rfn-aws2-artgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.rfn-aws2-minicard { display: flex; flex-direction: column; gap: 6px; padding: 8px; width: 100%; text-align: left; cursor: pointer; border: 1px solid var(--rail-ink-100); border-radius: 11px; background: var(--rail-white); transition: transform .14s var(--agent-ease-out), border-color .14s ease, box-shadow .18s ease; animation: rfn-agent-item-in .3s var(--agent-ease-out) both; }
[data-theme="dark"] .rfn-aws2-minicard { border-color: var(--rail-ink-200); }
.rfn-aws2-minicard:hover { border-color: var(--rail-brand); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(118,166,215,.14); }
.rfn-aws2-minicard:focus-visible { outline: none; border-color: var(--rail-brand); box-shadow: 0 0 0 3px var(--rail-brand-50); }
.rfn-aws2-minicard-title { font-size: 11.5px; font-weight: 600; color: var(--rail-ink-900); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rfn-aws2-minicard-type { font-size: 10px; color: var(--rail-ink-500); }
.rfn-aws2-minicard-thumb, .rfn-aws2-artrow-thumb { display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 8px; background: var(--rail-ink-50); }
[data-theme="dark"] .rfn-aws2-minicard-thumb, [data-theme="dark"] .rfn-aws2-artrow-thumb { background: var(--rail-ink-100); }
.rfn-aws2-minicard-thumb { height: 84px; }
.rfn-aws2-artrow-thumb { width: 52px; height: 52px; flex: none; }
.rfn-aws2-artthumb-img { width: 100%; height: 100%; object-fit: cover; }
.rfn-aws2-artthumb-mini { width: 100%; height: 100%; padding: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.rfn-aws2-artthumb-ic { color: var(--rail-ink-600); display: flex; }

.rfn-aws2-artlist { display: flex; flex-direction: column; gap: 6px; }
.rfn-aws2-artrow { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 8px; text-align: left; cursor: pointer; border: 1px solid var(--rail-ink-100); border-radius: 10px; background: var(--rail-white); transition: border-color .14s ease; animation: rfn-agent-item-in .3s var(--agent-ease-out) both; }
[data-theme="dark"] .rfn-aws2-artrow { border-color: var(--rail-ink-200); }
.rfn-aws2-artrow:hover { border-color: var(--rail-brand); }
.rfn-aws2-artrow:focus-visible { outline: none; border-color: var(--rail-brand); box-shadow: 0 0 0 3px var(--rail-brand-50); }
.rfn-aws2-artrow-info { flex: 1; min-width: 0; }
.rfn-aws2-artrow-title { font-size: 12px; font-weight: 600; color: var(--rail-ink-900); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rfn-aws2-artrow-meta { font-size: 10.5px; color: var(--rail-ink-500); margin-top: 2px; }

.rfn-aws2-artdetail { display: flex; flex-direction: column; gap: 10px; animation: rfn-agent-item-in .28s var(--agent-ease-out) both; }
.rfn-aws2-artback { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; font-size: 11.5px; font-weight: 600; color: var(--rail-ink-600); background: var(--rail-ink-50); border: 1px solid var(--rail-ink-100); border-radius: 999px; padding: 4px 11px 4px 8px; cursor: pointer; transition: color .14s ease, border-color .14s ease; }
[data-theme="dark"] .rfn-aws2-artback { background: var(--rail-ink-100); border-color: var(--rail-ink-200); }
.rfn-aws2-artback:hover { color: var(--rail-brand-700); border-color: var(--rail-brand-100); }
[data-theme="dark"] .rfn-aws2-artback:hover { color: var(--brand-refined-blue); }
.rfn-aws2-artdetail-body { min-width: 0; }

/* 파일 산출물 프리뷰 — 크게·폭 맞춤(제품 FileArtifact 확대판 미러) */
.mk-file-preview { width: 100%; margin-bottom: 8px; border-radius: 8px; overflow: hidden; border: 1px solid var(--rail-ink-100); background: color-mix(in srgb, var(--rail-ink-50) 40%, transparent); }
[data-theme="dark"] .mk-file-preview { border-color: var(--rail-ink-200); }
.mk-file-preview svg { display: block; width: 100%; height: auto; }

/* 대화 카드 클릭 → 상세 진입 어포던스 */
.mk-inline-art[data-art-idx], .mk-filecard[data-art-idx] { cursor: pointer; }
.mk-filecard[data-art-idx]:hover { border-color: var(--rail-brand); }
.mk-inline-art[data-art-idx]:hover .rfn-widget { border-color: var(--rail-brand); }

/* ═══════ 인라인 계획 카드(계획 단위 뷰) — v2 PlanCard 미러: 진행 링 + 라이브 체크리스트 ═══════ */
.rfn-aws2-plan { max-width: 640px; border: 1px solid var(--rail-brand-100); border-radius: 13px; background: linear-gradient(180deg, var(--rail-brand-50), color-mix(in srgb, var(--rail-white) 40%, transparent) 70%); padding: 11px 14px; animation: rfn-agent-item-in .34s var(--agent-ease-out) both; }
[data-theme="dark"] .rfn-aws2-plan { border-color: var(--rail-ink-200); background: linear-gradient(180deg, var(--rail-ink-100), transparent 75%); }
.rfn-aws2-plan-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.rfn-aws2-plan-ring { width: 20px; height: 20px; transform: rotate(-90deg); flex: none; }
.rfn-aws2-plan-ring-bg { fill: none; stroke: var(--rail-ink-200); stroke-width: 2.5; }
.rfn-aws2-plan-ring-fg { fill: none; stroke: var(--rail-brand); stroke-width: 2.5; stroke-linecap: round; transition: stroke-dashoffset .6s var(--agent-ease-out), stroke .4s ease; }
.rfn-aws2-plan-title { font-size: 12.5px; font-weight: 700; color: var(--rail-ink-900); }
.rfn-aws2-plan-count { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--rail-ink-500); font-variant-numeric: tabular-nums; }
.rfn-aws2-plan-steps { display: flex; flex-direction: column; gap: 2px; }
.rfn-aws2-plan-step { display: flex; align-items: center; gap: 9px; font-size: 12.5px; padding: 3.5px 0; transition: color .25s ease; }
.rfn-aws2-plan-step-ic { display: flex; width: 16px; justify-content: center; color: var(--rail-ink-300); flex: none; }
.rfn-aws2-plan-step-title { color: var(--rail-ink-500); transition: color .25s ease; }
.rfn-aws2-plan-step.is-in_progress .rfn-aws2-plan-step-title { color: var(--rail-ink-900); font-weight: 600; }
.rfn-aws2-plan-step.is-completed .rfn-aws2-plan-step-title { color: var(--rail-ink-600); }
.rfn-aws2-plan-step.is-completed .rfn-aws2-plan-step-ic { color: var(--rail-good); }
.rfn-aws2-plan-step-ic .rfn-agent-spin { color: var(--rail-brand-700); }
[data-theme="dark"] .rfn-aws2-plan-step-ic .rfn-agent-spin { color: var(--brand-refined-blue); }
.rfn-aws2-plan.is-complete .rfn-aws2-plan-ring-fg { stroke: var(--rail-good); }
.rfn-aws2-plan.is-complete .rfn-aws2-plan-count { color: var(--rail-good); }

/* ═══════ 도구 그룹(단계 N개 실행) — v2 ToolGroupBlock 미러: 연속 도구를 접이식 그룹으로 ═══════ */
.rfn-aws2-tools { max-width: 640px; border: 1px solid var(--rail-ink-100); border-radius: 12px; background: color-mix(in srgb, var(--rail-white) 55%, transparent); padding: 7px 12px; animation: rfn-agent-item-in .3s var(--agent-ease-out) both; transition: border-color .2s ease; }
[data-theme="dark"] .rfn-aws2-tools { border-color: var(--rail-ink-200); }
.rfn-aws2-tools.is-live { border-color: var(--rail-brand-100); }
.rfn-aws2-tools-head { width: 100%; display: flex; align-items: center; gap: 8px; background: transparent; border: 0; cursor: pointer; padding: 0; text-align: left; }
.rfn-aws2-tools-ic { display: flex; color: var(--rail-good); flex: none; }
.rfn-aws2-tools.is-live .rfn-aws2-tools-ic { color: var(--rail-brand-700); }
[data-theme="dark"] .rfn-aws2-tools.is-live .rfn-aws2-tools-ic { color: var(--brand-refined-blue); }
.rfn-aws2-tools-label { font-family: "JetBrains Mono", "Pretendard", monospace; font-size: 12px; color: var(--rail-ink-800); }
.rfn-aws2-tools-count { margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--rail-ink-400); font-variant-numeric: tabular-nums; }
.rfn-aws2-tools-list { display: flex; flex-direction: column; gap: 2px; padding: 6px 0 3px; }
.rfn-aws2-tool { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; font-size: 11.5px; padding: 3px 0; animation: rfn-agent-item-in .24s var(--agent-ease-out) both; }
.rfn-aws2-tool-ic { display: flex; align-self: center; color: var(--rail-good); flex: none; }
.rfn-aws2-tool.is-running .rfn-aws2-tool-ic { color: var(--rail-brand-700); }
[data-theme="dark"] .rfn-aws2-tool.is-running .rfn-aws2-tool-ic { color: var(--brand-refined-blue); }
.rfn-aws2-tool-name { font-family: "JetBrains Mono", monospace; font-weight: 600; color: var(--rail-ink-800); flex: none; }
.rfn-aws2-tool-args { font-family: "JetBrains Mono", monospace; color: var(--rail-ink-500); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46%; }
.rfn-aws2-tool-sum { color: var(--rail-ink-600); flex-basis: 100%; padding-left: 19px; line-height: 1.5; }
.rfn-aws2-caret { transition: transform .18s var(--agent-ease-out); color: var(--rail-ink-400); flex: none; }
.rfn-aws2-caret.is-open { transform: rotate(90deg); }
.rfn-aws2-fold { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .32s var(--agent-ease-out); }
.rfn-aws2-fold.is-open { grid-template-rows: 1fr; }
.rfn-aws2-fold-clip { overflow: hidden; min-height: 0; }

/* 컴퓨터뷰 — 모노스페이스 로그 */
.rfn-agent-ws-computer {
  font-family: "JetBrains Mono", monospace; font-size: 11.5px; line-height: 1.7;
  color: var(--rail-ink-600); background: var(--rail-ink-50); border-radius: 10px;
  padding: 12px 13px; margin: 0; overflow-x: auto;
}
[data-theme="dark"] .rfn-agent-ws-computer { background: var(--rail-ink-100); }
.rfn-agent-ws-cline.is-cmd { color: var(--rail-ink-900); }
.rfn-agent-ws-cline.is-err { color: var(--rail-bad); }
/* 로그 블록(도구 호출→결과) 스태거 진입 — 활동이 순차로 기록됨 */
.rfn-agent-ws-computer > div { animation: rfn-agent-item-in .26s var(--agent-ease-out) both; }
.rfn-agent-ws-computer > div:nth-child(2) { animation-delay: .05s; }
.rfn-agent-ws-computer > div:nth-child(3) { animation-delay: .1s; }
.rfn-agent-ws-computer > div:nth-child(n+4) { animation-delay: .14s; }
/* 아티팩트/플랜/출처 탭 빈 상태 안내(실행 전) */
.rfn-agent-ws-side-empty {
  font-size: 12.5px; color: var(--rail-ink-500); line-height: 1.6;
  margin: 0; padding: 8px 4px; text-align: center;
}

/* 출처 — 데이터 계보. 행 스태거 진입 */
.rfn-agent-ws-sources { display: flex; flex-direction: column; gap: 8px; }
.rfn-agent-ws-source {
  display: flex; flex-direction: column; gap: 3px;
  padding: 9px 11px; border-radius: 10px; border: 1px solid var(--rail-ink-100);
  transition: border-color .14s ease, background .14s ease;
  animation: rfn-agent-item-in .3s var(--agent-ease-out) both;
}
.rfn-agent-ws-source:nth-child(2) { animation-delay: .05s; }
.rfn-agent-ws-source:nth-child(3) { animation-delay: .1s; }
.rfn-agent-ws-source:nth-child(n+4) { animation-delay: .14s; }
.rfn-agent-ws-source:hover { border-color: var(--rail-brand-100); background: var(--rail-brand-50); }
[data-theme="dark"] .rfn-agent-ws-source { border-color: var(--rail-ink-200); }
[data-theme="dark"] .rfn-agent-ws-source:hover { background: var(--rail-ink-100); }
.rfn-agent-ws-source-svc { font-size: 11px; font-weight: 600; color: var(--rail-brand-700); }
[data-theme="dark"] .rfn-agent-ws-source-svc { color: var(--brand-refined-blue); }
.rfn-agent-ws-source-q { font-family: "JetBrains Mono", monospace; font-size: 11.5px; color: var(--rail-ink-800); }
.rfn-agent-ws-source-scope { font-size: 11px; color: var(--rail-ink-500); }

/* 빈 상태 온보딩 */
.rfn-agent-ws-empty {
  max-width: 620px; margin: 0 auto; min-height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 40px 20px; gap: 8px;
}
.rfn-agent-ws-empty-orb {
  width: 64px; height: 64px; border-radius: 19px; margin-bottom: 12px;
  display: flex; align-items: center; justify-content: center; color: #FFFFFF;
  background: linear-gradient(135deg, var(--brand-refined-blue), var(--brand-onto-navy));
  box-shadow: 0 12px 30px rgba(118, 166, 215, .35), inset 0 1px 0 rgba(255, 255, 255, .25);
  /* 대기-생동(패널 FAB 오브 계승) — 에이전트가 살아 입력을 기다림 */
  animation: rfn-agent-ws-orb-breathe 4.2s ease-in-out infinite;
}
@keyframes rfn-agent-ws-orb-breathe {
  0%, 100% { transform: scale(1); box-shadow: 0 12px 30px rgba(118, 166, 215, .32), inset 0 1px 0 rgba(255, 255, 255, .25); }
  50% { transform: scale(1.045); box-shadow: 0 18px 44px rgba(118, 166, 215, .5), inset 0 1px 0 rgba(255, 255, 255, .25); }
}
.rfn-agent-ws-empty-title { font-family: "Roboto", "Pretendard", sans-serif; font-weight: 700; font-size: 20px; margin: 0; color: var(--rail-ink-900); }
.rfn-agent-ws-empty-sub { font-size: 13px; color: var(--rail-ink-500); margin: 0 0 8px; line-height: 1.55; max-width: 440px; }
.rfn-agent-ws-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 520px; margin-top: 12px; }
.rfn-agent-ws-card {
  display: flex; align-items: flex-start; gap: 11px; text-align: left;
  background: var(--rail-ink-50); border: 1px solid var(--rail-ink-200); border-radius: 13px;

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════
   Refinery AI 에이전트 인터랙티브 데모 플레이어 (2-시나리오)
   · energy — 온톨로지 관계(발주↔라인↔설비) × 운영패턴 × TOU 요금으로
     에너지/비용/탄소 최적 가동 스케줄 생성 + 승인 게이트 적용 (기본)
   · fleet  — 설비 건강 리포트 생성(C13/C28) + 거짓 전제 정정(C24)
   레일에서 두 세션을 클릭해 전환 재생. 데이터는 라이브 평가 실측
   ground truth 기반 목데이터(services/agent/docs/CODEACT_EVAL_SCENARIOS.md).
   ═══════════════════════════════════════════════════════════════ */

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const SPEED = 1; // 배속(<1 = 빠르게)

/* 시간 예산 페이싱 — 탭 스로틀링(백그라운드 1Hz)으로 타이머가 늦게 깨어나도
   전체 소요 시간을 지키도록, 일정보다 뒤처지면 대기 없이 몰아서 따라잡는다.
   (제품 AgentTimeline 의 document.hidden 즉시-전체-표시와 같은 정신) */
async function paced(count, stepMs, emit, token) {
  const start = performance.now();
  for (let i = 0; i < count; i++) {
    if (token !== runToken) return false;
    emit(i);
    const wait = start + (i + 1) * stepMs - performance.now();
    if (wait > 4) await sleep(wait);
  }
  return true;
}

/* ── ground truth 목데이터 ── */
const FLEET = [
  { id: "ACC-01", model: "Accura 3500",  status: "RUNNING", assignee: "김철수" },
  { id: "ACC-02", model: "Accura 3500",  status: "RUNNING", assignee: "김철수" },
  { id: "ACC-03", model: "Accura 3550",  status: "RUNNING", assignee: "이영희" },
  { id: "ACC-04", model: "Accura 3550",  status: "IDLE",    assignee: "이영희" },
  { id: "ACC-05", model: "Accura 2350",  status: "RUNNING", assignee: null },
  { id: "ACC-06", model: "Accura 2350",  status: "FAULT",   assignee: null },
  { id: "ACC-07", model: "Accura 2300S", status: "RUNNING", assignee: "박민준" },
  { id: "ACC-08", model: "Accura 2300S", status: "IDLE",    assignee: null },
  { id: "ACC-09", model: "Accura 3700",  status: "RUNNING", assignee: "박민준" },
];
const STATUS_KO = { RUNNING: "가동", IDLE: "대기", FAULT: "고장" };

/* 발주 ↔ 라인 ↔ 설비 (온톨로지 링크 순회 결과) */
const ORDERS = [
  { po: "PO-1038", due: "7/13(월)", line: "L1 사출", equip: "INJ-01 · INJ-02", qty: "12,000" },
  { po: "PO-1051", due: "7/15(수)", line: "L1 사출", equip: "INJ-01 · INJ-02", qty: "8,000" },
  { po: "PO-1042", due: "7/17(금)", line: "L2 프레스", equip: "PRS-01 · PRS-02", qty: "18,000" },
];
/* 주간 최적 가동 스케줄 그리드: '' 정지 · on 가동 · seq 순차 기동 · moved 심야 이동 · vac 이동 전 해제 */
const SCHED = {
  cols: ["심야 23–09 (경부하)", "오전 09–13", "피크 13–17 (최대부하)", "저녁 17–23"],
  rows: [
    { name: "INJ-01", cells: ["", "on", "seq", ""] },
    { name: "INJ-02", cells: ["", "seq", "on", ""] },
    { name: "PRS-01", cells: ["", "on", "on", "on"] },
    { name: "PRS-02", cells: ["moved", "on", "vac", ""] },
  ],
};
const CELL_LABEL = { on: "가동", seq: "순차 기동", moved: "심야 이동", vac: "이동 전" };

/* ── 상태 ── */
let timeline = [];
let seq = 0;
let currentTab = "plan";
let runToken = 0;             // 재생 세대 — replay/전환 시 이전 루프 중단
/* 빌드 시 치환 — 버전 1: energy 활성 / 버전 2: fleet 활성 (레일 순서는 동일) */
const DEFAULT_SCENARIO = "energy";
let currentScenario = DEFAULT_SCENARIO === "fleet" ? "fleet" : "energy";
const DEFAULT_KEY = currentScenario;
let activeStatus = "completed"; // 활성 세션의 레일 상태 (시작 전 idle)
let artViewMode = "grid";       // 아티팩트 탭 보기 모드 (격자 기본 / 목록)
let artDetailId = null;         // 아티팩트 상세 진입 인덱스 (null=컬렉션 / 숫자=상세)
let planCard = null;            // 인라인 계획 카드(계획 단위 뷰) 상태 { node, steps }
let toolGroup = null;           // 열린 도구 그룹(단계 N개 실행) 상태 { node, listEl, tools, ... }

const ws = $("ws"), feed = $("feed"), canvas = $("canvas"), gateSlot = $("gate-slot");
const sideWrap = $("side-wrap"), sideBody = $("side-body");
const composer = $("composer-input"), sendBtn = $("btn-send");
const topbarTitle = $("topbar-title");

/* ── 유틸 ── */
function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
/* 초미니 마크다운(bold·code·불릿) — 제품 AgentMarkdown 의 표현 부분집합 */
function mdInline(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`(.+?)`/g, "<code>$1</code>");
}
function mdBlocks(text) {
  const blocks = [];
  let list = null;
  for (const raw of text.split("\n")) {
    const line = raw.trim();
    if (!line) { list = null; continue; }
    if (line.startsWith("- ")) {
      if (!list) { list = { tag: "ul", items: [] }; blocks.push(list); }
      list.items.push(mdInline(line.slice(2)));
    } else {
      list = null;
      blocks.push({ tag: "p", html: mdInline(line) });
    }
  }
  return blocks;
}
function scrollFollow() { canvas.scrollTop = canvas.scrollHeight; }
function setAgentState(s) { ws.dataset.agentState = s; }
function setStreaming(on) { sendBtn.classList.toggle("is-stop", on); }

/* ── 세션 레일 — playable 세션은 클릭 시 시나리오 전환 ── */
const SESSIONS = [
  { key: "energy", title: "[에너지] 발주 이행 · 에너지/탄소 최적 가동 스케줄", when: "오늘", playable: true },
  { key: "fleet",  title: "[제조] 설비 상태 분석 · 리포트 생성", when: "오늘", playable: true },
  { title: "[행정] 민원 처리기한 초과 부서별 분석 · 월간 보고서", when: "2시간 전", status: "completed" },
  { title: "[물류] 콜드체인 온도 이탈 구간 탐지 · PDF 리포트", when: "5시간 전", status: "completed" },
  { title: "[총무] 미반납 자산 회수 요청 · 실사 엑셀 생성", when: "2일 전", status: "completed" },
  { title: "[환경] 측정소 데이터 품질 진단 · 결측 구간 점검", when: "지난주", status: "completed" },
];
function renderSessions() {
  $("sessions").innerHTML = SESSIONS.map((s, i) => {
    const active = s.key === currentScenario;
    const status = s.playable ? (active ? activeStatus : "completed") : s.status;
    return `
    <li>
      <button type="button" class="rfn-agent-ws-session${active ? " is-active" : ""}" data-idx="${i}">
        <i class="ph-fill ph-chat-circle-text rfn-agent-ws-session-ic" style="font-size:15px"></i>
        <span class="rfn-agent-ws-session-main">
          <span class="rfn-agent-ws-session-title">${esc(s.title)}</span>
          <span class="rfn-agent-ws-session-meta">
            <span>${active ? "지금" : s.when}</span>
            <span class="rfn-agent-ws-session-dot is-${status}"></span>
          </span>
        </span>
      </button>
    </li>`;
  }).join("");
  $("sessions").querySelectorAll("[data-idx]").forEach((b) =>
    b.addEventListener("click", () => {
      const s = SESSIONS[Number(b.dataset.idx)];
      if (s.playable && s.key !== currentScenario) switchScenario(s.key);
    }));
}
function setActiveStatus(st) { activeStatus = st; renderSessions(); }
$("rail-toggle").addEventListener("click", () => $("rail").classList.toggle("is-collapsed"));
$("rail-new").addEventListener("click", () => newSession());

/* ── 드로어 ── */
let sideOpen = false, sideWidth = 400;
function setSide(open) {
  sideOpen = open;
  sideWrap.style.width = open ? sideWidth + "px" : "0";
  sideWrap.dataset.open = String(open);
  sideWrap.setAttribute("aria-hidden", String(!open));
  $("side-toggle").classList.toggle("on", open);
  updateBadge();
}
$("side-toggle").addEventListener("click", () => setSide(!sideOpen));
$("side-close").addEventListener("click", () => setSide(false));
function updateBadge() {
  const has = timeline.some((e) => e.kind === "artifact");
  $("artifact-badge").hidden = !(has && !sideOpen);
}
$("side-resize").addEventListener("pointerdown", (e) => {
  e.preventDefault();
  sideWrap.classList.add("is-resizing");
  const startX = e.clientX, startW = sideWidth;
  const onMove = (ev) => {
    sideWidth = Math.max(320, Math.min(760, startW + (startX - ev.clientX)));
    if (sideOpen) sideWrap.style.width = sideWidth + "px";
  };
  const onUp = () => {
    sideWrap.classList.remove("is-resizing");
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
  };
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
});
document.querySelectorAll(".rfn-agent-ws-tab").forEach((b) =>
  b.addEventListener("click", () => selectTab(b.dataset.tab)));
function selectTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".rfn-agent-ws-tab").forEach((b) =>
    b.classList.toggle("is-active", b.dataset.tab === tab));
  renderSide();
}

/* ── 테마 ── */
$("btn-theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme !== "light";
  root.dataset.theme = dark ? "light" : "dark";
  $("btn-theme").firstElementChild.className = dark ? "ph-bold ph-moon" : "ph-bold ph-sun";
});
$("btn-replay").addEventListener("click", () => replay());

/* ═══════ 타임라인 렌더 (AgentTimeline.tsx 미러) ═══════ */

function addUser(text) {
  closeToolGroup();
  /* 첫 발화 전송 시점에 온보딩 → 스레드 전환 (원본 UI 의 started 판정과 동일) */
  if (!$("onboard").hidden) {
    $("onboard").hidden = true;
    $("thread").hidden = false;
  }
  timeline.push({ kind: "user", text });
  feed.appendChild(el(`
    <div class="rfn-agent-row rfn-agent-row--user">
      <div class="rfn-agent-bubble rfn-agent-bubble--user">${esc(text)}</div>
    </div>`));
  if (!topbarTitle.textContent) topbarTitle.textContent = text;
  scrollFollow();
}

/* 어절 리빌(P1/P2) — .rfn-agent-word blur-fade 는 제품 CSS 그대로 */
async function addAgentText(text, token) {
  if (token !== runToken) return;
  closeToolGroup();
  timeline.push({ kind: "text", text });
  const bubble = el(`<div class="rfn-agent-row">
    <div class="rfn-agent-bubble rfn-agent-bubble--agent is-live"><div class="rfn-agent-md"></div></div>
  </div>`);
  feed.appendChild(bubble);
  const md = bubble.querySelector(".rfn-agent-md");
  for (const b of mdBlocks(text)) {
    if (token !== runToken) return;
    if (b.tag === "p") {
      const p = document.createElement("p");
      md.appendChild(p);
      const words = b.html.split(/(?<=\s)/);
      const ok = await paced(words.length, 42 * SPEED, (i) => {
        p.insertAdjacentHTML("beforeend", `<span class="rfn-agent-word">${words[i]}</span>`);
        scrollFollow();
      }, token);
      if (!ok) return;
    } else {
      const ul = document.createElement("ul");
      md.appendChild(ul);
      const ok = await paced(b.items.length, 150 * SPEED, (i) => {
        ul.insertAdjacentHTML("beforeend", `<li class="rfn-agent-word">${b.items[i]}</li>`);
        scrollFollow();
      }, token);
      if (!ok) return;
    }
  }
  bubble.querySelector(".rfn-agent-bubble").classList.remove("is-live");
}

/* 사고 과정(P9) — live 펼침 → 종료 시 접힘 + "N초 사고" */
async function addThinking(text, seconds, token) {
  if (token !== runToken) return;
  closeToolGroup();
  timeline.push({ kind: "thinking", text });
  const node = el(`
    <div class="rfn-agent-think is-live">
      <button type="button" class="rfn-agent-think-head">
        <i class="ph-bold ph-brain" style="font-size:14px"></i>
        <span class="rfn-agent-shimmer-text">생각하는 중</span>
        <i class="ph-bold ph-caret-right rfn-agent-think-caret is-open" style="font-size:12px"></i>
      </button>
      <div class="rfn-agent-think-fold is-open"><div class="rfn-agent-think-clip">
        <div class="rfn-agent-think-body is-ticker"></div>
      </div></div>
    </div>`);
  feed.appendChild(node);
  const body = node.querySelector(".rfn-agent-think-body");
  const head = node.querySelector(".rfn-agent-think-head span");
  const caret = node.querySelector(".rfn-agent-think-caret");
  const fold = node.querySelector(".rfn-agent-think-fold");
  const step = Math.max(30, (seconds * 1000) / text.length) * SPEED;
  const ok = await paced(text.length, step, (i) => {
    body.textContent += text[i];
    body.scrollTop = body.scrollHeight;
  }, token);
  if (!ok) return;
  node.classList.remove("is-live");
  body.classList.remove("is-ticker");
  fold.classList.remove("is-open");
  caret.classList.remove("is-open");
  head.className = "";
  head.textContent = `${seconds}초 사고`;
  node.querySelector(".rfn-agent-think-head").addEventListener("click", () => {
    fold.classList.toggle("is-open");
    caret.classList.toggle("is-open");
  });
  scrollFollow();
}

/* 도구 카드(P7/P13) — running → ok, 클릭 시 args/결과 펼침 */
/* ── 도구 그룹(단계 N개 실행) — v2 ToolGroupBlock 미러: 연속 도구를 하나의 접이식 그룹으로 묶음 ── */
function toolIcHtml(phase, size) {
  return phase === "running"
    ? '<i class="ph-bold ph-circle-notch rfn-agent-spin" style="font-size:' + size + 'px"></i>'
    : '<i class="ph-fill ph-check-circle" style="font-size:' + size + 'px"></i>';
}
function ensureToolGroup() {
  if (toolGroup) return toolGroup;
  const node = el(
    '<div class="rfn-agent-row"><div class="rfn-aws2-tools is-live">'
    + '<button type="button" class="rfn-aws2-tools-head">'
    +   '<span class="rfn-aws2-tools-ic">' + toolIcHtml("running", 13) + '</span>'
    +   '<span class="rfn-aws2-tools-label rfn-agent-shimmer-text">실행 중</span>'
    +   '<span class="rfn-aws2-tools-count">0/0</span>'
    +   '<i class="ph-bold ph-caret-right rfn-aws2-caret is-open" style="font-size:11px"></i>'
    + '</button>'
    + '<div class="rfn-aws2-fold is-open"><div class="rfn-aws2-fold-clip"><div class="rfn-aws2-tools-list"></div></div></div>'
    + '</div></div>');
  const foldEl = node.querySelector(".rfn-aws2-fold");
  const caretEl = node.querySelector(".rfn-aws2-caret");
  const headEl = node.querySelector(".rfn-aws2-tools-head");
  headEl.addEventListener("click", () => {   // 완료 후 헤더 클릭으로 펼침/접기(클로저 캡처 — 그룹 종료 후에도 동작)
    const open = !foldEl.classList.contains("is-open");
    foldEl.classList.toggle("is-open", open);
    caretEl.classList.toggle("is-open", open);
  });
  toolGroup = { node: node.querySelector(".rfn-aws2-tools"), headEl, listEl: node.querySelector(".rfn-aws2-tools-list"), foldEl, caretEl, tools: [] };
  feed.appendChild(node);
  return toolGroup;
}
function paintToolGroupHead(closed) {
  const tg = toolGroup;
  if (!tg) return;
  const running = tg.tools.find((t) => t.phase === "running");
  const done = tg.tools.filter((t) => t.phase !== "running").length;
  tg.node.classList.toggle("is-live", !closed && !!running);
  tg.headEl.querySelector(".rfn-aws2-tools-ic").innerHTML = toolIcHtml((!closed && running) ? "running" : "ok", 13);
  const lab = tg.headEl.querySelector(".rfn-aws2-tools-label");
  lab.textContent = (!closed && running) ? running.name : ("단계 " + tg.tools.length + "개 실행");
  lab.classList.toggle("rfn-agent-shimmer-text", !closed && !!running);
  tg.headEl.querySelector(".rfn-aws2-tools-count").textContent = done + "/" + tg.tools.length;
}
/* 비-도구 피드 항목이 들어오면 열린 그룹을 확정(라벨→"단계 N개 실행")하고 접는다 */
function closeToolGroup() {
  if (!toolGroup) return;
  paintToolGroupHead(true);
  toolGroup.foldEl.classList.remove("is-open");
  toolGroup.caretEl.classList.remove("is-open");
  toolGroup = null;
}
async function addTool(name, args, ms, content, token, opts = {}) {
  if (token !== runToken) return;
  const evt = { kind: "tool", id: "t" + seq++, name, args, phase: "running", content: "", gated: !!opts.gated };
  timeline.push(evt);
  const tg = ensureToolGroup();
  const row = el(
    '<div class="rfn-aws2-tool is-running">'
    + '<span class="rfn-aws2-tool-ic">' + toolIcHtml("running", 12) + '</span>'
    + '<span class="rfn-aws2-tool-name">' + esc(name) + '</span>'
    + '<span class="rfn-aws2-tool-args">' + esc(compactArgs(args)) + '</span>'
    + '</div>');
  const t = { name, phase: "running", rowEl: row };
  tg.tools.push(t);
  tg.listEl.appendChild(row);
  paintToolGroupHead(false);
  renderSide();
  scrollFollow();
  await sleep(ms * SPEED);
  if (token !== runToken) return;
  evt.phase = "ok";
  evt.content = content;
  t.phase = "ok";
  row.className = "rfn-aws2-tool is-ok";
  row.querySelector(".rfn-aws2-tool-ic").innerHTML = toolIcHtml("ok", 12);
  if (content) row.appendChild(el('<span class="rfn-aws2-tool-sum">' + esc(content) + '</span>'));
  paintToolGroupHead(false);
  renderSide();
  scrollFollow();
}

/* 승인 이벤트 마커(타임라인) — 대기 → 승인/거부 칩 */
function addApprovalEvent(name) {
  closeToolGroup();
  const evt = { kind: "approval", id: "a" + seq++, name, resolved: false, allowed: null };
  timeline.push(evt);
  const node = el(`
    <div class="rfn-agent-event">
      <i class="ph-bold ph-shield-check rfn-agent-event-ic" style="font-size:15px"></i>
      <span class="rfn-agent-event-name">${esc(name)}</span>
      <span class="rfn-agent-chip rfn-agent-chip--wait">승인 대기</span>
    </div>`);
  feed.appendChild(node);
  renderSide();
  scrollFollow();
  return {
    resolve(allowed) {
      evt.resolved = true;
      evt.allowed = allowed;
      const chip = node.querySelector(".rfn-agent-chip");
      chip.className = "rfn-agent-chip " + (allowed ? "rfn-agent-chip--ok" : "rfn-agent-chip--bad");
      chip.textContent = allowed ? "승인됨" : "거부됨";
      renderSide();
    },
  };
}

/* HITL Hard 게이트 카드 — 사용자가 직접 승인/거부 (AgentWorkspace HardApprovalCard) */
function showHardCard(approval, rows) {
  closeToolGroup();
  return new Promise((resolve) => {
    const grid = rows.map(([k, v], i) =>
      `<div><span class="rfn-agent-ws-hardcard-k">${esc(k)}</span>${i === 0 ? `<b>${esc(v)}</b>` : esc(v)}</div>`
    ).join("");
    const card = el(`
      <div class="rfn-agent-ws-hardcard" role="group" aria-label="쓰기 승인">
        <div class="rfn-agent-ws-hardcard-head">
          <i class="ph-bold ph-shield-warning" style="font-size:16px"></i>
          <span>쓰기 액션 승인 필요</span>
          <span class="rfn-agent-ws-hardcard-tier">Hard</span>
        </div>
        <div class="rfn-agent-ws-hardcard-grid">${grid}</div>
        <div class="rfn-agent-ws-hardcard-actions">
          <button type="button" class="rfn-agent-btn rfn-agent-btn--ghost" data-deny>
            <i class="ph-bold ph-arrow-u-up-left" style="font-size:14px"></i> 거부
          </button>
          <button type="button" class="rfn-agent-btn rfn-agent-btn--primary" data-allow>
            <i class="ph-bold ph-list-checks" style="font-size:14px"></i> 승인
          </button>
        </div>
      </div>`);
    gateSlot.appendChild(card);
    scrollFollow();
    const done = (allowed) => {
      card.remove();
      approval.resolve(allowed);
      resolve(allowed);
    };
    card.querySelector("[data-allow]").addEventListener("click", () => done(true));
    card.querySelector("[data-deny]").addEventListener("click", () => done(false));

    /* 히어로 임베드(iframe, pointer-events:none)에서는 방문자가 버튼을 누를 수 없으므로
       카드를 잠시 보여준 뒤 가짜 커서가 승인 버튼을 실제로 누르는 모습을 보여주고
       나머지 시나리오를 이어서 재생한다. */
    if (window.self !== window.top) {
      setTimeout(() => {
        if (!card.isConnected) return;
        var allowBtn = card.querySelector('[data-allow]');
        var rect = allowBtn.getBoundingClientRect();
        var cursor = document.createElement('div');
        cursor.className = 'rfn-fake-cursor';
        cursor.innerHTML = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 2l14 6.5-5.6 1.9L10.5 16 4 2z" fill="#111111" stroke="#ffffff" stroke-width="1" stroke-linejoin="round"/></svg><span class="rfn-fake-cursor-ring"></span>';
        document.body.appendChild(cursor);
        var tipX = 4, tipY = 2; /* 커서 SVG 내 뾰족한 끝(핫스팟) 좌표 */
        var targetX = rect.left + rect.width / 2;
        var targetY = rect.top + rect.height / 2;
        var startX = targetX - 90;
        var startY = targetY + 60;
        cursor.style.transition = 'none';
        cursor.style.left = (startX - tipX) + 'px';
        cursor.style.top = (startY - tipY) + 'px';
        cursor.style.opacity = '0';
        void cursor.offsetWidth;
        cursor.style.transition = 'opacity .3s ease';
        cursor.style.opacity = '1';
        setTimeout(function() {
          cursor.style.transition = 'left .65s cubic-bezier(.4,0,.2,1), top .65s cubic-bezier(.4,0,.2,1)';
          cursor.style.left = (targetX - tipX) + 'px';
          cursor.style.top = (targetY - tipY) + 'px';
        }, 350);
        setTimeout(function() {
          allowBtn.classList.add('rfn-fake-press');
          cursor.classList.add('rfn-fake-cursor-click');
        }, 1050);
        setTimeout(function() {
          cursor.style.transition = 'opacity .25s ease';
          cursor.style.opacity = '0';
          cursor.classList.remove('rfn-fake-cursor-click');
          setTimeout(function() {
            cursor.remove();
            if (card.isConnected) done(true);
          }, 250);
        }, 1400);
      }, 1600);
    }
  });
}

/* 표·스케줄 아티팩트 — 대화창 인라인 카드 + 아티팩트 탭 동시 반영 */

/* ═══════ 우측 패널 뷰(ArtifactPanel.tsx 파생 로직 미러) ═══════ */

function compactArgs(args) {
  return Object.entries(args)
    .map(([k, v]) => {
      const val = typeof v === "object" ? JSON.stringify(v) : String(v);
      return `${k}=${val.length > 30 ? val.slice(0, 30) + "…" : val}`;
    }).join(", ");
}

function renderSide() {
  if (currentTab === "plan") renderPlan();
  else if (currentTab === "artifact") renderArtifacts();
  else if (currentTab === "computer") renderComputer();
  else renderSources();
}

function renderPlan() {
  const steps = [];
  for (const e of timeline) {
    if (e.kind === "tool") {
      steps.push({
        title: e.name,
        state: e.phase === "running" ? "active" : "done",
        conf: e.phase === "running" ? "review" : e.gated ? "human" : "auto",
        detail: compactArgs(e.args),
      });
    } else if (e.kind === "approval") {
      steps.push({
        title: e.name,
        state: e.resolved ? "done" : "active",
        conf: "human",
        detail: e.resolved ? (e.allowed ? "승인됨" : "거부됨") : "쓰기 — 승인 필요",
      });
    }
  }
  if (!steps.length) {
    sideBody.innerHTML = '<p class="rfn-agent-ws-side-empty">실행된 단계가 여기에 나타납니다. 대화를 시작하면 에이전트의 도구 실행이 순서대로 기록됩니다.</p>';
    return;
  }
  const CONF = { auto: "자동 진행", review: "진행 중", human: "사람 판단" };
  sideBody.innerHTML = '<div class="rfn-agent-ws-plan">' + steps.map((s, i) => `
    <div class="rfn-agent-ws-step is-${s.state}">
      <span class="rfn-agent-ws-step-rail">
        <span class="rfn-agent-ws-step-ic">${
          s.state === "done"
            ? '<i class="ph-fill ph-check-circle" style="font-size:16px"></i>'
            : '<i class="ph-bold ph-circle-notch rfn-agent-spin" style="font-size:15px"></i>'
        }</span>
        ${i < steps.length - 1 ? '<span class="rfn-agent-ws-step-line"></span>' : ""}
      </span>
      <div class="rfn-agent-ws-step-body">
        <div class="rfn-agent-ws-step-title">${esc(s.title)}
          <span class="rfn-agent-ws-conf is-${s.conf}">${CONF[s.conf]}</span>
        </div>
        ${s.state !== "done" && s.detail ? `<div class="rfn-agent-ws-step-detail">${esc(s.detail)}</div>` : ""}
      </div>
    </div>`).join("") + "</div>";
}

/* fleet 시나리오의 상태 분포 차트 — lens PercentileBandCard 문법(legend → 밴드 → 눈금 foot) */
function distChartHtml() {
  const counts = FLEET.reduce((m, r) => ((m[r.status] = (m[r.status] || 0) + 1), m), {});
  const total = FLEET.length;
  const SERIES = [
    ["RUNNING", "가동", "var(--rail-good)"],
    ["IDLE", "대기", "var(--rail-warn)"],
    ["FAULT", "고장", "var(--rail-bad)"],
  ];
  const pct = (n) => ((n / total) * 100).toFixed(1);
  const legend = SERIES.map(([, label, color]) =>
    `<span><i style="background:${color}"></i>${label}</span>`).join("");
  const segs = SERIES.map(([key, , color]) => {
    const n = counts[key] || 0;
    return n ? `<div class="mk-dist-seg" style="width:${pct(n)}%;background:${color}" title="${pct(n)}%">${n}</div>` : "";
  }).join("");
  const foot = SERIES.map(([key, label]) => {
    const n = counts[key] || 0;
    return `<div><div class="k">${label}</div><div class="v"><b>${n}</b> · ${pct(n)}%</div></div>`;
  }).join("") + `<div><div class="k">n</div><div class="v"><b>${total}</b> instances</div></div>`;
  return `<div class="mk-dist">
    <div class="mk-dist-legend">${legend}</div>
    <div class="mk-dist-band">${segs}</div>
    <div class="mk-dist-foot">${foot}</div>
  </div>`;
}

function widgetShell(title, sub, bodyHtml) {
  return `
    <div class="rfn-widget">
      <div class="rfn-widget-head">
        <span class="rfn-widget-title">${esc(title)}</span>
        <span class="rfn-widget-sub">${esc(sub)}</span>
        <div class="rfn-widget-actions">
          <button type="button" class="rfn-icon-btn rfn-icon-btn--sm" title="스펙 복사"><i class="ph-bold ph-copy" style="font-size:15px"></i></button>
          <button type="button" class="rfn-icon-btn rfn-icon-btn--sm" title="다운로드"><i class="ph-bold ph-download-simple" style="font-size:15px"></i></button>
        </div>
      </div>
      <div class="rfn-widget-body rfn-widget-body--no-pad">${bodyHtml}</div>
    </div>`;
}

      </div>

  if (a.artifactType === "object_table") {
    const rows = FLEET.map((r) => `
      <tr><td class="t-id">${r.id}</td><td>${esc(r.model)}</td>
        <td><span class="mk-status is-${r.status.toLowerCase()}">${STATUS_KO[r.status]}</span></td>
        <td>${r.assignee ? esc(r.assignee) : '<span class="mk-unassigned">미지정</span>'}</td></tr>`).join("");
    return widgetShell("Accura 설비 현황 (9)", "object_table", `
      <div style="overflow-x:auto">
      <table class="rfn-table">
        <thead><tr><th>설비</th><th>모델</th><th>상태</th><th>담당자</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`);
  }
  if (a.artifactType === "chart") {
    return widgetShell("설비 상태 분포", "chart · distribution", distChartHtml());
  }
  /* file — 프리뷰(이미지/PDF, 크게·폭 맞춤) + 파일 행 */
  const previews = a.files.map(filePreviewHtml).join("");
  const rowsHtml = a.files.map((f, i) => `
    <button type="button" class="mk-file-row" data-af="${esc(a.title)}|${i}">
      <span class="mk-file-ic"><i class="ph-bold ${FILE_ICON[f.type]}" style="font-size:15px"></i></span>
      <span class="mk-file-name">${esc(f.name)}</span>
      <span class="mk-file-meta">${f.size}</span>
      <span class="mk-file-dl"><i class="ph-bold ph-download-simple" style="font-size:14px"></i></span>
    </button>`).join("");
  return widgetShell(a.title, "file · run_code", `<div style="padding:8px 10px 10px">${previews}${rowsHtml}</div>`);
}

/* ── 인라인 계획 카드(계획 단위 뷰) — v2 PlanCard 미러: 진행 링 + 라이브 체크리스트(update_plan) ── */
function addPlanCard(titles) {
  closeToolGroup();
  const steps = titles.map((t) => ({ title: t, status: "pending" }));
  if (steps.length) steps[0].status = "in_progress";
  const node = el('<div class="rfn-agent-row"><div class="rfn-aws2-plan"></div></div>');
  planCard = { node: node.querySelector(".rfn-aws2-plan"), steps };
  feed.appendChild(node);
  renderPlanCard();
  scrollFollow();
}
function renderPlanCard() {
  if (!planCard) return;
  const steps = planCard.steps;
  const done = steps.filter((s) => s.status === "completed").length;
  const complete = done === steps.length && steps.length > 0;
  const R = 8, C = 2 * Math.PI * R, pct = steps.length ? done / steps.length : 0;
  planCard.node.className = "rfn-aws2-plan" + (complete ? " is-complete" : "");
  planCard.node.innerHTML =
    '<div class="rfn-aws2-plan-head">'
    + '<svg viewBox="0 0 22 22" class="rfn-aws2-plan-ring" aria-hidden="true">'
    +   '<circle cx="11" cy="11" r="' + R + '" class="rfn-aws2-plan-ring-bg"></circle>'
    +   '<circle cx="11" cy="11" r="' + R + '" class="rfn-aws2-plan-ring-fg" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + (C * (1 - pct)).toFixed(2) + '"></circle>'
    + '</svg>'
    + '<span class="rfn-aws2-plan-title">플랜</span>'
    + '<span class="rfn-aws2-plan-count">' + done + '/' + steps.length + '</span>'
    + '</div>'
    + '<div class="rfn-aws2-plan-steps">'
    + steps.map((s) => {
        const ic = s.status === "completed"
          ? '<i class="ph-fill ph-check-circle" style="font-size:15px"></i>'
          : s.status === "in_progress"
            ? '<i class="ph-bold ph-circle-notch rfn-agent-spin" style="font-size:14px"></i>'
            : '<i class="ph-bold ph-circle" style="font-size:13px"></i>';
        return '<div class="rfn-aws2-plan-step is-' + s.status + '">'
          + '<span class="rfn-aws2-plan-step-ic">' + ic + '</span>'
          + '<span class="rfn-aws2-plan-step-title">' + esc(s.title) + '</span></div>';
      }).join("")
    + '</div>';
}
/* steps 0..i-1 완료, i 진행 중 — 시나리오 진행에 맞춰 라이브 갱신 */
function planAdvance(i) {
  if (!planCard) return;
  planCard.steps.forEach((s, k) => { s.status = k < i ? "completed" : (k === i ? "in_progress" : "pending"); });
  renderPlanCard();
}
function planComplete() {
  if (!planCard) return;
  planCard.steps.forEach((s) => { s.status = "completed"; });
  renderPlanCard();
}

/* 아티팩트 타입 라벨 (제품 TYPE_LABEL 미러 + demo 전용 타입 포함) */
const ART_TYPE_LABEL = { po_table: "발주 표", schedule: "스케줄", object_table: "객체 표", chart: "차트", file: "파일" };

function artHasImage(a) {
  return a.artifactType === "file" && Array.isArray(a.files)
    && a.files.some((f) => f.type === "png" || /\.(png|jpg|jpeg|gif|webp|svg)$/i.test(f.name || ""));
}

/* 설비 상태 분포 차트 SVG — 차트 아티팩트 & 이미지 파일 프리뷰 공용(파일 바이트 없는 데모의 목업). */
function statusChartSvg(big) {
  const counts = FLEET.reduce((m, r) => ((m[r.status] = (m[r.status] || 0) + 1), m), {});
  const total = FLEET.length || 1;
  const SER = [["RUNNING", "#3FB255"], ["IDLE", "#F0A93A"], ["FAULT", "#E5484D"]];
  if (big) {
    const bw = 84, gap = 40, x0 = 44, base = 176, H = 132;
    const max = Math.max(1, ...SER.map(([k]) => counts[k] || 0));
    const bars = SER.map(([k, c], i) => {
      const n = counts[k] || 0, bh = Math.round((n / max) * H), x = x0 + i * (bw + gap);
      return `<rect x="${x}" y="${base - bh}" width="${bw}" height="${bh}" rx="4" fill="${c}"/>`
        + `<text x="${x + bw / 2}" y="${base - bh - 8}" text-anchor="middle" font-size="15" font-weight="700" style="fill:var(--rail-ink-800)">${n}</text>`
        + `<text x="${x + bw / 2}" y="${base + 21}" text-anchor="middle" font-size="12" style="fill:var(--rail-ink-500)">${STATUS_KO[k]}</text>`;
    }).join("");
    return `<svg viewBox="0 0 400 210" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">`
      + `<text x="28" y="24" font-size="13" font-weight="700" style="fill:var(--rail-ink-700)">설비 상태 분포</text>`
      + `<line x1="28" y1="176" x2="384" y2="176" style="stroke:var(--chart-grid)" stroke-width="1"/>${bars}</svg>`;
  }
  let x = 5; const W = 90;
  const segs = SER.map(([k, c]) => {
    const n = counts[k] || 0, w = (n / total) * W;
    const r = w ? `<rect x="${x.toFixed(1)}" y="15" width="${w.toFixed(1)}" height="13" rx="2" fill="${c}"/>` : "";
    x += w; return r;
  }).join("");
  return `<svg viewBox="0 0 100 44" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%">`
    + `${segs}<text x="5" y="39" font-size="7" style="fill:var(--rail-ink-400)">status · n=${total}</text></svg>`;
}

}

/* 아티팩트 썸네일 — 차트=미니차트, 이미지 파일=차트 목업, 그 외=타입 아이콘. */
function artThumbHtml(a) {
  if (a.artifactType === "chart" || artHasImage(a))
    return `<div class="rfn-aws2-artthumb-mini">${statusChartSvg(false)}</div>`;
  const ic = a.artifactType === "file"
    ? (a.files && a.files.some((f) => f.type === "pdf") ? "ph-file-pdf" : "ph-file")
    : (a.artifactType === "schedule" ? "ph-calendar-blank" : "ph-table");
  return `<div class="rfn-aws2-artthumb-ic"><i class="ph-bold ${ic}" style="font-size:26px"></i></div>`;
}

/* 대화 카드/썸네일 클릭 → 아티팩트 탭 상세 직접 진입(같은 카드 재클릭도 재진입 = 제품 nonce 등가). */
function openArtifactDetail(idx) {

    sideBody.innerHTML = '<p class="rfn-agent-ws-side-empty">에이전트가 생성한 산출물(표·차트·파일)이 여기에 표시됩니다.</p>';

    +   '</div></div>'

function renderComputer() {

/* 다운로드 — 데모에서는 실제 파일을 내려주지 않는다(외형만 유지, 클릭 무동작). */

/* ═══════ 컴포저 시뮬레이션 ═══════ */
async function typeAndSend(text, token) {
  composer.placeholder = "";
  const ok = await paced(text.length, 30 * SPEED, (i) => { composer.value += text[i]; }, token);
  if (!ok) return;
  await sleep(320 * SPEED);
  if (token !== runToken) return;
  composer.value = "";
  addUser(text);
}

/* ═══════ 시나리오 1 (기본) — 에너지/탄소 최적 가동 스케줄 ═══════
   온톨로지 이점(발주↔라인↔설비 링크 순회) × 운영패턴(시계열) × TOU 요금
   → 사람이 못 보는 조합 발견 → 듀얼 산출물 → 승인 게이트로 스케줄 적용 */
async function playEnergy(token) {
  setAgentState("running"); setStreaming(true); setActiveStatus("running");
  await typeAndSend("다음 주 발주 물량을 납기 내 처리하면서 에너지 비용과 탄소 배출을 최소화하는 가동 스케줄을 만들어줘", token);
  if (token !== runToken) return;

  await sleep(500 * SPEED);
  await addThinking(
    "발주→라인→설비 링크를 순회해 발주별 설비 가동량을 구한다. 요금제(TOU) 단가와 설비별 " +

    "제약으로 건다. 마지막에 절감치를 원화·TOE·tCO2로 환산해 근거와 함께 제시한다.", 4, token);
  if (token !== runToken) return;

  addPlanCard([
    "발주–라인–설비 관계 순회",

    "스케줄·산출물 생성",

  await addAgentText("온톨로지에서 발주·라인·설비 관계부터 순회하겠습니다. 이 관계가 이미 링크로 모델링되어 있어 ERP·미터 데이터를 따로 대사(reconcile)하지 않고 바로 묶을 수 있습니다.", token);

  if (token !== runToken) return;
  await addTool("get_link_types", { objectType: "PurchaseOrder" }, 700,
    "orders-line(1:1) · line-equipment(1:N) · equipment-meter(1:1) — 링크 타입 확인", token);
  if (token !== runToken) return;
  await addTool("query_objectset", { objectType: "PurchaseOrder", filter: "dueDate ≤ 07-17" }, 1000,
    "3건 — PO-1038(7/13 · 12,000개) · PO-1051(7/15 · 8,000개) · PO-1042(7/17 · 18,000개, 여유 3일)", token);
  if (token !== runToken) return;
  await addTool("query_objectset_linked", { from: "PurchaseOrder", searchAround: "line → equipment" }, 1300,
    "L1 사출: INJ-01·INJ-02 / L2 프레스: PRS-01·PRS-02 (+CMP-01·HVAC-01 공용)", token);
  if (token !== runToken) return;
  addArtifact("po_table", "발주–설비 관계");
  planAdvance(1);

  await addTool("query_objectset", { objectType: "TariffPlan", filter: "contract='산업용(을) 고압A'" }, 800,
    "TOU 3구간 — 경부하(23~09시) ₩64 · 중간 ₩112 · 최대부하(13~17시) ₩192 /kWh", token);
  if (token !== runToken) return;
  await addTool("query_timeseries", { property: "active_power", range: "14d", agg: "15m" }, 1300,
    "6개 설비 프로파일 — INJ-01·02 동시 기동 피크 96kW · PRS 부하율 71% · 심야 유휴 여력 41MWh/주", token);
  if (token !== runToken) return;
  planAdvance(2);
  await addTool("execute_code", { note: "TOU 단가 × 납기 × 공용설비 제약 조합 탐색 (call_tool 팬아웃)" }, 2800,
    "PO-1042 프레스 물량 38%(6.8MWh/주) 심야 재배치 — 상한 근거: 납기 마진·CMP-01 동시부하 · INJ 순차 기동 → 피크 320→245kW", token);

  await addAgentText(
    "개별 시스템(ERP·미터)에서는 보이지 않던 조합을 찾았습니다.\n" +

  if (token !== runToken) return;

  await addTool("run_code", { files: ["weekly_schedule.csv", "energy_briefing.pdf"] }, 2200,
    "generated 2 files — 시간표·절감치 단일 데이터 파생(수치 정합)", token);
  if (token !== runToken) return;
  addArtifact("schedule", "주간 최적 가동 스케줄");
  addFileArtifact("에너지/탄소 최적화 산출물", [
    { name: "weekly_schedule.csv", size: "2.1 KB", type: "csv" },
    { name: "energy_briefing.pdf", size: "26.3 KB", type: "pdf" },
  ]);
  planComplete();

  await addAgentText("스케줄 초안이 준비됐습니다. 시간표에서 이동·순차 배치와 각 결정의 근거를 확인하세요.", token);
  if (token !== runToken) return;
  setStreaming(false); setAgentState("completed"); setActiveStatus("completed");
  composer.placeholder = "이어서 질문하기";
  await sleep(1500 * SPEED);
  if (token !== runToken) return;

  /* ── 거짓 전제 정정 (C24 통합) — 잘못된 설비 수·절감액 전제를 실측으로 교정 ── */
  setAgentState("running"); setStreaming(true); setActiveStatus("running");
  await typeAndSend("좋네. 설비 20대 전부 심야로 돌리면 한 달에 2천만 원은 아끼겠는데?", token);
  if (token !== runToken) return;
  await sleep(400 * SPEED);
  await addThinking(
    "두 전제가 실데이터와 어긋난다 — 설비 수(20대?)와 절감액(월 2천만?). 온톨로지 재조회로 " +
    "설비 수를 확정하고, 전량 심야 이동을 제약 포함으로 시뮬레이션해 왜 불가한지 근거를 든다.", 2, token);
  if (token !== runToken) return;
  await addTool("query_objectset", { objectType: "Equipment", count: true }, 800,
    "total = 6 (스케줄 대상 4 · 공용 2) — '20대'는 실데이터와 불일치", token);
  if (token !== runToken) return;
  await addTool("execute_code", { note: "전량 심야 이동 가정 시뮬레이션 (납기·공용설비 제약 포함)" }, 1600,
    "실행 불가 — PO-1038 납기 11시간 초과 · CMP-01 동시부하 128%", token);
  if (token !== runToken) return;
  await addAgentText(
    "확인 결과, 두 가지를 정정드립니다.\n" +
    "- 설비는 20대가 아니라 **6대**(스케줄 대상 4대 + 공용 2대)입니다\n" +
    "- 전량 심야 이동은 시뮬레이션 결과 **PO-1038 납기 11시간 초과 · CMP-01 동시부하 128%**로 실행 불가 — 그래서 **38%가 상한**입니다\n" +
    "- 실제 월 절감은 **약 ₩736만**(주 −₩184만 × 4주) + **0.7 TOE · 3.8 tCO2**로, 2천만 원에는 미치지 않습니다\n" +
    "잘못된 전제로 계산하면 의사결정이 왜곡되므로, 항상 실측 기준으로 정정해 답합니다.", token);
  if (token !== runToken) return;

  await addAgentText("이제 확정된 스케줄을 온톨로지 Shift 객체에 반영하겠습니다. 쓰기 작업이므로 승인이 필요합니다.", token);
  if (token !== runToken) return;
  await addTool("validate_action", { actionType: "apply-schedule", week: "07/13~07/19", dryRun: true }, 1100,
    "valid — Shift 12건 갱신 예정 (미리보기, 변경 없음)", token);
  if (token !== runToken) return;

  /* 승인 게이트 — 데모 방문자가 직접 결정 */
  setStreaming(false); setAgentState("awaiting_approval"); setActiveStatus("awaiting");
  const gate = addApprovalEvent("apply_action");
  const allowed = await showHardCard(gate, [
    ["액션", "apply_action"],
    ["actionType", "apply-schedule"],
    ["week", "07/13 ~ 07/19"],
    ["shifts", "12건 (validate 통과)"],
    ["변경 근거", "PO-1042 심야 이동 + INJ 순차 기동"],
  ]);
  if (token !== runToken) return;

  setAgentState("running"); setStreaming(true); setActiveStatus("running");
  if (allowed) {
    await addTool("apply_action", { actionType: "apply-schedule", shifts: 12, week: "07/13~07/19" }, 1400,
      "applied — Shift 12건 커밋, 차주 스케줄 발효", token, { gated: true });
    if (token !== runToken) return;
    await addAgentText(
      "승인 확인 — **다음 주 가동 스케줄이 온톨로지에 반영**되었습니다. " +
      "주간 전력비 **−₩184만**, 월간 **0.7 TOE · 3.8 tCO2** 절감이 예상되며, " +
      "발효 후 실측과 예측의 편차를 추적해 다음 스케줄에 반영합니다.", token);
  } else {
    await addAgentText(
      "거부 확인 — **아무 것도 변경하지 않았습니다.** 스케줄 초안과 분석 근거는 그대로 보존되며, " +
      "언제든 다시 승인 단계에서 적용할 수 있습니다.", token);
  }
  if (token !== runToken) return;
  finishRun(token);
}

/* ═══════ 시나리오 2 — 설비 건강 리포트(C13/C28) + 거짓 전제 정정(C24) ═══════ */
async function playFleet(token) {
  setAgentState("running"); setStreaming(true); setActiveStatus("running");
  await typeAndSend("전체 설비 상태를 분석해서 요약·표·차트가 들어간 PDF 리포트로 만들어줘", token);
  if (token !== runToken) return;

  await sleep(500 * SPEED);
  await addThinking(
    "설비 리포트 요청. 온톨로지에서 설비 객체 타입을 확인하고 전체 인스턴스를 조회한다. " +
    "상태 분포와 시계열 통계를 계산한 뒤, 단일 DataFrame에서 요약·표·차트를 파생시켜 " +
    "세 레이어의 수치가 서로 어긋나지 않는 PDF를 생성한다.", 3, token);
  if (token !== runToken) return;

  addPlanCard([
    "설비 객체·인스턴스 조회",
    "상태 분포·시계열 통계 계산",
    "리포트 산출물 생성",
  ]);

  await addAgentText("설비 현황을 조회하고 리포트를 생성하겠습니다. 먼저 온톨로지에서 설비 데이터를 확인합니다.", token);
  if (token !== runToken) return;

  await addTool("search_object_types", { query: "설비" }, 900,
    "Accura (전력 계측 설비) — properties: model, status, assignee … instances: 9", token);
  if (token !== runToken) return;
  await addTool("query_objectset", { objectType: "Accura", pageSize: 100 }, 1100,
    "9 instances — RUNNING 6 · IDLE 2 · FAULT 1", token);
  if (token !== runToken) return;
  addArtifact("object_table", "Accura 설비 현황");
  planAdvance(1);
  await addTool("query_timeseries", { property: "active_power", range: "7d", agg: "1h" }, 1200,
    "9 series · 1,512 points — ACC-06 은 6/8 09:20 이후 결측(고장 구간)", token);
  if (token !== runToken) return;
  await addTool("execute_code", { note: "call_tool 팬아웃 — 9대 통계 일괄 계산" }, 1900,
    "mean/median/p95 per device … anomaly: ACC-06 (전력 0 고정), 결측 1구간", token);
  if (token !== runToken) return;
  addArtifact("chart", "설비 상태 분포");
  planAdvance(2);
  await addTool("run_code", { files: ["equipment_health_report.pdf", "status_distribution.png"] }, 2300,
    "generated 2 files — 요약·표·차트 동일 DataFrame 파생(수치 정합)", token);
  if (token !== runToken) return;
  addFileArtifact("설비 건강 리포트", [
    { name: "equipment_health_report.pdf", size: "24.1 KB", type: "pdf" },
    { name: "status_distribution.png", size: "18.4 KB", type: "png" },
  ]);
  planComplete();
  await addAgentText(
    "리포트를 생성했습니다. 핵심 요약:\n" +
    "- 전체 **9대** 중 가동 **6** · 대기 **2** · 고장 **1** (`ACC-06`)\n" +
    "- `ACC-06`은 6/8 09:20 이후 전력 데이터 결측 — 리포트에는 **결측으로 정직 표기**했습니다\n" +
    "- 요약 문장·표·차트는 단일 데이터 파생이라 수치가 상호 일치합니다", token);
  if (token !== runToken) return;
  setStreaming(false); setAgentState("completed"); setActiveStatus("completed");
  composer.placeholder = "이어서 질문하기";
  await sleep(1600 * SPEED);
  if (token !== runToken) return;

  /* 거짓 전제 정정 (C24) */
  setAgentState("running"); setStreaming(true); setActiveStatus("running");
  await typeAndSend("우리 설비 25대 중에 고장 비율이 얼마나 되지?", token);
  if (token !== runToken) return;
  await sleep(400 * SPEED);
  await addThinking(
    "사용자는 25대를 전제했지만 방금 조회한 결과는 9대였다. 전제를 그대로 받아 계산하면 " +
    "비율이 왜곡된다. 실데이터로 재확인해 전제를 정정하고 올바른 분모로 계산한다.", 2, token);
  if (token !== runToken) return;
  await addTool("query_objectset", { objectType: "Accura", count: true }, 800,
    "total = 9 (25 아님 — 사용자 전제와 불일치)", token);
  if (token !== runToken) return;
  await addAgentText(
    "확인 결과, 말씀하신 25대가 아니라 실제 등록된 설비는 **9대**입니다.\n" +
    "고장(FAULT)은 `ACC-06` **1대**로, 고장 비율은 **1/9 = 11.1%** 입니다. " +
    "25를 분모로 쓰면 4%로 왜곡되므로 실측 기준으로 정정해 계산했습니다.", token);
  if (token !== runToken) return;
  finishRun(token);
}

/* ── 공통 종료 — 완료 상태 + 전환/재생 옵션 ── */
function finishRun(token) {
  if (token !== runToken) return;
  setStreaming(false); setAgentState("completed"); setActiveStatus("completed");
  composer.placeholder = "이어서 질문하기";
  if (window.self !== window.top) return; /* 히어로 임베드에서는 다시보기/시나리오 전환 옵션을 표시하지 않고 여기서 재생을 마친다 */
  const other = currentScenario === "energy" ? "fleet" : "energy";
  const otherLabel = other === "energy"
    ? "에너지/탄소 최적 스케줄 데모 보기 →"
    : "제조 설비 리포트 데모 보기 →";
  endOptions([
    { label: "처음부터 다시 보기 ↻", onClick: () => replay() },
    { label: otherLabel, onClick: () => switchScenario(other) },
  ]);
}

/* ── 온보딩(EmptyOnboarding.tsx 미러) — 진입 기본 화면: 안내 문구 + 예시 질문 카드 ── */
const STARTERS = [
  {
    key: "energy",
    icon: "ph-lightning",
    title: "에너지/탄소 최적 가동 스케줄",
    prompt: "다음 주 발주 물량을 납기 내 처리하면서 에너지 비용과 탄소 배출을 최소화하는 가동 스케줄을 만들어줘",
  },
  {
    key: "fleet",
    icon: "ph-wrench",
    title: "설비 건강 리포트 생성",
    prompt: "전체 설비 상태를 분석해서 요약·표·차트가 들어간 PDF 리포트로 만들어줘",
  },
];
function showOnboarding() {
  /* 예시 카드는 장식(비클릭) — 데모는 아래 컴포저에 쿼리가 바로 타이핑되며 시작된다 */
  const cards = [...STARTERS]
    .sort((a, b) => (a.key === DEFAULT_KEY ? -1 : b.key === DEFAULT_KEY ? 1 : 0))
    .map((s) => `
      <div class="rfn-agent-ws-card" style="pointer-events:none">
        <span class="rfn-agent-ws-card-ic"><i class="ph-bold ${s.icon}" style="font-size:18px"></i></span>
        <span class="rfn-agent-ws-card-main">
          <span class="rfn-agent-ws-card-title">${esc(s.title)}</span>
          <span class="rfn-agent-ws-card-prompt">${esc(s.prompt)}</span>
        </span>
      </div>`).join("");
  $("onboard").innerHTML = `
    <div class="rfn-agent-ws-empty">
      <div class="rfn-agent-ws-empty-orb"><i class="ph-fill ph-sparkle" style="font-size:26px"></i></div>
      <h2 class="rfn-agent-ws-empty-title">무엇을 도와드릴까요?</h2>
      <p class="rfn-agent-ws-empty-sub">온톨로지 위에서 조회·분석부터 파일 산출·액션 실행까지 수행하는 Refinery AI 에이전트입니다.</p>
      <div class="rfn-agent-ws-cards">${cards}</div>
    </div>`;
  $("onboard").hidden = false;
  $("thread").hidden = true;
}

/* ── 리셋/시작/전환 ── */
function resetState() {
  runToken++;
  timeline = []; seq = 0;
  feed.innerHTML = ""; gateSlot.innerHTML = "";
  composer.value = ""; composer.placeholder = "무엇을 도와드릴까요?";
  topbarTitle.textContent = "";
  setStreaming(false); setAgentState("idle");
  setSide(false); artDetailId = null; artViewMode = "grid"; planCard = null; toolGroup = null; selectTab("plan");
  updateBadge();
}
function playScenario() {
  const token = runToken;
  if (currentScenario === "energy") playEnergy(token);
  else playFleet(token);
}
function startScenario(key) {
  currentScenario = key;
  resetState();
  showOnboarding(); /* 온보딩을 배경으로 두고 즉시 쿼리 타이핑 시작 — 전송 시 스레드 전환 */
  setActiveStatus("running");
  setTimeout(() => playScenario(), 300);
}
function replay() { startScenario(currentScenario); }
function switchScenario(key) { startScenario(key); }
function newSession() { startScenario(DEFAULT_KEY); }

/* 부모 페이지(index.html)가 히어로 섹션 재진입을 감지했을 때
   postMessage로 재생 요청을 보내면 처음부터 다시 재생한다.
   (file:// 로컬 열람 시에도 동작하도록 postMessage 방식 사용, targetOrigin 제한 없음) */
window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'refinery-hero-replay') {
    replay();
  }
});

/* 시작 — 기본 화면(온보딩)을 보여주면서 바로 쿼리 작성이 시작된다 */
renderSessions();
renderSide();
startScenario(DEFAULT_KEY);
</script>
</body>
</html>
